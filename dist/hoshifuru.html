      ctx.moveTo(-11, -22);
      ctx.bezierCurveTo(-15, -6, -15, 4, -13, 12);
      ctx.quadraticCurveTo(-8.5, 9, -4.5, 12.5);
      ctx.quadraticCurveTo(0, 9.5, 4.5, 12.5);
      ctx.quadraticCurveTo(8.5, 9, 13, 12);
      ctx.bezierCurveTo(15, 4, 15, -6, 11, -22);
      ctx.closePath();
      break;
    case 'longStraight':
      ctx.moveTo(-11, -22);
      ctx.lineTo(-13.5, 17);
      ctx.quadraticCurveTo(0, 20.5, 13.5, 17);
      ctx.lineTo(11, -22);
      ctx.closePath();
      break;
    case 'sidetail':
      ctx.ellipse(0, -17, 12.2, 11.5, 0, 0, TAU);
      ctx.moveTo(-10, -24);
      ctx.bezierCurveTo(-20, -22, -20, -8, -16, 0);
      ctx.quadraticCurveTo(-13, -6, -8, -16);
      ctx.closePath();
      break;
    default:
      ctx.ellipse(0, -16.5, 12.3, 12, 0, 0, TAU);
  }
  ctx.fill();
}

function drawEyes(ctx, s, face) {
  for (const side of [-1, 1]) {
    const x = side * 4;
    if (face === 'happy') {
      ctx.strokeStyle = '#3a2020';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(x, -15.2, 2.2, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      continue;
    }
    const h = face === 'surprised' ? 3.7 : 3.1;
    ctx.fillStyle = '#2a1818';
    ell(ctx, x, -16.2, 2.45, h + 0.4); ctx.fill();
    ctx.fillStyle = s.eye;
    ell(ctx, x, -15.9, 1.9, h - 0.25); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ell(ctx, x, -17.2, 1.9, 1.3); ctx.fill();
    ctx.fillStyle = '#fff';
    ell(ctx, x - side * 0.2 - 0.6, -17.3, 0.85, 1.05); ctx.fill();
    if (face === 'smug') {
      ctx.fillStyle = s.skin;
      ctx.fillRect(x - 2.8, -20.8, 5.6, 3.6);
      ctx.strokeStyle = '#2a1818';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 2.6, -17.2); ctx.lineTo(x + 2.6, -17.2); ctx.stroke();
    }
  }
  if (face === 'angry' || face === 'sad') {
    ctx.strokeStyle = s.hairDark;
    ctx.lineWidth = 1.2;
    for (const side of [-1, 1]) {
      const inner = face === 'angry' ? -20.4 : -21.8;
      const outer = face === 'angry' ? -22 : -20.6;
      ctx.beginPath();
      ctx.moveTo(side * 1.8, inner);
      ctx.lineTo(side * 6, outer);
      ctx.stroke();
    }
  }
}

function drawMouth(ctx, face) {
  ctx.strokeStyle = '#8a3030';
  ctx.fillStyle = '#b0303c';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  switch (face) {
    case 'happy':
      ctx.arc(0, -12.4, 2, 0, Math.PI); ctx.closePath(); ctx.fill();
      break;
    case 'surprised':
      ell(ctx, 0, -11.8, 1.2, 1.6); ctx.fill();
      break;
    case 'angry':
      ctx.moveTo(-1.8, -11.5); ctx.lineTo(0, -12.1); ctx.lineTo(1.8, -11.5); ctx.stroke();
      break;
    case 'sad':
      ctx.arc(0, -10.6, 1.6, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke();
      break;
    case 'smug':
      ctx.moveTo(-1.6, -12.2); ctx.quadraticCurveTo(0.5, -11, 2, -12.8); ctx.stroke();
      break;
    default:
      ctx.arc(0, -12.6, 1.5, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke();
  }
}

function drawArms(ctx, s, pose) {
  const sleeve = s.sleeveColor || '#ffffff';
  for (const side of [-1, 1]) {
    if (pose === 'spread') {
      ctx.strokeStyle = sleeve;
      ctx.lineWidth = 4.2;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(side * 5, -5.5); ctx.lineTo(side * 18, -7); ctx.stroke();
      ctx.fillStyle = s.skin;
      ell(ctx, side * 20.5, -7.2, 2, 2); ctx.fill();
      continue;
    }
    if (s.sleeve === 'detached') {
      ctx.fillStyle = s.skin;
      ell(ctx, side * 6.5, -6, 2.2, 2.4); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#d8d8e6';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(side * 6.5, -4); ctx.lineTo(side * 9.5, -5);
      ctx.lineTo(side * 15, 8); ctx.lineTo(side * 7.5, 8); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#d61f2c';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(side * 6.8, -3.6); ctx.lineTo(side * 9.6, -4.6); ctx.stroke();
      ctx.fillStyle = s.skin;
      ell(ctx, side * 10.5, 8.4, 1.8, 1.8); ctx.fill();
    } else {
      ctx.strokeStyle = s.sleeve === 'long' ? sleeve : s.top;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(side * 6.5, -5); ctx.lineTo(side * 8.5, 4); ctx.stroke();
      if (s.sleeve === 'puff') {
        ctx.fillStyle = sleeve;
        ell(ctx, side * 7, -5.5, 3.3, 3); ctx.fill();
      }
      ctx.fillStyle = s.skin;
      ell(ctx, side * 8.7, 5.5, 1.7, 1.7); ctx.fill();
    }
  }
}

function drawChibi(ctx, id, o = {}) {
  const s = CHARA[id];
  const t = o.t || 0;
  const face = o.face || 'normal';
  const pose = o.pose || s.pose || 'stand';
  ctx.save();
  ctx.translate(0, Math.sin(t * 0.07) * 0.8);

  if (s.wings === 'fairy') drawFairyWings(ctx, t, 'rgba(190,225,255,0.42)');
  if (s.wings === 'ice') drawIceWings(ctx, t);
  drawBackHair(ctx, s);
  if (s.acc === 'reimuBow') drawBigBow(ctx, 0, -31, '#d61f2c', '#ffffff', 1);
  if (s.acc === 'bigBow') drawBigBow(ctx, 0, -30, '#3a6ef0', '#dff4ff', 0.95);

  // 脚
  ctx.fillStyle = s.legs;
  ctx.fillRect(-5, 13, 3, 9);
  ctx.fillRect(2, 13, 3, 9);
  ctx.fillStyle = s.shoes;
  ell(ctx, -3.5, 22.3, 2.6, 1.6); ctx.fill();
  ell(ctx, 3.5, 22.3, 2.6, 1.6); ctx.fill();

  // スカート
  ctx.fillStyle = s.dress;
  ctx.beginPath();
  ctx.moveTo(-5.5, 1);
  ctx.lineTo(5.5, 1);
  ctx.quadraticCurveTo(10, 8, 12.5, 16);
  ctx.quadraticCurveTo(6, 18.6, 0, 17.6);
  ctx.quadraticCurveTo(-6, 18.6, -12.5, 16);
  ctx.quadraticCurveTo(-10, 8, -5.5, 1);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.moveTo(2, 2); ctx.quadraticCurveTo(8, 9, 10, 16.6); ctx.lineTo(5, 17.6); ctx.quadraticCurveTo(5, 9, 2, 2);
  ctx.fill();
  if (s.apron) {
    ctx.fillStyle = s.apron;
    ctx.beginPath();
    ctx.moveTo(-4.8, 2); ctx.lineTo(4.8, 2); ctx.lineTo(7.2, 15.5);
    ctx.quadraticCurveTo(0, 17.5, -7.2, 15.5); ctx.closePath();
    ctx.fill();
  }
  if (s.trim) {
    ctx.strokeStyle = s.trim;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(12.5, 16); ctx.quadraticCurveTo(6, 18.6, 0, 17.6); ctx.quadraticCurveTo(-6, 18.6, -12.5, 16);
    ctx.stroke();
  }

  // 上半身
  ctx.fillStyle = s.top;
  ctx.beginPath();
  ctx.moveTo(-6.5, -7.5); ctx.lineTo(6.5, -7.5); ctx.lineTo(5.5, 2); ctx.lineTo(-5.5, 2); ctx.closePath();
  ctx.fill();
  if (s.vest) {
    ctx.fillStyle = s.shirt;
    ctx.beginPath();
    ctx.moveTo(-3, -7.5); ctx.lineTo(3, -7.5); ctx.lineTo(1.4, 2); ctx.lineTo(-1.4, 2); ctx.closePath();
    ctx.fill();
  }
  drawArms(ctx, s, pose);
  ctx.fillStyle = s.collar;
  ctx.beginPath();
  ctx.moveTo(-5.2, -8.5); ctx.lineTo(5.2, -8.5); ctx.lineTo(3.2, -4); ctx.lineTo(0, -5.6); ctx.lineTo(-3.2, -4);
  ctx.closePath();
  ctx.fill();
  if (s.tie) {
    ctx.fillStyle = s.tie;
    ctx.beginPath(); ctx.moveTo(-1.2, -5.5); ctx.lineTo(1.2, -5.5); ctx.lineTo(1.6, 0.5); ctx.lineTo(0, 2); ctx.lineTo(-1.6, 0.5);
    ctx.closePath(); ctx.fill();
  } else if (s.neck) {
    drawSmallBow(ctx, 0, -5.4, s.neck, 0.6);
  }

  // 頭
  ctx.fillStyle = s.skin;
  ell(ctx, 0, -18, 10, 10.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,140,0.33)';
  ell(ctx, -6.4, -13.2, 2.2, 1.2); ctx.fill();
  ell(ctx, 6.4, -13.2, 2.2, 1.2); ctx.fill();
  drawEyes(ctx, s, face);
  drawMouth(ctx, face);

  // 前髪
  ctx.fillStyle = s.hair;
  ctx.beginPath();
  ctx.arc(0, -18.5, 11.5, Math.PI * 0.95, Math.PI * 2.05);
  ctx.lineTo(9, -13); ctx.lineTo(7.5, -18.5); ctx.lineTo(5, -14.2); ctx.lineTo(3, -19.6);
  ctx.lineTo(0.5, -15); ctx.lineTo(-2, -19.6); ctx.lineTo(-4.5, -14.2); ctx.lineTo(-7, -18.5); ctx.lineTo(-9, -13);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = s.hairHi;
  ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(0, -19, 8.3, Math.PI * 1.15, Math.PI * 1.55); ctx.stroke();
  // もみあげ
  ctx.fillStyle = s.hair;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 9.5, -20);
    ctx.quadraticCurveTo(side * 13, -11, side * 11, -3);
    ctx.quadraticCurveTo(side * 9.5, -8, side * 8.2, -14);
    ctx.closePath();
    ctx.fill();
    if (s.tubes) {
      ctx.fillStyle = '#f6ecc4';
      ctx.fillRect(side * 11.2 - 1.6, -10, 3.2, 4.2);
      ctx.fillStyle = '#d61f2c';
      ctx.fillRect(side * 11.2 - 1.6, -8.4, 3.2, 1);
      ctx.fillStyle = s.hair;
    }
  }
  if (s.braid) {
    ctx.fillStyle = s.hair;
    for (let i = 0; i < 4; i++) { ell(ctx, -11.5 + i * 0.3, -6 + i * 3.2, 2, 1.9); ctx.fill(); }
    drawSmallBow(ctx, -10.6, 7, '#ffffff', 0.45);
  }

  // 頭の飾り
  switch (s.acc) {
    case 'witchHat': drawWitchHat(ctx); break;
    case 'redRibbon': drawSmallBow(ctx, -8.5, -27, '#d0202e', 0.75); break;
    case 'yellowBow': drawSmallBow(ctx, -11, -23, '#f2d23a', 0.8); break;
    case 'starRibbon':
      drawSmallBow(ctx, 0, -29, '#2a4cc4', 0.9);
      ctx.save(); ctx.translate(0, -29); ctx.fillStyle = '#ffe45a'; starPath(ctx, 2.8, 1.2); ctx.fill(); ctx.restore();
      break;
  }
  ctx.restore();
}

function drawWitchHat(ctx) {
  ctx.fillStyle = '#18161e';
  ell(ctx, 0, -27, 18.5, 4.8, -0.06); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-9, -28.5);
  ctx.quadraticCurveTo(-5, -41, 1, -48);
  ctx.quadraticCurveTo(7, -53, 13.5, -47.5);
  ctx.quadraticCurveTo(7.5, -46.5, 5.5, -41);
  ctx.quadraticCurveTo(7.5, -34, 9, -28.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(-9, -28.5); ctx.quadraticCurveTo(0, -30, 9, -28.5);
  ctx.lineTo(8.4, -31.6); ctx.quadraticCurveTo(0, -33, -8.4, -31.6); ctx.closePath();
  ctx.fill();
  drawSmallBow(ctx, 8.6, -30, '#ffffff', 0.65);
}

// 自機（後ろ姿）
function drawPlayerBack(ctx, id, t, tilt) {
  ctx.save();
  ctx.transform(1, 0, -tilt * 0.14, 1, 0, 0);
  const sway = Math.sin(t * 0.15);
  if (id === 'reimu') {
    for (const side of [-1, 1]) {
      const out = side * (14 - tilt * side * 2.5);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#cfd0e0';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(side * 5.5, -5); ctx.lineTo(side * 9, -6);
      ctx.lineTo(out, 8 + sway); ctx.lineTo(side * 7, 8); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#d61f2c';
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(side * 5.8, -4.6); ctx.lineTo(side * 9, -5.6); ctx.stroke();
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-5, 12, 3, 8); ctx.fillRect(2, 12, 3, 8);
    ctx.fillStyle = '#d61f2c';
    ctx.beginPath();
    ctx.moveTo(-5.5, 0); ctx.lineTo(5.5, 0); ctx.lineTo(11, 14);
    ctx.quadraticCurveTo(0, 16.5, -11, 14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(11, 14); ctx.quadraticCurveTo(0, 16.5, -11, 14); ctx.stroke();
    ctx.fillStyle = '#d61f2c';
    ctx.fillRect(-6, -7, 12, 8);
    // 髪
    ctx.fillStyle = '#3e2218';
    ctx.beginPath();
    ctx.moveTo(-9.5, -18);
    ctx.bezierCurveTo(-12, -8, -12, 0, -10, 7);
    ctx.quadraticCurveTo(-5, 4.5 + sway, 0, 7.5);
    ctx.quadraticCurveTo(5, 4.5 - sway, 10, 7);
    ctx.bezierCurveTo(12, 0, 12, -8, 9.5, -18);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4a2a1e';
    ell(ctx, 0, -17, 10, 10); ctx.fill();
    ctx.strokeStyle = '#7a4a36'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, -17, 7.5, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
    drawBigBow(ctx, 0, -24, '#d61f2c', '#ffffff', 0.95);
  } else {
    for (const side of [-1, 1]) {
      ctx.strokeStyle = '#22202c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(side * 6, -4); ctx.lineTo(side * (9 - tilt * side), 5); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ell(ctx, side * 6.8, -4.5, 3.2, 3); ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-5, 12, 3, 8); ctx.fillRect(2, 12, 3, 8);
    ctx.fillStyle = '#22202c';
    ctx.beginPath();
    ctx.moveTo(-5.5, 0); ctx.lineTo(5.5, 0); ctx.lineTo(11.5, 14);
    ctx.quadraticCurveTo(0, 16.5, -11.5, 14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(11.5, 14); ctx.quadraticCurveTo(0, 16.5, -11.5, 14); ctx.stroke();
    ctx.fillStyle = '#22202c';
    ctx.fillRect(-6, -7, 12, 8);
    // エプロンのリボン
    ctx.fillStyle = '#ffffff';
    ell(ctx, -4.2, 5.5, 3.4, 2.1); ctx.fill();
    ell(ctx, 4.2, 5.5, 3.4, 2.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-1.2, 6); ctx.lineTo(-3.5, 12.5 + sway); ctx.lineTo(-1.8, 12.5 + sway); ctx.lineTo(0, 6.5); ctx.fill();
    ctx.beginPath(); ctx.moveTo(1.2, 6); ctx.lineTo(3.5, 12.5 - sway); ctx.lineTo(1.8, 12.5 - sway); ctx.lineTo(0, 6.5); ctx.fill();
    ell(ctx, 0, 5.8, 1.6, 1.6); ctx.fill();
    // 髪
    ctx.fillStyle = '#e8c850';
    ctx.beginPath();
    ctx.moveTo(-8.5, -18);
    ctx.bezierCurveTo(-11, -8, -10.5, -2, -9, 3);
    ctx.quadraticCurveTo(-4.5, 0.5 + sway, 0, 3.5);
    ctx.quadraticCurveTo(4.5, 0.5 - sway, 9, 3);
    ctx.bezierCurveTo(10.5, -2, 11, -8, 8.5, -18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,245,190,0.7)';
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(-3, -12); ctx.quadraticCurveTo(-4, -4, -3, 1); ctx.moveTo(3, -12); ctx.quadraticCurveTo(4, -4, 3, 1); ctx.stroke();
    // 三つ編み
    ctx.fillStyle = '#e8c850';
    for (let i = 0; i < 3; i++) { ell(ctx, -9.5 - i * 0.3, -6 + i * 3, 1.8, 1.7); ctx.fill(); }
    // 帽子
    ctx.fillStyle = '#18161e';
    ell(ctx, 0, -21, 18, 6.5, tilt * 0.08); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8.5, -23);
    ctx.quadraticCurveTo(-4, -35, 2, -41);
    ctx.quadraticCurveTo(8, -45 + sway, 13, -40);
    ctx.quadraticCurveTo(7, -39, 5.5, -34);
    ctx.quadraticCurveTo(7.5, -28, 8.5, -23);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-8.5, -23); ctx.quadraticCurveTo(0, -21, 8.5, -23);
    ctx.lineTo(8, -26); ctx.quadraticCurveTo(0, -24.4, -8, -26); ctx.closePath(); ctx.fill();
    drawSmallBow(ctx, 0, -24.5, '#ffffff', 0.8);
  }
  ctx.restore();
}

// ------------------------------------------------------------
//  ザコ敵
// ------------------------------------------------------------
const FAIRY_COLORS = {
  blue: { hair: '#f2e48a', dress: '#3a66e0' },
  red: { hair: '#f7c08a', dress: '#d8303a' },
  green: { hair: '#e8f0a0', dress: '#2e9e4a' },
  yellow: { hair: '#fff0c0', dress: '#e0a820' },
  purple: { hair: '#f0d8ff', dress: '#8a42d0' },
  white: { hair: '#c8d8ff', dress: '#e8e8f4' },
};

function drawFairy(ctx, color, t, big = false) {
  const c = FAIRY_COLORS[color] || FAIRY_COLORS.blue;
  ctx.save();
  if (big) ctx.scale(1.5, 1.5);
  ctx.translate(0, Math.sin(t * 0.12) * 1.2);
  drawFairyWings(ctx, t, 'rgba(200,230,255,0.45)', 0.62);
  ctx.fillStyle = c.dress;
  ctx.beginPath();
  ctx.moveTo(-3.2, -2); ctx.lineTo(3.2, -2); ctx.lineTo(7, 9); ctx.quadraticCurveTo(0, 11, -7, 9);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(7, 9); ctx.quadraticCurveTo(0, 11, -7, 9); ctx.stroke();
  ctx.fillStyle = '#ffe9dc';
  ell(ctx, -4.6, 2, 1.4, 1.4); ctx.fill();
  ell(ctx, 4.6, 2, 1.4, 1.4); ctx.fill();
  ell(ctx, 0, -7, 5.6, 5.6); ctx.fill();
  ctx.fillStyle = c.hair;
  ctx.beginPath();
  ctx.arc(0, -7.5, 6.4, Math.PI * 0.9, Math.PI * 2.1);
  ctx.lineTo(4, -5.5); ctx.lineTo(2, -8.2); ctx.lineTo(0, -6); ctx.lineTo(-2, -8.2); ctx.lineTo(-4, -5.5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a1a2a';
  ell(ctx, -2.2, -5.5, 0.9, 1.3); ctx.fill();
  ell(ctx, 2.2, -5.5, 0.9, 1.3); ctx.fill();
  ctx.restore();
}

const KEDAMA_COLORS = { white: '#f4f0ff', blue: '#8ab8ff', red: '#ff9a9a', green: '#9aeea0', purple: '#d0a0ff' };

function drawKedama(ctx, color, t) {
  const col = KEDAMA_COLORS[color] || KEDAMA_COLORS.white;
  ctx.save();
  ctx.rotate(t * 0.05);
  ctx.fillStyle = col;
  ctx.beginPath();
  const n = 16;
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * TAU;
    const r = i % 2 === 0 ? 10.5 : 7.5;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 9);
  g.addColorStop(0, 'rgba(255,255,255,0.8)');
  g.addColorStop(1, 'rgba(0,0,40,0.25)');
  ctx.fillStyle = g;
  ell(ctx, 0, 0, 8, 8); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff';
  ell(ctx, -2.8, -1, 2.2, 2.6); ctx.fill();
  ell(ctx, 2.8, -1, 2.2, 2.6); ctx.fill();
  ctx.fillStyle = '#222';
  ell(ctx, -2.5, -0.6, 1.1, 1.5); ctx.fill();
  ell(ctx, 2.5, -0.6, 1.1, 1.5); ctx.fill();
}

// 立ち絵（会話・カットイン用）
function drawPortrait(ctx, id, x, y, scale, face = 'normal', t = 0, flip = false) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip ? -scale : scale, scale);
  drawChibi(ctx, id, { t, face, pose: 'stand' });
  ctx.restore();
}

</script>
<script>
'use strict';
// ============================================================
//  背景（ステージ背景・スペルカード背景）
//  フィールド座標 (0,0)-(384,448) に描く
// ============================================================

function makeFogTile(w, h, count, alpha, seed) {
  const c = makeCanvas(w, h);
  const x = c.getContext('2d');
  const r = new RNG(seed);
  for (let i = 0; i < count; i++) {
    const px = r.next() * w, py = r.next() * h, rad = 40 + r.next() * 90;
    for (const oy of [-h, 0, h]) {
      const g = x.createRadialGradient(px, py + oy, 0, px, py + oy, rad);
      g.addColorStop(0, `rgba(220,230,255,${alpha})`);
      g.addColorStop(1, 'rgba(220,230,255,0)');
      x.fillStyle = g;
      x.fillRect(px - rad, py + oy - rad, rad * 2, rad * 2);
    }
  }
  return c;
}

function drawScrollingTile(ctx, tile, scroll, alpha = 1) {
  const h = tile.height;
  const y = scroll % h;
  ctx.globalAlpha = alpha;
  ctx.drawImage(tile, 0, y - h, FIELD_W, h);
  ctx.drawImage(tile, 0, y, FIELD_W, h);
  ctx.globalAlpha = 1;
}

// 流れ星（背景演出）
class Meteors {
  constructor(rate) { this.list = []; this.rate = rate; }
  update() {
    if (Math.random() < this.rate) {
      const fromLeft = Math.random() < 0.5;
      const sp = frand(5, 9);
      const a = fromLeft ? frand(20, 50) * DEG : frand(130, 160) * DEG;
      this.list.push({ x: fromLeft ? frand(-40, 200) : frand(184, 424), y: frand(-30, 150), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: frand(30, 60), max: 0, hue: pick(['255,255,220', '200,230,255', '255,210,240']) });
      this.list[this.list.length - 1].max = this.list[this.list.length - 1].life;
    }
    for (const m of this.list) { m.x += m.vx; m.y += m.vy; m.life--; }
    this.list = this.list.filter(m => m.life > 0);
  }
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const m of this.list) {
      const a = Math.min(1, m.life / 15) * 0.9;
      const tx = m.x - m.vx * 8, ty = m.y - m.vy * 8;
      const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
      g.addColorStop(0, `rgba(${m.hue},${a})`);
      g.addColorStop(1, `rgba(${m.hue},0)`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.8, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ------------------------------------------------------------
//  1面：夜の森
// ------------------------------------------------------------
class ForestBG {
  constructor() {
    this.t = 0;
    this.scroll = 0;
    this.tile = ForestBG.makeTile();
    this.fog = makeFogTile(FIELD_W, 448, 14, 0.07, 7);
    this.meteors = new Meteors(1 / 70);
    this.flies = [];
    for (let i = 0; i < 18; i++) this.flies.push({ x: frand(FIELD_W), y: frand(FIELD_H), p: frand(TAU), s: frand(0.3, 0.8) });
  }
  static pathX(y, h) { return FIELD_W / 2 + Math.sin((y / h) * TAU) * 60 + Math.sin((y / h) * TAU * 2) * 20; }
  static makeTile() {
    const w = FIELD_W, h = 640;
    const c = makeCanvas(w, h);
    const x = c.getContext('2d');
    const r = new RNG(12345);
    x.fillStyle = '#08130f';
    x.fillRect(0, 0, w, h);
    // 小道
    for (let y = -20; y < h + 20; y += 3) {
      const px = ForestBG.pathX(y, h);
      x.fillStyle = 'rgba(58,48,36,0.18)';
      x.beginPath(); x.arc(px, y, 28, 0, TAU); x.fill();
    }
    // 木々
    const trees = [];
    for (let i = 0; i < 120; i++) {
      const ty = r.next() * h;
      const tr = 16 + r.next() * 28;
      let tx = r.next() * (w + 40) - 20;
      const px = ForestBG.pathX(ty, h);
      if (Math.abs(tx - px) < tr * 0.5 + 34) tx = px + (tx < px ? -1 : 1) * (tr * 0.5 + 34 + r.next() * 30);
      trees.push({ x: tx, y: ty, r: tr, shade: r.next() });
    }
    trees.sort((a, b) => a.r - b.r);
    for (const oy of [-h, 0, h]) {
      for (const t of trees) {
        const cx = t.x, cy = t.y + oy;
        x.fillStyle = 'rgba(0,0,0,0.45)';
        x.beginPath(); x.arc(cx + 6, cy + 8, t.r, 0, TAU); x.fill();
        const g = x.createRadialGradient(cx - t.r * 0.35, cy - t.r * 0.35, t.r * 0.1, cx, cy, t.r);
        const lit = 40 + t.shade * 30;
        g.addColorStop(0, `rgb(${24 + t.shade * 10},${lit + 20},${lit})`);
        g.addColorStop(0.7, `rgb(12,${30 + t.shade * 15},24)`);
        g.addColorStop(1, 'rgb(6,16,12)');
        x.fillStyle = g;
        x.beginPath(); x.arc(cx, cy, t.r, 0, TAU); x.fill();
        x.fillStyle = 'rgba(120,170,200,0.06)';
        for (let k = 0; k < 4; k++) {
          const a = k * 1.7 + t.shade * 5;
          x.beginPath(); x.arc(cx + Math.cos(a) * t.r * 0.45, cy + Math.sin(a) * t.r * 0.45, t.r * 0.35, 0, TAU); x.fill();
        }
      }
    }
    return c;
  }
  update() {
    this.t++;
    this.scroll += 0.9;
    this.meteors.update();
    for (const f of this.flies) {
      f.p += 0.03;
      f.x += Math.cos(f.p * 0.7) * 0.3;
      f.y += f.s * 0.9 + Math.sin(f.p) * 0.2;
      if (f.y > FIELD_H + 10) { f.y = -10; f.x = frand(FIELD_W); }
    }
  }
  draw(ctx) {
    drawScrollingTile(ctx, this.tile, this.scroll);
    drawScrollingTile(ctx, this.fog, this.scroll * 1.6, 0.9);
    const g = ctx.createLinearGradient(0, 0, 0, FIELD_H);
    g.addColorStop(0, 'rgba(20,20,60,0.55)');
    g.addColorStop(0.5, 'rgba(10,10,40,0.15)');
    g.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    ctx.globalCompositeOperation = 'lighter';
    for (const f of this.flies) {
      const a = 0.3 + 0.3 * Math.sin(f.p * 3);
      ctx.fillStyle = `rgba(200,255,140,${a})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgba(200,255,140,${a * 0.2})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    this.meteors.draw(ctx);
  }
}

// ------------------------------------------------------------
//  2面：霧の湖
// ------------------------------------------------------------
class LakeBG {
  constructor() {
    this.t = 0;
    this.scroll = 0;
    this.tile = LakeBG.makeTile();
    this.fog1 = makeFogTile(FIELD_W, 448, 16, 0.11, 21);
    this.fog2 = makeFogTile(FIELD_W, 560, 10, 0.08, 33);
    this.meteors = new Meteors(1 / 50);
    this.glints = [];
    for (let i = 0; i < 40; i++) this.glints.push({ x: frand(FIELD_W), y: frand(FIELD_H), p: frand(TAU) });
  }
  static makeTile() {
    const w = FIELD_W, h = 512;
    const c = makeCanvas(w, h);
    const x = c.getContext('2d');
    const r = new RNG(999);
    x.fillStyle = '#0b2442';
    x.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      const px = r.next() * w, py = r.next() * h, len = 10 + r.next() * 40;
      for (const oy of [-h, 0, h]) {
        x.strokeStyle = `rgba(110,170,240,${0.05 + r.next() * 0.08})`;
        x.lineWidth = 1 + r.next();
        x.beginPath();
        x.moveTo(px - len / 2, py + oy);
        x.quadraticCurveTo(px, py + oy - 3, px + len / 2, py + oy);
        x.stroke();
      }
    }
    for (let i = 0; i < 70; i++) {
      const px = r.next() * w, py = r.next() * h;
      for (const oy of [-h, 0, h]) {
        x.fillStyle = `rgba(230,240,255,${0.2 + r.next() * 0.3})`;
        x.fillRect(px, py + oy, 1.4, 1.4);
      }
    }
    return c;
  }
  update() {
    this.t++;
    this.scroll += 1.1;
    this.meteors.update();
    for (const g of this.glints) {
      g.p += 0.05;
      g.y += 1.1;
      if (g.y > FIELD_H) { g.y -= FIELD_H; g.x = frand(FIELD_W); }
    }
  }
  draw(ctx) {
    drawScrollingTile(ctx, this.tile, this.scroll);
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.glints) {
      const a = Math.max(0, Math.sin(g.p)) * 0.5;
      ctx.fillStyle = `rgba(200,230,255,${a})`;
      ctx.fillRect(g.x - 3, g.y, 6 + Math.sin(g.p * 2) * 2, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
    drawScrollingTile(ctx, this.fog2, this.scroll * 0.7, 1);
    drawScrollingTile(ctx, this.fog1, this.scroll * 1.8, 1);
    const g = ctx.createLinearGradient(0, 0, 0, FIELD_H);
    g.addColorStop(0, 'rgba(30,40,80,0.35)');
    g.addColorStop(1, 'rgba(0,10,30,0.3)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    this.meteors.draw(ctx);
  }
}

// ------------------------------------------------------------
//  3面：星空
// ------------------------------------------------------------
class SkyBG {
  constructor() {
    this.t = 0;
    this.scroll = 0;
    this.milky = SkyBG.makeMilky();
    this.cloud = makeFogTile(FIELD_W, 700, 9, 0.13, 55);
    this.meteors = new Meteors(1 / 22);
    this.layers = [0.4, 0.9, 1.8].map((sp, li) => {
      const arr = [];
      for (let i = 0; i < 40 - li * 8; i++) arr.push({ x: frand(FIELD_W), y: frand(FIELD_H), p: frand(TAU), s: 0.6 + li * 0.5 });
      return { sp, arr };
    });
  }
  static makeMilky() {
    const w = FIELD_W, h = 900;
    const c = makeCanvas(w, h);
    const x = c.getContext('2d');
    const r = new RNG(4242);
    const bandX = y => w * 0.5 + Math.sin((y / h) * TAU) * 110;
    for (let i = 0; i < 90; i++) {
      const py = r.next() * h;
      const px = bandX(py) + (r.next() - 0.5) * 140;
      const rad = 30 + r.next() * 60;
      const hue = pick(['140,110,255', '90,140,255', '255,120,220', '120,200,255']);
      for (const oy of [-h, 0, h]) {
        const g = x.createRadialGradient(px, py + oy, 0, px, py + oy, rad);
        g.addColorStop(0, `rgba(${hue},0.08)`);
        g.addColorStop(1, `rgba(${hue},0)`);
        x.fillStyle = g;
        x.fillRect(px - rad, py + oy - rad, rad * 2, rad * 2);
      }
    }
    for (let i = 0; i < 900; i++) {
      const py = r.next() * h;
      const near = r.next() < 0.6;
      const px = near ? bandX(py) + (r.next() - 0.5) * 160 : r.next() * w;
      x.fillStyle = `rgba(255,255,255,${0.15 + r.next() * 0.5})`;
      const s = r.next() < 0.1 ? 1.6 : 0.9;
      x.fillRect(px, py, s, s);
      if (py < 10) x.fillRect(px, py + h, s, s);
      if (py > h - 10) x.fillRect(px, py - h, s, s);
    }
    return c;
  }
  update() {
    this.t++;
    this.scroll += 0.5;
    this.meteors.update();
    for (const L of this.layers) {
      for (const s of L.arr) {
        s.y += L.sp;
        s.p += 0.06;
        if (s.y > FIELD_H) { s.y -= FIELD_H; s.x = frand(FIELD_W); }
      }
    }
  }
  draw(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, FIELD_H);
    g.addColorStop(0, '#0a0620');
    g.addColorStop(1, '#1d1044');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    drawScrollingTile(ctx, this.milky, this.scroll);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of this.layers) {
      for (const s of L.arr) {
        const a = 0.35 + 0.35 * Math.sin(s.p);
        ctx.fillStyle = `rgba(230,235,255,${a})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    drawScrollingTile(ctx, this.cloud, this.scroll * 4, 0.8);
    this.meteors.draw(ctx);
  }
}

// ------------------------------------------------------------
//  スペルカード背景
// ------------------------------------------------------------
function drawSpellBG(ctx, kind, t) {
  ctx.save();
  switch (kind) {
    case 'rumia': {
      ctx.fillStyle = '#0c0008';
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      const mg = ctx.createRadialGradient(192, 140, 10, 192, 140, 140);
      mg.addColorStop(0, 'rgba(160,20,40,0.55)');
      mg.addColorStop(0.45, 'rgba(90,0,30,0.35)');
      mg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = mg;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.translate(192, 180);
      for (let i = 0; i < 7; i++) {
        ctx.save();
        ctx.rotate(t * 0.006 + (i * TAU) / 7);
        ctx.fillStyle = 'rgba(70,0,40,0.28)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(160, -60, 330, 40);
        ctx.quadraticCurveTo(170, -10, 0, 30);
        ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(255,60,90,0.18)';
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(0, 0, 60 + k * 50 + Math.sin(t * 0.03 + k) * 6, 0, TAU);
        ctx.stroke();
      }
      break;
    }
    case 'cirno': {
      const g = ctx.createLinearGradient(0, 0, 0, FIELD_H);
      g.addColorStop(0, '#08234a');
      g.addColorStop(1, '#0d4478');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.strokeStyle = 'rgba(200,240,255,0.2)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const cx = (i * 97 + 40) % FIELD_W, cy = ((i * 173 + t * 0.6) % (FIELD_H + 160)) - 80;
        const rad = 30 + (i % 3) * 18;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.004 * (i % 2 ? 1 : -1) + i);
        for (let k = 0; k < 6; k++) {
          ctx.rotate(TAU / 6);
          ctx.beginPath();
          ctx.moveTo(0, 0); ctx.lineTo(rad, 0);
          ctx.moveTo(rad * 0.55, 0); ctx.lineTo(rad * 0.75, rad * 0.18);
          ctx.moveTo(rad * 0.55, 0); ctx.lineTo(rad * 0.75, -rad * 0.18);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 60; i++) {
        const x = (i * 61.7 + Math.sin(t * 0.02 + i) * 12) % FIELD_W;
        const y = (i * 37.3 + t * (0.8 + (i % 5) * 0.3)) % FIELD_H;
        ctx.fillRect(x, y, 2, 2);
      }
      break;
    }
    case 'star': {
      ctx.fillStyle = '#060320';
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      const ng = ctx.createRadialGradient(192, 200, 20, 192, 200, 260);
      ng.addColorStop(0, 'rgba(90,70,200,0.35)');
      ng.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ng;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
      ctx.translate(192, 200);
      for (let ring = 0; ring < 4; ring++) {
        const rad = 50 + ring * 55;
        const n = 8 + ring * 6;
        ctx.save();
        ctx.rotate(t * 0.003 * (ring % 2 ? -1 : 1) * (1 + ring * 0.3));
        ctx.strokeStyle = 'rgba(150,170,255,0.14)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.stroke();
        for (let i = 0; i < n; i++) {
          const a = (i / n) * TAU;
          const tw = 0.4 + 0.4 * Math.sin(t * 0.05 + i * 1.3 + ring);
          ctx.fillStyle = `rgba(220,230,255,${tw})`;
          ctx.fillRect(Math.cos(a) * rad - 1.2, Math.sin(a) * rad - 1.2, 2.4, 2.4);
        }
        ctx.restore();
      }
      ctx.rotate(-t * 0.002);
      ctx.fillStyle = 'rgba(160,180,255,0.07)';
      starPath(ctx, 190, 70, 6);
      ctx.fill();
      break;
    }
    default: {
      ctx.fillStyle = '#100820';
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    }
  }
  ctx.restore();
}

</script>
<script>
'use strict';
// ============================================================
//  敵弾・レーザー
// ============================================================

class Bullet {
  init(o) {
    this.x = o.x;
    this.y = o.y;
    this.speed = o.speed ?? 2;
    this.angle = o.angle ?? Math.PI / 2;
    this.accel = o.accel || 0;
    this.angVel = o.angVel || 0;
    this.minSpeed = o.minSpeed ?? -99;
    this.maxSpeed = o.maxSpeed ?? 99;
    this.ax = o.ax || 0;
    this.ay = o.ay || 0;
    this.evx = o.evx || 0;
    this.evy = o.evy || 0;
    this.maxFall = o.maxFall ?? 99;
    this.type = o.type || 'small';
    this.color = o.color || 'red';
    const def = BTYPES[this.type];
    this.def = def;
    this.hitR = o.hitR ?? def.hitR;
    this.sprite = getBulletSprite(this.type, this.color);
    this.size = def.size * (o.scale || 1);
    this.additive = !!def.additive;
    this.rotates = !!def.rotate;
    this.spin = def.spin ? def.spin * (Math.random() < 0.5 ? -1 : 1) : 0;
    this.rot = this.rotates ? this.angle : Math.random() * TAU;
    this.delay = this.delayMax = o.delay ?? 8;
    this.frame = 0;
    this.life = o.life || 0;
    this.alive = true;
    this.grazed = false;
    this.noCancel = !!o.noCancel;
    this.margin = o.margin ?? 40;
    this.data = o.data || null;
    this.wait = 0;
    this.script = o.script ? o.script(this) : null;
    this.vx = 0;
    this.vy = 0;
    return this;
  }

  setColor(color) {
    this.color = color;
    this.sprite = getBulletSprite(this.type, color);
  }
  setType(type) {
    this.type = type;
    this.def = BTYPES[type];
    this.hitR = this.def.hitR;
    this.size = this.def.size;
    this.additive = !!this.def.additive;
    this.rotates = !!this.def.rotate;
    this.sprite = getBulletSprite(type, this.color);
  }

  update() {
    this.frame++;
    if (this.script) {
      if (this.wait > 0) this.wait--;
      else {
        const r = this.script.next();
        if (r.done) this.script = null;
        else this.wait = (typeof r.value === 'number' ? Math.max(1, r.value) : 1) - 1;
      }
      if (!this.alive) return;
    }
    if (this.accel) this.speed = clamp(this.speed + this.accel, this.minSpeed, this.maxSpeed);
    if (this.angVel) this.angle += this.angVel;
    if (this.ax || this.ay) {
      this.evx += this.ax;
      this.evy = Math.min(this.evy + this.ay, this.maxFall);
    }
    this.vx = Math.cos(this.angle) * this.speed + this.evx;
    this.vy = Math.sin(this.angle) * this.speed + this.evy;
    this.x += this.vx;
    this.y += this.vy;
    if (this.rotates) {
      if (this.vx || this.vy) this.rot = Math.atan2(this.vy, this.vx);
    } else if (this.spin) this.rot += this.spin;
    if (this.delay > 0) this.delay--;
    if (this.life && this.frame >= this.life) this.alive = false;
    const m = this.margin;
    if (this.x < -m || this.x > FIELD_W + m || this.y < -m || this.y > FIELD_H + m) this.alive = false;
  }
}

class BulletManager {
  constructor() {
    this.list = [];
    this.pool = [];
  }
  spawn(o) {
    const b = (this.pool.pop() || new Bullet()).init(o);
    this.list.push(b);
    return b;
  }
  update() {
    const list = this.list;
    for (let i = 0; i < list.length; i++) if (list[i].alive) list[i].update();
    let j = 0;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.alive) list[j++] = b;
      else { b.script = null; this.pool.push(b); }
    }
    list.length = j;
  }
  // 弾消し（toItem なら得点アイテムに変える）
  cancelAll(toItem = true, force = false) {
    for (const b of this.list) {
      if (!b.alive || (b.noCancel && !force)) continue;
      b.alive = false;
      Fx.cancel(b.x, b.y, b.color);
      if (toItem) spawnItem('star', b.x, b.y, true);
    }
  }
  cancelIn(fn, toItem = true) {
    for (const b of this.list) {
      if (!b.alive || b.noCancel || !fn(b)) continue;
      b.alive = false;
      Fx.cancel(b.x, b.y, b.color);
      if (toItem) spawnItem('star', b.x, b.y, true);
    }
  }
  draw(ctx) {
    const m = ctx.getTransform();
    const k = m.a;
    for (let pass = 0; pass < 2; pass++) {
      if (pass === 1) ctx.globalCompositeOperation = 'lighter';
      for (const b of this.list) {
        if (b.additive !== (pass === 1)) continue;
        const s = b.size;
        if (b.delay > 0) {
          const p = b.delay / b.delayMax;
          const gs = s * (1 + p * 1.4) + 8;
          ctx.setTransform(k, 0, 0, k, m.e + k * b.x, m.f + k * b.y);
          ctx.globalAlpha = 0.9 * p;
          ctx.drawImage(getGlowSprite(b.color), -gs / 2, -gs / 2, gs, gs);
          ctx.globalAlpha = 1 - p;
        }
        if (b.rot) {
          const c = Math.cos(b.rot) * k, sn = Math.sin(b.rot) * k;
          ctx.setTransform(c, sn, -sn, c, m.e + k * b.x, m.f + k * b.y);
        } else {
          ctx.setTransform(k, 0, 0, k, m.e + k * b.x, m.f + k * b.y);
        }
        ctx.drawImage(b.sprite, -s / 2, -s / 2, s, s);
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(m);
  }
}

// ------------------------------------------------------------
//  レーザー（予告線 → 照射 → 消滅）
// ------------------------------------------------------------
class Laser {
  constructor(o) {
    this.x = o.x;
    this.y = o.y;
    this.angle = o.angle ?? Math.PI / 2;
    this.length = o.length ?? 640;
    this.width = o.width ?? 14;
    this.color = o.color || 'blue';
    this.warn = o.warn ?? 50;
    this.dur = o.dur ?? 60;
    this.fadeOut = 14;
    this.angVel = o.angVel || 0;
    this.angVelWarn = o.angVelWarn ?? this.angVel;
    this.follow = o.follow || null;
    this.frame = 0;
    this.alive = true;
    this.grazeCd = 0;
  }
  get on() { return this.frame >= this.warn + 6 && this.frame < this.warn + this.dur; }
  widthNow() {
    const f = this.frame - this.warn;
    if (f < 0) return 1.5;
    if (f < this.dur) return this.width * Math.min(1, f / 8);
    return this.width * Math.max(0, 1 - (f - this.dur) / this.fadeOut);
  }
  update() {
    this.frame++;
    this.angle += this.frame < this.warn ? this.angVelWarn : this.angVel;
    if (this.follow) this.follow(this);
    if (this.frame === this.warn) Sound.se('laser');
    if (this.frame >= this.warn + this.dur + this.fadeOut) this.alive = false;
    if (this.grazeCd > 0) this.grazeCd--;
  }
  // 点と線分の距離
  distTo(px, py) {
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);
    const t = clamp((px - this.x) * dx + (py - this.y) * dy, 0, this.length);
    return Math.hypot(this.x + dx * t - px, this.y + dy * t - py);
  }
  hits(px, py, r) { return this.on && this.distTo(px, py) < this.width * 0.36 + r; }
  draw(ctx) {
    const w = this.widthNow();
    const rim = (BCOL[this.color] || BCOL.white).rim;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.frame < this.warn) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(this.frame * 0.5);
      ctx.fillStyle = rim;
      ctx.fillRect(0, -0.8, this.length, 1.6);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
      g.addColorStop(0, hexA(rim, 0));
      g.addColorStop(0.25, hexA(rim, 0.8));
      g.addColorStop(0.5, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.75, hexA(rim, 0.8));
      g.addColorStop(1, hexA(rim, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, -w / 2, this.length, w);
      ctx.fillStyle = hexA(rim, 0.6);
      ctx.beginPath(); ctx.arc(0, 0, w * 0.7, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

// ------------------------------------------------------------
//  弾幕ヘルパー
// ------------------------------------------------------------
function fire(o) {
  if (!o.silent) Sound.se('tan');
  return G.bullets.spawn(o);
}
function fireRing(o) {
  const out = [];
  const n = o.n, base = o.angle ?? 0;
  for (let i = 0; i < n; i++) out.push(fire({ ...o, angle: base + (i * TAU) / n }));
  return out;
}
function fireFan(o) {
  const out = [];
  const n = o.n, sp = o.spread ?? 0.5, base = o.angle ?? Math.PI / 2;
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? base : base - sp / 2 + (sp * i) / (n - 1);
    out.push(fire({ ...o, angle: a }));
  }
  return out;
}
function fireLaser(o) {
  const l = new Laser(o);
  G.lasers.push(l);
  return l;
}
function aimAt(x, y) { return angleTo(x, y, G.player.x, G.player.y); }

<script>
'use strict';
// ============================================================
//  エフェクト（パーティクル）
// ============================================================

const Fx = {
  list: [],
  reset() { this.list = []; },
  add(p) {
    p.max = p.life;
    p.vx = p.vx || 0;
    p.vy = p.vy || 0;
    p.drag = p.drag ?? 1;
    this.list.push(p);
    if (this.list.length > 1600) this.list.splice(0, this.list.length - 1600);
    return p;
  },
  update() {
    for (const p of this.list) {
      p.life--;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.drag;
      p.vy *= p.drag;
      if (p.grow) p.r += p.grow;
    }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(ctx, layer = 0) {
    for (const p of this.list) {
      if ((p.layer || 0) !== layer) continue;
      const k = p.life / p.max;
      switch (p.type) {
        case 'spark': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = k;
          ctx.lineWidth = p.w || 1.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3);
          ctx.stroke();
          break;
        }
        case 'ring': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = k * (p.alpha ?? 1);
          ctx.lineWidth = (p.w || 2) * (0.4 + k * 0.6);
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, TAU);
          ctx.stroke();
          break;
        }
        case 'flash': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k * (p.alpha ?? 1);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, p.r));
          g.addColorStop(0, 'rgba(255,255,255,0.9)');
          g.addColorStop(0.3, p.color);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, p.r), 0, TAU);
          ctx.fill();
          break;
        }
        case 'glow': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k;
          const s = p.r * (0.5 + k * 0.5) * 2;
          ctx.drawImage(getGlowSprite(p.color), p.x - s / 2, p.y - s / 2, s, s);
          break;
        }
        case 'text': {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = Math.min(1, k * 2);
          ctx.font = `bold ${p.size || 11}px ${FONT_EN}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          strokeText(ctx, p.text, p.x, p.y, p.color, 'rgba(0,0,0,0.7)', 2.5);
          break;
        }
        case 'petal': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k;
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.life * 0.2);
          starPath(ctx, p.r, p.r * 0.45);
          ctx.fill();
          ctx.restore();
          break;
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },

  spark(x, y, color, n = 6, speed = 3, life = 18) {
    for (let i = 0; i < n; i++) {
      const a = frand(TAU), s = frand(speed * 0.4, speed);
      this.add({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: frand(life * 0.6, life), color, drag: 0.92 });
    }
  },
  ring(x, y, color, r0, grow, life, w = 2) {
    this.add({ type: 'ring', x, y, r: r0, grow, life, color, w });
  },
  flash(x, y, color, r, life, grow = 0) {
    this.add({ type: 'flash', x, y, r, life, color, grow });
  },
  explosion(x, y, color = 'rgba(255,200,120,0.7)', size = 1) {
    this.flash(x, y, color, 16 * size, 16, 1.2 * size);
    this.ring(x, y, color, 6 * size, 2.2 * size, 18, 2);
    this.spark(x, y, color, Math.round(8 * size), 3.5 * size, 22);
  },
  cancel(x, y, color) {
    this.add({ type: 'glow', x, y, r: 12, life: 16, color });
  },
  hit(x, y) {
    this.add({ type: 'spark', x: x + frand(-6, 6), y: y + frand(-4, 8), vx: frand(-1, 1), vy: frand(-3, -1), life: 8, color: 'rgba(255,255,255,0.8)', w: 1 });
  },
  graze(x, y) {
    const a = frand(TAU);
    this.add({ type: 'spark', x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 14, color: 'rgba(255,255,255,0.9)', drag: 0.9, w: 1.2 });
  },
  text(x, y, text, color = '#fff', size = 11, life = 50) {
    this.add({ type: 'text', x, y, vy: -0.5, drag: 0.97, text, color, size, life });
  },
  stars(x, y, n, color, speed = 4) {
    for (let i = 0; i < n; i++) {
      const a = frand(TAU), s = frand(speed * 0.3, speed);
      this.add({ type: 'petal', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: frand(2, 5), life: frand(30, 60), color, drag: 0.95 });
    }
  },
  bossExplosion(x, y) {
    for (let i = 0; i < 5; i++) this.ring(x, y, i % 2 ? 'rgba(255,220,255,0.9)' : 'rgba(160,200,255,0.9)', 4, 3 + i * 1.5, 50 + i * 8, 3);
    this.flash(x, y, 'rgba(255,240,220,0.8)', 40, 60, 4);
    this.spark(x, y, 'rgba(255,230,200,0.9)', 50, 9, 60);
    this.stars(x, y, 40, 'rgba(255,240,160,0.9)', 7);
  },
  playerDeath(x, y) {
    for (let i = 0; i < 3; i++) this.ring(x, y, 'rgba(255,120,200,0.9)', 4, 4 + i * 2.5, 40, 3);
    this.flash(x, y, 'rgba(255,150,220,0.7)', 20, 30, 3);
    this.spark(x, y, 'rgba(255,200,240,0.9)', 30, 7, 40);
  },
};

// ============================================================
//  アイテム
// ============================================================
class Item {
  constructor(type, x, y, auto = false) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.vx = type === 'star' ? 0 : frand(-0.8, 0.8);
    this.vy = type === 'star' ? 0 : -frand(1.8, 3.0);
    this.auto = auto;
    this.frame = 0;
    this.alive = true;
    this.homeSpeed = 0;
    this.rot = type === 'star' ? 0 : frand(-3, 3);
  }
  update(p) {
    this.frame++;
    const playerOk = p.state === 'normal';
    if (playerOk && (this.auto || (this.type !== 'star' && p.y < POC_LINE))) this.auto = true;
    const d = dist(this.x, this.y, p.x, p.y);
    const magnet = p.focused ? 70 : 42;
    if (playerOk && (this.auto || d < magnet) && (this.type !== 'star' || this.frame > 10)) {
      this.homeSpeed = Math.min(this.homeSpeed + 0.6, 9);
      const a = angleTo(this.x, this.y, p.x, p.y);
      this.x += Math.cos(a) * this.homeSpeed;
      this.y += Math.sin(a) * this.homeSpeed;
      if (d < 18) { this.alive = false; G.collectItem(this); }
      return;
    }
    if (this.type === 'star') {
      this.y -= 0.3;
      if (this.frame > 90) this.auto = true;
      return;
    }
    this.vy = Math.min(this.vy + 0.05, 2.2);
    this.vx *= 0.95;
    this.x += this.vx;
    this.y += this.vy;
    this.rot *= 0.94;
    if (this.y > FIELD_H + 20) this.alive = false;
    if (playerOk && d < 18) { this.alive = false; G.collectItem(this); }
  }
  draw(ctx) {
    const spr = getItemSprite(this.type);
    const s = spr.width / SPR;
    if (this.y < -s / 2) {
      // 画面上にあるアイテムの位置表示
      ctx.globalAlpha = 0.7;
      ctx.drawImage(spr, this.x - s / 4, 2, s / 2, s / 2);
      ctx.globalAlpha = 1;
      return;
    }
    if (this.rot) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.drawImage(spr, -s / 2, -s / 2, s, s);
      ctx.restore();
    } else {
      ctx.drawImage(spr, this.x - s / 2, this.y - s / 2, s, s);
    }
  }
}

const POC_LINE = 112; // これより上に行くとアイテムを自動回収

function spawnItem(type, x, y, auto = false) {
  const it = new Item(type, x, y, auto);
  G.items.push(it);
  return it;
}

function dropItems(x, y, spec) {
  for (const [type, n] of Object.entries(spec)) {
    for (let i = 0; i < n; i++) {
      spawnItem(type, x + frand(-14, 14), y + frand(-14, 14));
    }
  }
}

<script>
'use strict';
// ============================================================
//  自機

const PLAYER_TYPES = {
  reimu: {
    speed: 4.5, focusSpeed: 2.0, hitR: 2.2, deathbomb: 15,
    shotDesc: ['高速移動：ホーミングアミュレット', '低速移動：パスウェイジョンニードル'],
    bombName: '霊符「夢想封印」',
    desc: '誘導弾で敵を自動で狙う、扱いやすいタイプ。\nボムは画面中の敵を追いかける光の玉。',
  },

    shotDesc: ['高速移動：マジックミサイル', '低速移動：イリュージョンレーザー'],
    bombName: '恋符「マスタースパーク」',
    desc: '攻撃力と移動速度に優れたパワータイプ。\nボムは前方を焼き払う極太レーザー。',
  },
};

const OPT_LAYOUT = {
  un: [[], [[0, -30]], [[-26, -6], [26, -6]], [[-30, -2], [0, -32], [30, -2]], [[-34, 4], [-16, -24], [16, -24], [34, 4]]],
  fo: [[], [[0, -24]], [[-10, -22], [10, -22]], [[-14, -18], [0, -28], [14, -18]], [[-18, -14], [-7, -26], [7, -26], [18, -14]]],
};

// ------------------------------------------------------------
//  自機ショット
// ------------------------------------------------------------
class PShot {
  constructor(kind, x, y, vx, vy, dmg) {
    this.kind = kind;
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.dmg = dmg;
    this.alive = true;
    this.r = kind === 'missile' ? 7 : 6;
    this.frame = 0;
    this.target = null;
  }
  update() {
    this.frame++;
    if (this.kind === 'homing') {
      if (!this.target || !this.target.alive || this.target.untouchable) this.target = G.nearestTarget(this.x, this.y);
      const sp = 11;
      let a = Math.atan2(this.vy, this.vx);
      if (this.target) {
        const want = angleTo(this.x, this.y, this.target.x, this.target.y);
        a += clamp(normAngle(want - a), -0.22, 0.22);
      }
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp;
    }
    if (this.kind === 'missile') this.vy -= 0.4;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -24 || this.y > FIELD_H + 24 || this.x < -24 || this.x > FIELD_W + 24) this.alive = false;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);
    switch (this.kind) {
      case 'amulet':
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(-3.5, -7, 7, 14);
        ctx.fillStyle = '#e03040';
        ctx.fillRect(-2, -4, 4, 8);
        break;
      case 'homing':
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = '#f4e8ff';
        ctx.fillRect(-3, -5, 6, 10);
        ctx.fillStyle = '#a050ff';
        ctx.fillRect(-1.5, -3, 3, 6);
        break;
      case 'needle':
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#ffd0e0';
        ctx.fillRect(-1.5, -12, 3, 24);
        ctx.fillStyle = '#ff4060';
        ctx.fillRect(-0.7, -12, 1.4, 24);
        break;
      case 'star':
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#fff0a0';
        starPath(ctx, 6, 2.6);
        ctx.fill();
        break;
      case 'missile':
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = '#80ff90';
        ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(3, 2); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(160,255,200,0.4)';
        ctx.fillRect(-2, 2, 4, 8);
        break;
    }
    ctx.restore();
  }
}

// ------------------------------------------------------------
//  ボム：霊符「夢想封印」
// ------------------------------------------------------------
class FantasySeal {
  constructor(p) {
    this.p = p;
    this.frame = 0;
    this.done = false;
    this.slow = false;
    const colors = ['#ff5060', '#ffa040', '#ffe050', '#60f070', '#50d8ff', '#6070ff', '#c060ff', '#ff70d0'];
    this.orbs = colors.map((c, i) => ({ c, a: (i * TAU) / 8, r: 0, x: p.x, y: p.y, vx: 0, vy: 0, alive: true, target: null }));
  }
  update(g) {
    this.frame++;
    const f = this.frame;
    if (f < 150) { g.bullets.cancelAll(true); g.clearLasers(); }
    for (const o of this.orbs) {
      if (!o.alive) continue;
      if (f < 40) {
        o.a += 0.14;
        o.r = 56 * Ease.outCubic(f / 40);
        o.x = this.p.x + Math.cos(o.a) * o.r;
        o.y = this.p.y + Math.sin(o.a) * o.r;
        o.vx = Math.cos(o.a + Math.PI / 2) * 3;
        o.vy = Math.sin(o.a + Math.PI / 2) * 3 - 2;
        continue;
      }
      if (!o.target || !o.target.alive) o.target = g.nearestTarget(o.x, o.y);
      const tx = o.target ? o.target.x : o.x, ty = o.target ? o.target.y : -60;
      const a = angleTo(o.x, o.y, tx, ty);
      o.vx = o.vx * 0.9 + Math.cos(a) * 1.1;
      o.vy = o.vy * 0.9 + Math.sin(a) * 1.1;
      o.x += o.vx;
      o.y += o.vy;
      const hitTarget = o.target && dist(o.x, o.y, o.target.x, o.target.y) < (o.target.r || 16) + 12;
      if (hitTarget || f > 40 + 100 + this.orbs.indexOf(o) * 6 || o.y < -40) {
        o.alive = false;
        g.areaDamage(o.x, o.y, 80, 45, true);
        Fx.explosion(o.x, o.y, hexA(o.c, 0.8), 2.2);
        g.shake = Math.max(g.shake, 8);
        Sound.se('kill');
      }
    }
    if (f > 60 && this.orbs.every(o => !o.alive)) this.done = true;
  }
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const o of this.orbs) {
      if (!o.alive) continue;
      const pulse = 22 + Math.sin(this.frame * 0.4) * 3;
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, pulse);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.35, hexA(o.c, 0.8));
      g.addColorStop(1, hexA(o.c, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, pulse, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ------------------------------------------------------------
//  ボム：恋符「マスタースパーク」
// ------------------------------------------------------------
class MasterSpark {
  constructor(p) {
    this.p = p;
    this.frame = 0;
    this.done = false;
    this.slow = true;
    this.duration = 210;
  }
  width() {
    const f = this.frame;
    if (f < 20) return 110 * Ease.outCubic(f / 20);
    if (f > this.duration - 30) return 110 * Math.max(0, (this.duration - f) / 30);
    return 110 + Math.sin(f * 0.8) * 6;
  }
  update(g) {
    this.frame++;
    const w = this.width();
    const x = this.p.x, y = this.p.y - 16;
    if (this.frame === 1) { g.bullets.cancelAll(true); g.clearLasers(); }
    g.bullets.cancelIn(b => Math.abs(b.x - x) < w / 2 + 12 && b.y < y + 20);
    if (this.frame % 2 === 0 && this.frame > 10) {
      for (const e of g.enemies) {
        if (e.alive && Math.abs(e.x - x) < w / 2 + e.r && e.y < y + 10) g.damageEnemy(e, 3.4, true);
      }
      const b = g.boss;
      if (b && b.alive && Math.abs(b.x - x) < w / 2 + b.r && b.y < y + 10) g.damageEnemy(b, 3.4, true);
    }
    g.shake = Math.max(g.shake, 3);
    if (this.frame >= this.duration) this.done = true;
  }
  draw(ctx) {
    const w = this.width();
    if (w <= 0.5) return;
    const x = this.p.x, y = this.p.y - 16;
    ctx.globalCompositeOperation = 'lighter';
    const hue = (this.frame * 6) % 360;
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, `hsla(${hue},100%,60%,0)`);
    g.addColorStop(0.18, `hsla(${hue},100%,65%,0.55)`);
    g.addColorStop(0.35, `hsla(${(hue + 60) % 360},100%,80%,0.8)`);
    g.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.65, `hsla(${(hue + 120) % 360},100%,80%,0.8)`);
    g.addColorStop(0.82, `hsla(${(hue + 180) % 360},100%,65%,0.55)`);
    g.addColorStop(1, `hsla(${(hue + 180) % 360},100%,60%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - w / 2, -20, w, y + 20);
    const og = ctx.createRadialGradient(x, y, 0, x, y, w * 0.7);
    og.addColorStop(0, 'rgba(255,255,255,0.9)');
    og.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(x, y, w * 0.7, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 12; i++) {
      const sy = (y - ((this.frame * 14 + i * 53) % (y + 40)));
      const sx = x + Math.sin(i * 12.9 + this.frame * 0.2) * w * 0.4;
      ctx.fillRect(sx - 1, sy, 2, 10);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ------------------------------------------------------------
//  自機本体
// ------------------------------------------------------------
function drawYinYang(ctx, x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d82030';
  ctx.beginPath();
  ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.arc(0, r / 2, r / 2, Math.PI / 2, -Math.PI / 2, true);
  ctx.arc(0, -r / 2, r / 2, Math.PI / 2, -Math.PI / 2, false);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, r / 2, r / 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d82030';
  ctx.beginPath(); ctx.arc(0, -r / 2, r / 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

class Player {
  constructor(id) {
    this.id = id;
    this.type = PLAYER_TYPES[id];
    this.hitR = this.type.hitR;
    this.grazeR = 20;
    this.x = FIELD_W / 2;
    this.y = FIELD_H - 48;
    this.state = 'normal';
    this.timer = 0;
    this.invuln = 0;
    this.frame = 0;
    this.tilt = 0;
    this.focused = false;
    this.focusT = 0;
    this.shotFrame = 0;
    this.bomb = null;
    this.opts = [];
    this.lasers = [];
  }

  get visible() { return this.state !== 'dead'; }

  update(g) {
    this.frame++;
    const move = Input.consumeMove();
    if (this.invuln > 0) this.invuln--;
    if (this.bomb) {
      this.bomb.update(g);
      if (this.bomb.done) this.bomb = null;
    }
    this.lasers = [];
    switch (this.state) {
      case 'hit':
        this.timer--;
        if (Input.pressed('bomb') && g.bombs > 0) {
          this.state = 'normal';
          this.useBomb(g);
        } else if (this.timer <= 0) this.die(g);
        return;
      case 'dead':
        this.timer--;
        if (this.timer <= 0) {
          if (g.lives < 0) { g.onOutOfLives(); return; }
          this.state = 'respawn';
          this.timer = 40;
          this.x = FIELD_W / 2;
          this.y = FIELD_H + 30;
          this.invuln = 220;
        }
        return;
      case 'respawn':
        this.timer--;
        this.y = lerp(FIELD_H + 30, FIELD_H - 48, Ease.outCubic(1 - this.timer / 40));
        if (this.timer <= 0) this.state = 'normal';
        this.updateOptions(g);
        return;
    }

    this.focused = Input.down('focus');
    this.focusT += ((this.focused ? 1 : 0) - this.focusT) * 0.3;
    let dx = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);
    let dy = (Input.down('down') ? 1 : 0) - (Input.down('up') ? 1 : 0);
    let sp = this.focused ? this.type.focusSpeed : this.type.speed;
    if (this.bomb && this.bomb.slow) sp *= 0.5;
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
    this.x += dx * sp;
    this.y += dy * sp;
    if (move.x || move.y) {
      const s = this.focused ? 0.75 : 1.25;
      this.x += move.x * s;
      this.y += move.y * s;
      dx = clamp(move.x, -1, 1);
    }
    this.x = clamp(this.x, 8, FIELD_W - 8);
    this.y = clamp(this.y, 16, FIELD_H - 16);
    this.tilt += (dx - this.tilt) * 0.2;

    const shooting = (Input.down('shot') || Input.dragging) && g.canShoot();
    if (shooting) this.shoot(g); else this.shotFrame = 0;
    if (Input.pressed('bomb') && g.canShoot()) this.useBomb(g);
    this.updateOptions(g);
    if (shooting && this.id === 'marisa' && this.focused) this.fireLasers(g);
  }

  updateOptions(g) {
    const n = Math.min(4, Math.floor(g.power / 100));
    while (this.opts.length < n) this.opts.push({ x: this.x, y: this.y });
    this.opts.length = n;
    const un = OPT_LAYOUT.un[n], fo = OPT_LAYOUT.fo[n];
    for (let i = 0; i < n; i++) {
      const tx = this.x + lerp(un[i][0], fo[i][0], this.focusT);
      const ty = this.y + lerp(un[i][1], fo[i][1], this.focusT);
      const o = this.opts[i];
      o.x += (tx - o.x) * 0.4;
      o.y += (ty - o.y) * 0.4;
    }
  }

  shoot(g) {
    const f = this.shotFrame++;
    if (f % 5 === 0) Sound.se('shot');
    const shots = g.shots;
    if (this.id === 'reimu') {
      if (f % 4 === 0) {
        shots.push(new PShot('amulet', this.x - 6, this.y - 10, 0, -16, 1));
        shots.push(new PShot('amulet', this.x + 6, this.y - 10, 0, -16, 1));
      }
      if (this.focused) {
        if (f % 4 === 0) for (const o of this.opts) shots.push(new PShot('needle', o.x, o.y - 8, 0, -20, 1.8));
      } else if (f % 8 === 0) {
        this.opts.forEach((o, i) => {
          const a = -Math.PI / 2 + (i - (this.opts.length - 1) / 2) * 0.35;
          const s = new PShot('homing', o.x, o.y, Math.cos(a) * 11, Math.sin(a) * 11, 2);
          shots.push(s);
        });
      }
    } else {
      if (f % 4 === 0) {
        shots.push(new PShot('star', this.x - 6, this.y - 10, 0, -17, 1.2));
        shots.push(new PShot('star', this.x + 6, this.y - 10, 0, -17, 1.2));
      }
      if (!this.focused && f % 10 === 0) {
        this.opts.forEach((o, i) => {
          const a = -Math.PI / 2 + (i - (this.opts.length - 1) / 2) * 0.14;
          shots.push(new PShot('missile', o.x, o.y - 6, Math.cos(a) * 6, Math.sin(a) * 6, 4.5));
        });
      }
    }
  }

  // 魔理沙の低速レーザー：一番手前の敵で止まる
  fireLasers(g) {
    for (const o of this.opts) {
      let best = null, bestY = -Infinity;
      const consider = e => {
        if (!e || !e.alive || e.untouchable || e.y > o.y || e.y < -20) return;
        if (Math.abs(e.x - o.x) < e.r + 4 && e.y > bestY) { best = e; bestY = e.y; }
      };
      for (const e of g.enemies) consider(e);
      consider(g.boss);
      const endY = best ? best.y + 4 : -20;
      if (best) {
        g.damageEnemy(best, 0.42, false, this.frame % 2 === 0);
        if (this.frame % 3 === 0) Fx.hit(o.x, best.y + 6);
      }
      this.lasers.push({ x: o.x, y0: o.y - 6, y1: endY });
    }
  }

  useBomb(g) {
    if (this.bomb || g.bombs <= 0) return;
    g.bombs--;
    g.bombsUsed++;
    g.spellFailed = true;
    this.invuln = Math.max(this.invuln, this.id === 'reimu' ? 250 : 270);
    this.bomb = this.id === 'reimu' ? new FantasySeal(this) : new MasterSpark(this);
    g.showBombName(this.type.bombName);
    g.flash = { color: '255,255,255', a: 0.5 };
    Sound.se('bomb');
  }

  hit(g) {
    if (this.state !== 'normal' || this.invuln > 0) return;
    this.state = 'hit';
    this.timer = this.type.deathbomb;
    Sound.se('pichuun');
    Fx.flash(this.x, this.y, 'rgba(255,120,200,0.8)', 24, 12);
  }

  die(g) {
    this.state = 'dead';
    this.timer = 60;
    this.bomb = null;
    Fx.playerDeath(this.x, this.y);
    g.onPlayerDeath(this.x, this.y);
  }

  draw(ctx) {
    if (!this.visible) return;
    const blink = this.invuln > 0 && (this.frame % 6 < 3);
    // オプション
    for (let i = 0; i < this.opts.length; i++) {
      const o = this.opts[i];
      if (this.id === 'reimu') drawYinYang(ctx, o.x, o.y, 6, this.frame * 0.12 * (i % 2 ? 1 : -1));
      else {
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, 9);
        g.addColorStop(0, 'rgba(255,255,220,0.95)');
        g.addColorStop(0.4, 'rgba(120,255,140,0.7)');
        g.addColorStop(1, 'rgba(60,200,100,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#fff8c0';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(this.frame * 0.08); starPath(ctx, 4, 1.8); ctx.fill(); ctx.restore();
      }
    }
    // 魔理沙のレーザー
    if (this.lasers.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (const l of this.lasers) {
        const w = 5 + Math.sin(this.frame * 0.9) * 1;
        const g = ctx.createLinearGradient(l.x - w, 0, l.x + w, 0);
        g.addColorStop(0, 'rgba(80,255,120,0)');
        g.addColorStop(0.5, 'rgba(230,255,200,0.75)');
        g.addColorStop(1, 'rgba(80,255,120,0)');
        ctx.fillStyle = g;
        ctx.fillRect(l.x - w, l.y1, w * 2, l.y0 - l.y1);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (blink) ctx.globalAlpha = 0.35;
    ctx.save();
    ctx.translate(this.x, this.y + 2);
    drawPlayerBack(ctx, this.id, this.frame, this.tilt);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 当たり判定表示（弾より手前に描く）
  drawHitbox(ctx) {
    if (!this.visible || this.focusT < 0.05) return;
    const a = this.focusT;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.rotate(this.frame * 0.04);
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.fillStyle = i % 2 ? 'rgba(255,160,200,0.9)' : 'rgba(255,255,255,0.9)';
      ctx.fillRect(24, -1.5, 5, 3);
    }
    ctx.rotate(-this.frame * 0.08);
    ctx.strokeStyle = 'rgba(255,190,220,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#e03050';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, this.hitR + 1.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

<script>
'use strict';
// ============================================================
//  ザコ敵・ボス
// ============================================================

class Enemy {
  constructor(o) {
    this.x = o.x;
    this.y = o.y;
    this.hp = this.maxHp = o.hp ?? 12;
    this.kind = o.kind || 'fairy';
    this.color = o.color || 'blue';
    this.r = o.r ?? (this.kind === 'bigfairy' ? 18 : this.kind === 'kedama' ? 10 : 12);
    this.speed = o.speed || 0;
    this.angle = o.angle ?? Math.PI / 2;
    this.accel = o.accel || 0;
    this.angVel = o.angVel || 0;
    this.drops = o.drops ?? { power: 1 };
    this.score = o.score ?? 1000;
    this.frame = 0;
    this.alive = true;
    this.flash = 0;
    this.entered = false;
    this.untouchable = false;
    this.invincible = 0;
    this.keep = !!o.keep;
    this.noBody = !!o.noBody;
    this.onDeath = o.onDeath || null;
    this.tasks = new TaskRunner();
    if (o.script) this.tasks.add(o.script(this));
  }
  update() {
    this.frame++;
    if (this.flash > 0) this.flash--;
    if (this.invincible > 0) this.invincible--;
    this.tasks.update();
    if (!this.alive) return;
    if (this.accel) this.speed = clamp(this.speed + this.accel, 0, 20);
    if (this.angVel) this.angle += this.angVel;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    const inside = this.x > -8 && this.x < FIELD_W + 8 && this.y > -8 && this.y < FIELD_H + 8;
    if (inside) this.entered = true;
    else if (!this.keep && (this.entered || this.frame > 900)) {
      const m = 48;
      if (this.x < -m || this.x > FIELD_W + m || this.y < -m || this.y > FIELD_H + m) {
        this.alive = false;
        this.tasks.clear();
      }
    }
  }
  setMove(speed, angle, accel = 0, angVel = 0) {
    this.speed = speed;
    this.angle = angle;
    this.accel = accel;
    this.angVel = angVel;
  }
  *moveTo(x, y, frames, ease = Ease.outQuad) {
    const sx = this.x, sy = this.y;
    this.speed = 0;
    this.accel = 0;
    for (let i = 1; i <= frames; i++) {
      const t = ease(i / frames);
      this.x = lerp(sx, x, t);
      this.y = lerp(sy, y, t);
      yield;
    }
  }
  aim() { return aimAt(this.x, this.y); }
  get onScreen() { return this.x > 0 && this.x < FIELD_W && this.y > 0 && this.y < FIELD_H; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    switch (this.kind) {
      case 'bigfairy': drawFairy(ctx, this.color, this.frame, true); break;
      case 'kedama': drawKedama(ctx, this.color, this.frame); break;
      default: drawFairy(ctx, this.color, this.frame, false);
    }
    if (this.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
}

function spawnEnemy(o) {
  const e = new Enemy(o);
  G.enemies.push(e);
  return e;
}

// ------------------------------------------------------------
//  ボス
// ------------------------------------------------------------
class Boss {
  constructor(id, def = {}) {
    this.id = id;
    this.def = def;
    this.name = CHARA_INFO[id].name;
    this.isBoss = true;
    this.x = def.x ?? FIELD_W / 2;
    this.y = def.y ?? -50;
    this.r = 22;
    this.hp = 1;
    this.maxHp = 1;
    this.alive = true;
    this.frame = 0;
    this.flash = 0;
    this.invincible = 0;
    this.untouchable = true;
    this.timer = 0;
    this.phase = null;
    this.tasks = new TaskRunner();
    this.moveTask = null;
    this.prevX = this.x;
    this.tilt = 0;
    this.pose = def.pose || null;
    this.circleColor = def.circleColor || '160,180,255';
    this.alpha = 1;
  }
  update() {
    this.frame++;
    if (this.flash > 0) this.flash--;
    if (this.invincible > 0) this.invincible--;
    this.tasks.update();
    if (this.moveTask) {
      const r = this.moveTask.next();
      if (r.done) this.moveTask = null;
    }
    const vx = this.x - this.prevX;
    this.tilt += (clamp(vx, -3, 3) / 3 - this.tilt) * 0.15;
    this.prevX = this.x;
  }
  *moveTo(x, y, frames, ease = Ease.inOutSine) {
    const sx = this.x, sy = this.y;
    for (let i = 1; i <= frames; i++) {
      const t = ease(i / frames);
      this.x = lerp(sx, x, t);
      this.y = lerp(sy, y, t);
      yield;
    }
  }
  // 移動を別枠で走らせる（攻撃と並行して動く）
  move(x, y, frames, ease) { this.moveTask = this.moveTo(x, y, frames, ease); }
  wander(frames = 50, range = 70) {
    const p = G.player;
    let dir = Math.sign(p.x - this.x) || randSign();
    if (rng.next() < 0.35) dir = -dir;
    const tx = clamp(this.x + dir * rand(range * 0.5, range), 56, FIELD_W - 56);
    const ty = clamp(rand(70, 130), 50, 150);
    this.move(tx, ty, frames);
  }
  get moving() { return !!this.moveTask; }
  aim() { return aimAt(this.x, this.y); }

  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = this.alpha;
    // 魔法陣
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const pr = 44 + Math.sin(this.frame * 0.05) * 4;
    ctx.strokeStyle = `rgba(${this.circleColor},0.45)`;
    ctx.lineWidth = 1.5;
    ctx.rotate(this.frame * 0.03);
    ctx.beginPath(); ctx.arc(0, 0, pr, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, pr - 6, 0, TAU); ctx.stroke();
    for (let k = 0; k < 2; k++) {
      ctx.rotate(Math.PI / 4);
      ctx.strokeRect(-pr * 0.68, -pr * 0.68, pr * 1.36, pr * 1.36);
    }
    ctx.fillStyle = `rgba(${this.circleColor},0.6)`;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ctx.fillRect(Math.cos(a) * (pr - 3) - 1, Math.sin(a) * (pr - 3) - 1, 2, 2);
    }
    ctx.restore();
    if (this.def.aura) {
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
      g.addColorStop(0, this.def.aura);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    }
    ctx.rotate(this.tilt * 0.12);
    ctx.scale(1.1, 1.1);
    drawChibi(ctx, this.id, { t: this.frame, pose: this.pose || undefined, face: this.face || 'normal' });
    if (this.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(0, -6, 22, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

<script>
'use strict';
// ============================================================
//  会話
//  行の書式: [話者ID, 表情, 台詞]
//  演出:     { bgm: '曲ID' } / { title: 'キャラID' }
// ============================================================

class Dialogue {
  constructor(lines, g) {
    this.lines = lines;
    this.g = g;
    this.i = -1;
    this.done = false;
    this.frame = 0;
    this.faces = {};
    this.left = g.charId;
    this.right = null;
    this.alphaL = 0;
    this.alphaR = 0;
    this.next();
  }
  next() {
    this.i++;
    while (this.i < this.lines.length && !Array.isArray(this.lines[this.i])) {
      const a = this.lines[this.i];
      if (a.bgm) { Sound.playBgm(a.bgm); this.g.showBgmTitle(a.bgm); }
      if (a.title) this.g.bossTitle = { id: a.title, frame: 0 };
      this.i++;
    }
    if (this.i >= this.lines.length) { this.done = true; return; }
    const [who, face, text] = this.lines[this.i];
    this.who = who;
    this.text = text;
    this.chars = 0;
    this.lineFrame = 0;
    this.faces[who] = face;
    if (who !== this.left) this.right = who;
  }
  update() {
    if (this.done) return;
    this.frame++;
    this.lineFrame++;
    this.chars = Math.min(this.text.length, this.chars + 1.2);
    this.alphaL = Math.min(1, this.alphaL + 0.08);
    if (this.right) this.alphaR = Math.min(1, this.alphaR + 0.08);
    const skip = Input.down('skip');
    const advance = (Input.pressed('shot') || Input.anyTap()) && this.lineFrame > 6;
    if (advance || (skip && this.lineFrame > 3)) {
      if (this.chars < this.text.length && !skip) this.chars = this.text.length;
      else this.next();
    }
  }
  draw(ctx) {
    if (this.done) return;
    const t = this.frame;
    const drawChar = (id, x, alphaIn, flip) => {
      if (!id) return;
      const active = this.who === id;
      ctx.globalAlpha = alphaIn * (active ? 1 : 0.45);
      const slide = (1 - alphaIn) * 30 * (flip ? 1 : -1);
      drawPortrait(ctx, id, x + slide, active ? 318 : 326, 3.2, this.faces[id] || 'normal', t, flip);
      ctx.globalAlpha = 1;
    };
    // 話していない方を奥に
    if (this.who === this.left) { drawChar(this.right, 300, this.alphaR, true); drawChar(this.left, 84, this.alphaL, false); }
    else { drawChar(this.left, 84, this.alphaL, false); drawChar(this.right, 300, this.alphaR, true); }

    const bx = 14, by = 350, bw = FIELD_W - 28, bh = 86;
    ctx.fillStyle = 'rgba(8,6,24,0.8)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(210,190,140,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 2.5, by + 2.5, bw - 5, bh - 5);
    const info = CHARA_INFO[this.who] || { name: this.who, color: '#fff' };
    ctx.font = `bold 13px ${FONT_JP}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    strokeText(ctx, info.name, bx + 12, by + 8, info.color, 'rgba(0,0,0,0.9)', 3);
    ctx.font = `15px ${FONT_JP}`;
    ctx.fillStyle = '#f4f0ff';
    const shown = this.text.slice(0, Math.floor(this.chars));
    const lines = wrapText(ctx, shown, bw - 30);
    lines.slice(0, 3).forEach((ln, i) => ctx.fillText(ln, bx + 14, by + 28 + i * 20));
    if (this.chars >= this.text.length) {
      ctx.fillStyle = `rgba(255,230,160,${0.5 + 0.5 * Math.sin(t * 0.2)})`;
      ctx.beginPath();
      ctx.moveTo(bx + bw - 18, by + bh - 16); ctx.lineTo(bx + bw - 10, by + bh - 16); ctx.lineTo(bx + bw - 14, by + bh - 10);
      ctx.fill();
    }
  }
}

<script>
'use strict';
// ============================================================
//  HUD（右側パネル・フィールド内表示）
// ============================================================

const TOUCH_BUTTONS = [
  { id: 'bomb', action: 'bomb', x: 432, y: 372, w: 92, h: 84, label: 'ボム' },
  { id: 'focus', action: 'focus', x: 532, y: 372, w: 92, h: 84, label: '低速', toggle: true },
  { id: 'pause', action: 'pause', x: 596, y: 22, w: 34, h: 30, label: 'II' },
];

let frameCanvas = null;
function getFrameCanvas() {
  if (frameCanvas) return frameCanvas;
  const S = 2;
  const c = makeCanvas(SCREEN_W * S, SCREEN_H * S);
  const x = c.getContext('2d');
  x.scale(S, S);
  const g = x.createLinearGradient(0, 0, SCREEN_W, SCREEN_H);
  g.addColorStop(0, '#1a1236');
  g.addColorStop(1, '#0d0a20');
  x.fillStyle = g;
  x.fillRect(0, 0, SCREEN_W, SCREEN_H);
  // 麻の葉文様
  const s = 26, h = s * Math.sqrt(3) / 2;
  x.strokeStyle = 'rgba(190,160,255,0.09)';
  x.lineWidth = 0.8;
  for (let row = -1; row < SCREEN_H / h + 1; row++) {
    for (let col = -1; col < SCREEN_W / s + 2; col++) {
      const ox = col * s + (row % 2 ? s / 2 : 0), oy = row * h;
      const tris = [
        [[ox, oy], [ox + s, oy], [ox + s / 2, oy + h]],
        [[ox + s / 2, oy + h], [ox + s, oy], [ox + s * 1.5, oy + h]],
      ];
      for (const t of tris) {
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        x.beginPath();
        x.moveTo(t[0][0], t[0][1]); x.lineTo(t[1][0], t[1][1]); x.lineTo(t[2][0], t[2][1]); x.closePath();
        for (const v of t) { x.moveTo(cx, cy); x.lineTo(v[0], v[1]); }
        x.stroke();
      }
    }
  }
  x.clearRect(FIELD_X, FIELD_Y, FIELD_W, FIELD_H);
  x.strokeStyle = 'rgba(214,186,120,0.85)';
  x.lineWidth = 1.5;
  x.strokeRect(FIELD_X - 1, FIELD_Y - 1, FIELD_W + 2, FIELD_H + 2);
  x.strokeStyle = 'rgba(214,186,120,0.35)';
  x.lineWidth = 1;
  x.strokeRect(FIELD_X - 4.5, FIELD_Y - 4.5, FIELD_W + 9, FIELD_H + 9);
  frameCanvas = c;
  return c;
}

// 数字を等幅で描く
function drawDigits(ctx, str, x, y, cw, align = 'left') {
  const total = str.length * cw;
  let sx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  ctx.textAlign = 'center';
  for (const ch of str) {
    ctx.fillText(ch, sx + cw / 2, y);
    sx += cw;
  }
}

function drawStarIcons(ctx, n, x, y, color, max = 8) {
  const shown = Math.min(n, max);
  for (let i = 0; i < max; i++) {
    ctx.fillStyle = i < shown ? color : 'rgba(255,255,255,0.08)';
    ctx.save();
    ctx.translate(x + i * 17, y);
    starPath(ctx, 7, 3);
    ctx.fill();
    if (i < shown) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLogo(ctx, x, y, size = 30) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 ${size}px ${FONT_JP}`;
  ctx.shadowColor = 'rgba(160,140,255,0.9)';
  ctx.shadowBlur = 12;
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#c8b8ff');
  ctx.fillStyle = g;
  ctx.fillText('東方星降夜', x, y);
  ctx.shadowBlur = 0;
  ctx.font = `italic 600 ${Math.round(size * 0.46)}px ${FONT_EN}`;
  ctx.fillStyle = '#e8d8a8';
  ctx.fillText('〜 Night of Falling Stars.', x, y + size * 0.8);
  ctx.restore();
}

function drawSidePanel(ctx, g) {
  ctx.drawImage(getFrameCanvas(), 0, 0, SCREEN_W, SCREEN_H);
  const x0 = 434, vx = 626;
  ctx.textBaseline = 'middle';

  // 難易度
  ctx.font = `italic 700 22px ${FONT_EN}`;
  ctx.textAlign = 'center';
  strokeText(ctx, DIFF_NAMES[DIFF], 522, 38, DIFF_COLORS[DIFF], 'rgba(0,0,0,0.8)', 3);

    ctx.font = `12px ${FONT_JP}`;

  }

  const label = (t, y) => {

    ctx.textAlign = 'left';
    strokeText(ctx, t, x0, y, '#e8e0ff', 'rgba(0,0,0,0.8)', 3);
  };
  const value = (t, y, color = '#ffffff') => {
    ctx.font = `700 18px ${FONT_EN}`;
    ctx.fillStyle = color;
    drawDigits(ctx, t, vx, y, 10.5, 'right');
  };

  label('ハイスコア', 88); value(padScore(g.hiScore), 88, '#d8d0ff');
  label('スコア', 112); value(padScore(g.score), 112);

  label('残り人数', 150);
  drawStarIcons(ctx, Math.max(0, g.lives), 500, 150, '#ff6fb8');
  label('ボム', 176);
  drawStarIcons(ctx, g.bombs, 500, 176, '#6af09a');

  label('霊力', 214);
  if (g.power >= 400) {
    ctx.font = `italic 700 18px ${FONT_EN}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe070';

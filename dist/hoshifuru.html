<script>
'use strict';
// ============================================================
//  敵弾・レーザー
// ============================================================

class Bullet {
  init(o) {
    this.x = o.x;
    this.y = o.y;
    this.speed = o.speed ?? 2;
    this.angle = o.angle ?? Math.PI / 2;
    this.accel = o.accel || 0;
    this.angVel = o.angVel || 0;
    this.minSpeed = o.minSpeed ?? -99;
    this.maxSpeed = o.maxSpeed ?? 99;
    this.ax = o.ax || 0;
    this.ay = o.ay || 0;
    this.evx = o.evx || 0;
    this.evy = o.evy || 0;
    this.maxFall = o.maxFall ?? 99;
    this.type = o.type || 'small';
    this.color = o.color || 'red';
    const def = BTYPES[this.type];
    this.def = def;
    this.hitR = o.hitR ?? def.hitR;
    this.sprite = getBulletSprite(this.type, this.color);
    this.size = def.size * (o.scale || 1);
    this.additive = !!def.additive;
    this.rotates = !!def.rotate;
    this.spin = def.spin ? def.spin * (Math.random() < 0.5 ? -1 : 1) : 0;
    this.rot = this.rotates ? this.angle : Math.random() * TAU;
    this.delay = this.delayMax = o.delay ?? 8;
    this.frame = 0;
    this.life = o.life || 0;
    this.alive = true;
    this.grazed = false;
    this.noCancel = !!o.noCancel;
    this.margin = o.margin ?? 40;
    this.data = o.data || null;
    this.wait = 0;
    this.script = o.script ? o.script(this) : null;
    this.vx = 0;
    this.vy = 0;
    return this;
  }

  setColor(color) {
    this.color = color;
    this.sprite = getBulletSprite(this.type, color);
  }
  setType(type) {
    this.type = type;
    this.def = BTYPES[type];
    this.hitR = this.def.hitR;
    this.size = this.def.size;
    this.additive = !!this.def.additive;
    this.rotates = !!this.def.rotate;
    this.sprite = getBulletSprite(type, this.color);
  }

  update() {
    this.frame++;
    if (this.script) {
      if (this.wait > 0) this.wait--;
      else {
        const r = this.script.next();
        if (r.done) this.script = null;
        else this.wait = (typeof r.value === 'number' ? Math.max(1, r.value) : 1) - 1;
      }
      if (!this.alive) return;
    }
    if (this.accel) this.speed = clamp(this.speed + this.accel, this.minSpeed, this.maxSpeed);
    if (this.angVel) this.angle += this.angVel;
    if (this.ax || this.ay) {
      this.evx += this.ax;
      this.evy = Math.min(this.evy + this.ay, this.maxFall);
    }
    this.vx = Math.cos(this.angle) * this.speed + this.evx;
    this.vy = Math.sin(this.angle) * this.speed + this.evy;
    this.x += this.vx;
    this.y += this.vy;
    if (this.rotates) {
      if (this.vx || this.vy) this.rot = Math.atan2(this.vy, this.vx);
    } else if (this.spin) this.rot += this.spin;
    if (this.delay > 0) this.delay--;
    if (this.life && this.frame >= this.life) this.alive = false;
    const m = this.margin;
    if (this.x < -m || this.x > FIELD_W + m || this.y < -m || this.y > FIELD_H + m) this.alive = false;
  }
}

class BulletManager {
  constructor() {
    this.list = [];
    this.pool = [];
  }
  spawn(o) {
    const b = (this.pool.pop() || new Bullet()).init(o);
    this.list.push(b);
    return b;
  }
  update() {
    const list = this.list;
    for (let i = 0; i < list.length; i++) if (list[i].alive) list[i].update();
    let j = 0;
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.alive) list[j++] = b;
      else { b.script = null; this.pool.push(b); }
    }
    list.length = j;
  }
  // 弾消し（toItem なら得点アイテムに変える）
  cancelAll(toItem = true, force = false) {
    for (const b of this.list) {
      if (!b.alive || (b.noCancel && !force)) continue;
      b.alive = false;
      Fx.cancel(b.x, b.y, b.color);
      if (toItem) spawnItem('star', b.x, b.y, true);
    }
  }
  cancelIn(fn, toItem = true) {
    for (const b of this.list) {
      if (!b.alive || b.noCancel || !fn(b)) continue;
      b.alive = false;
      Fx.cancel(b.x, b.y, b.color);
      if (toItem) spawnItem('star', b.x, b.y, true);
    }
  }
  draw(ctx) {
    const m = ctx.getTransform();
    const k = m.a;
    for (let pass = 0; pass < 2; pass++) {
      if (pass === 1) ctx.globalCompositeOperation = 'lighter';
      for (const b of this.list) {
        if (b.additive !== (pass === 1)) continue;
        const s = b.size;
        if (b.delay > 0) {
          const p = b.delay / b.delayMax;
          const gs = s * (1 + p * 1.4) + 8;
          ctx.setTransform(k, 0, 0, k, m.e + k * b.x, m.f + k * b.y);
          ctx.globalAlpha = 0.9 * p;
          ctx.drawImage(getGlowSprite(b.color), -gs / 2, -gs / 2, gs, gs);
          ctx.globalAlpha = 1 - p;
        }
        if (b.rot) {
          const c = Math.cos(b.rot) * k, sn = Math.sin(b.rot) * k;
          ctx.setTransform(c, sn, -sn, c, m.e + k * b.x, m.f + k * b.y);
        } else {
          ctx.setTransform(k, 0, 0, k, m.e + k * b.x, m.f + k * b.y);
        }
        ctx.drawImage(b.sprite, -s / 2, -s / 2, s, s);
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(m);
  }
}

// ------------------------------------------------------------
//  レーザー（予告線 → 照射 → 消滅）
// ------------------------------------------------------------
class Laser {
  constructor(o) {
    this.x = o.x;
    this.y = o.y;
    this.angle = o.angle ?? Math.PI / 2;
    this.length = o.length ?? 640;
    this.width = o.width ?? 14;
    this.color = o.color || 'blue';
    this.warn = o.warn ?? 50;
    this.dur = o.dur ?? 60;
    this.fadeOut = 14;
    this.angVel = o.angVel || 0;
    this.angVelWarn = o.angVelWarn ?? this.angVel;
    this.follow = o.follow || null;
    this.frame = 0;
    this.alive = true;
    this.grazeCd = 0;
  }
  get on() { return this.frame >= this.warn + 6 && this.frame < this.warn + this.dur; }
  widthNow() {
    const f = this.frame - this.warn;
    if (f < 0) return 1.5;
    if (f < this.dur) return this.width * Math.min(1, f / 8);
    return this.width * Math.max(0, 1 - (f - this.dur) / this.fadeOut);
  }
  update() {
    this.frame++;
    this.angle += this.frame < this.warn ? this.angVelWarn : this.angVel;
    if (this.follow) this.follow(this);
    if (this.frame === this.warn) Sound.se('laser');
    if (this.frame >= this.warn + this.dur + this.fadeOut) this.alive = false;
    if (this.grazeCd > 0) this.grazeCd--;
  }
  // 点と線分の距離
  distTo(px, py) {
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);
    const t = clamp((px - this.x) * dx + (py - this.y) * dy, 0, this.length);
    return Math.hypot(this.x + dx * t - px, this.y + dy * t - py);
  }
  hits(px, py, r) { return this.on && this.distTo(px, py) < this.width * 0.36 + r; }
  draw(ctx) {
    const w = this.widthNow();
    const rim = (BCOL[this.color] || BCOL.white).rim;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.frame < this.warn) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(this.frame * 0.5);
      ctx.fillStyle = rim;
      ctx.fillRect(0, -0.8, this.length, 1.6);
    } else {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, -w / 2, 0, w / 2);
      g.addColorStop(0, hexA(rim, 0));
      g.addColorStop(0.25, hexA(rim, 0.8));
      g.addColorStop(0.5, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.75, hexA(rim, 0.8));
      g.addColorStop(1, hexA(rim, 0));
      ctx.fillStyle = g;
      ctx.fillRect(0, -w / 2, this.length, w);
      ctx.fillStyle = hexA(rim, 0.6);
      ctx.beginPath(); ctx.arc(0, 0, w * 0.7, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

// ------------------------------------------------------------
//  弾幕ヘルパー
// ------------------------------------------------------------
function fire(o) {
  if (!o.silent) Sound.se('tan');
  return G.bullets.spawn(o);
}
function fireRing(o) {
  const out = [];
  const n = o.n, base = o.angle ?? 0;
  for (let i = 0; i < n; i++) out.push(fire({ ...o, angle: base + (i * TAU) / n }));
  return out;
}
function fireFan(o) {
  const out = [];
  const n = o.n, sp = o.spread ?? 0.5, base = o.angle ?? Math.PI / 2;
  for (let i = 0; i < n; i++) {
    const a = n === 1 ? base : base - sp / 2 + (sp * i) / (n - 1);
    out.push(fire({ ...o, angle: a }));
  }
  return out;
}
function fireLaser(o) {
  const l = new Laser(o);
  G.lasers.push(l);
  return l;
}
function aimAt(x, y) { return angleTo(x, y, G.player.x, G.player.y); }

</script>
<script>
'use strict';
// ============================================================
//  エフェクト（パーティクル）
// ============================================================

const Fx = {
  list: [],
  reset() { this.list = []; },
  add(p) {
    p.max = p.life;
    p.vx = p.vx || 0;
    p.vy = p.vy || 0;
    p.drag = p.drag ?? 1;
    this.list.push(p);
    if (this.list.length > 1600) this.list.splice(0, this.list.length - 1600);
    return p;
  },
  update() {
    for (const p of this.list) {
      p.life--;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.drag;
      p.vy *= p.drag;
      if (p.grow) p.r += p.grow;
    }
    this.list = this.list.filter(p => p.life > 0);
  },
  draw(ctx, layer = 0) {
    for (const p of this.list) {
      if ((p.layer || 0) !== layer) continue;
      const k = p.life / p.max;
      switch (p.type) {
        case 'spark': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = k;
          ctx.lineWidth = p.w || 1.5;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3);
          ctx.stroke();
          break;
        }
        case 'ring': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = k * (p.alpha ?? 1);
          ctx.lineWidth = (p.w || 2) * (0.4 + k * 0.6);
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.1, p.r), 0, TAU);
          ctx.stroke();
          break;
        }
        case 'flash': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k * (p.alpha ?? 1);
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(1, p.r));
          g.addColorStop(0, 'rgba(255,255,255,0.9)');
          g.addColorStop(0.3, p.color);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(1, p.r), 0, TAU);
          ctx.fill();
          break;
        }
        case 'glow': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k;
          const s = p.r * (0.5 + k * 0.5) * 2;
          ctx.drawImage(getGlowSprite(p.color), p.x - s / 2, p.y - s / 2, s, s);
          break;
        }
        case 'text': {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = Math.min(1, k * 2);
          ctx.font = `bold ${p.size || 11}px ${FONT_EN}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          strokeText(ctx, p.text, p.x, p.y, p.color, 'rgba(0,0,0,0.7)', 2.5);
          break;
        }
        case 'petal': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = k;
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.life * 0.2);
          starPath(ctx, p.r, p.r * 0.45);
          ctx.fill();
          ctx.restore();
          break;
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },

  spark(x, y, color, n = 6, speed = 3, life = 18) {
    for (let i = 0; i < n; i++) {
      const a = frand(TAU), s = frand(speed * 0.4, speed);
      this.add({ type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: frand(life * 0.6, life), color, drag: 0.92 });
    }
  },
  ring(x, y, color, r0, grow, life, w = 2) {
    this.add({ type: 'ring', x, y, r: r0, grow, life, color, w });
  },
  flash(x, y, color, r, life, grow = 0) {
    this.add({ type: 'flash', x, y, r, life, color, grow });
  },
  explosion(x, y, color = 'rgba(255,200,120,0.7)', size = 1) {
    this.flash(x, y, color, 16 * size, 16, 1.2 * size);
    this.ring(x, y, color, 6 * size, 2.2 * size, 18, 2);
    this.spark(x, y, color, Math.round(8 * size), 3.5 * size, 22);
  },
  cancel(x, y, color) {
    this.add({ type: 'glow', x, y, r: 12, life: 16, color });
  },
  hit(x, y) {
    this.add({ type: 'spark', x: x + frand(-6, 6), y: y + frand(-4, 8), vx: frand(-1, 1), vy: frand(-3, -1), life: 8, color: 'rgba(255,255,255,0.8)', w: 1 });
  },
  graze(x, y) {
    const a = frand(TAU);
    this.add({ type: 'spark', x, y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 14, color: 'rgba(255,255,255,0.9)', drag: 0.9, w: 1.2 });
  },
  text(x, y, text, color = '#fff', size = 11, life = 50) {
    this.add({ type: 'text', x, y, vy: -0.5, drag: 0.97, text, color, size, life });
  },
  stars(x, y, n, color, speed = 4) {
    for (let i = 0; i < n; i++) {
      const a = frand(TAU), s = frand(speed * 0.3, speed);
      this.add({ type: 'petal', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: frand(2, 5), life: frand(30, 60), color, drag: 0.95 });
    }
  },
  bossExplosion(x, y) {
    for (let i = 0; i < 5; i++) this.ring(x, y, i % 2 ? 'rgba(255,220,255,0.9)' : 'rgba(160,200,255,0.9)', 4, 3 + i * 1.5, 50 + i * 8, 3);
    this.flash(x, y, 'rgba(255,240,220,0.8)', 40, 60, 4);
    this.spark(x, y, 'rgba(255,230,200,0.9)', 50, 9, 60);
    this.stars(x, y, 40, 'rgba(255,240,160,0.9)', 7);
  },
  playerDeath(x, y) {
    for (let i = 0; i < 3; i++) this.ring(x, y, 'rgba(255,120,200,0.9)', 4, 4 + i * 2.5, 40, 3);
    this.flash(x, y, 'rgba(255,150,220,0.7)', 20, 30, 3);
    this.spark(x, y, 'rgba(255,200,240,0.9)', 30, 7, 40);
  },
};

// ============================================================
//  アイテム
// ============================================================
class Item {
  constructor(type, x, y, auto = false) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.vx = type === 'star' ? 0 : frand(-0.8, 0.8);
    this.vy = type === 'star' ? 0 : -frand(1.8, 3.0);
    this.auto = auto;
    this.frame = 0;
    this.alive = true;
    this.homeSpeed = 0;
    this.rot = type === 'star' ? 0 : frand(-3, 3);
  }
  update(p) {
    this.frame++;
    const playerOk = p.state === 'normal';
    if (playerOk && (this.auto || (this.type !== 'star' && p.y < POC_LINE))) this.auto = true;
    const d = dist(this.x, this.y, p.x, p.y);
    const magnet = p.focused ? 70 : 42;
    if (playerOk && (this.auto || d < magnet) && (this.type !== 'star' || this.frame > 10)) {
      this.homeSpeed = Math.min(this.homeSpeed + 0.6, 9);
      const a = angleTo(this.x, this.y, p.x, p.y);
      this.x += Math.cos(a) * this.homeSpeed;
      this.y += Math.sin(a) * this.homeSpeed;
      if (d < 18) { this.alive = false; G.collectItem(this); }
      return;
    }
    if (this.type === 'star') {
      this.y -= 0.3;
      if (this.frame > 90) this.auto = true;
      return;
    }
    this.vy = Math.min(this.vy + 0.05, 2.2);
    this.vx *= 0.95;
    this.x += this.vx;
    this.y += this.vy;
    this.rot *= 0.94;
    if (this.y > FIELD_H + 20) this.alive = false;
    if (playerOk && d < 18) { this.alive = false; G.collectItem(this); }
  }
  draw(ctx) {
    const spr = getItemSprite(this.type);
    const s = spr.width / SPR;
    if (this.y < -s / 2) {
      // 画面上にあるアイテムの位置表示
      ctx.globalAlpha = 0.7;
      ctx.drawImage(spr, this.x - s / 4, 2, s / 2, s / 2);
      ctx.globalAlpha = 1;
      return;
    }
    if (this.rot) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.drawImage(spr, -s / 2, -s / 2, s, s);
      ctx.restore();
    } else {
      ctx.drawImage(spr, this.x - s / 2, this.y - s / 2, s, s);
    }
  }
}

const POC_LINE = 112; // これより上に行くとアイテムを自動回収

function spawnItem(type, x, y, auto = false) {
  const it = new Item(type, x, y, auto);
  G.items.push(it);
  return it;
}

function dropItems(x, y, spec) {
  for (const [type, n] of Object.entries(spec)) {
    for (let i = 0; i < n; i++) {
      spawnItem(type, x + frand(-14, 14), y + frand(-14, 14));
    }
  }
}

</script>
<script>
'use strict';
// ============================================================
//  自機
// ============================================================

const PLAYER_TYPES = {
  reimu: {
    speed: 4.5, focusSpeed: 2.0, hitR: 2.2, deathbomb: 15,
    shotDesc: ['高速移動：ホーミングアミュレット', '低速移動：パスウェイジョンニードル'],
    bombName: '霊符「夢想封印」',
    desc: '誘導弾で敵を自動で狙う、扱いやすいタイプ。\nボムは画面中の敵を追いかける光の玉。',
  },
  marisa: {
    speed: 5.0, focusSpeed: 2.2, hitR: 2.4, deathbomb: 9,
    shotDesc: ['高速移動：マジックミサイル', '低速移動：イリュージョンレーザー'],
    bombName: '恋符「マスタースパーク」',
    desc: '攻撃力と移動速度に優れたパワータイプ。\nボムは前方を焼き払う極太レーザー。',
  },
};

const OPT_LAYOUT = {
  un: [[], [[0, -30]], [[-26, -6], [26, -6]], [[-30, -2], [0, -32], [30, -2]], [[-34, 4], [-16, -24], [16, -24], [34, 4]]],
  fo: [[], [[0, -24]], [[-10, -22], [10, -22]], [[-14, -18], [0, -28], [14, -18]], [[-18, -14], [-7, -26], [7, -26], [18, -14]]],
};

// ------------------------------------------------------------
//  自機ショット
// ------------------------------------------------------------
class PShot {
  constructor(kind, x, y, vx, vy, dmg) {
    this.kind = kind;
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.dmg = dmg;
    this.alive = true;
    this.r = kind === 'missile' ? 7 : 6;
    this.frame = 0;
    this.target = null;
  }
  update() {
    this.frame++;
    if (this.kind === 'homing') {
      if (!this.target || !this.target.alive || this.target.untouchable) this.target = G.nearestTarget(this.x, this.y);
      const sp = 11;
      let a = Math.atan2(this.vy, this.vx);
      if (this.target) {
        const want = angleTo(this.x, this.y, this.target.x, this.target.y);
        a += clamp(normAngle(want - a), -0.22, 0.22);
      }
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp;
    }
    if (this.kind === 'missile') this.vy -= 0.4;
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -24 || this.y > FIELD_H + 24 || this.x < -24 || this.x > FIELD_W + 24) this.alive = false;
  }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI / 2);
    switch (this.kind) {
      case 'amulet':
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#fff';
        ctx.fillRect(-3.5, -7, 7, 14);
        ctx.fillStyle = '#e03040';
        ctx.fillRect(-2, -4, 4, 8);
        break;
      case 'homing':
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = '#f4e8ff';
        ctx.fillRect(-3, -5, 6, 10);
        ctx.fillStyle = '#a050ff';
        ctx.fillRect(-1.5, -3, 3, 6);
        break;
      case 'needle':
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#ffd0e0';
        ctx.fillRect(-1.5, -12, 3, 24);
        ctx.fillStyle = '#ff4060';
        ctx.fillRect(-0.7, -12, 1.4, 24);
        break;
      case 'star':
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = '#fff0a0';
        starPath(ctx, 6, 2.6);
        ctx.fill();
        break;
      case 'missile':
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = '#80ff90';
        ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(3, 2); ctx.lineTo(-3, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(160,255,200,0.4)';
        ctx.fillRect(-2, 2, 4, 8);
        break;
    }
    ctx.restore();
  }
}

// ------------------------------------------------------------
//  ボム：霊符「夢想封印」
// ------------------------------------------------------------
class FantasySeal {
  constructor(p) {
    this.p = p;
    this.frame = 0;
    this.done = false;
    this.slow = false;
    const colors = ['#ff5060', '#ffa040', '#ffe050', '#60f070', '#50d8ff', '#6070ff', '#c060ff', '#ff70d0'];
    this.orbs = colors.map((c, i) => ({ c, a: (i * TAU) / 8, r: 0, x: p.x, y: p.y, vx: 0, vy: 0, alive: true, target: null }));
  }
  update(g) {
    this.frame++;
    const f = this.frame;
    if (f < 150) { g.bullets.cancelAll(true); g.clearLasers(); }
    for (const o of this.orbs) {
      if (!o.alive) continue;
      if (f < 40) {
        o.a += 0.14;
        o.r = 56 * Ease.outCubic(f / 40);
        o.x = this.p.x + Math.cos(o.a) * o.r;
        o.y = this.p.y + Math.sin(o.a) * o.r;
        o.vx = Math.cos(o.a + Math.PI / 2) * 3;
        o.vy = Math.sin(o.a + Math.PI / 2) * 3 - 2;
        continue;
      }
      if (!o.target || !o.target.alive) o.target = g.nearestTarget(o.x, o.y);
      const tx = o.target ? o.target.x : o.x, ty = o.target ? o.target.y : -60;
      const a = angleTo(o.x, o.y, tx, ty);
      o.vx = o.vx * 0.9 + Math.cos(a) * 1.1;
      o.vy = o.vy * 0.9 + Math.sin(a) * 1.1;
      o.x += o.vx;
      o.y += o.vy;
      const hitTarget = o.target && dist(o.x, o.y, o.target.x, o.target.y) < (o.target.r || 16) + 12;
      if (hitTarget || f > 40 + 100 + this.orbs.indexOf(o) * 6 || o.y < -40) {
        o.alive = false;
        g.areaDamage(o.x, o.y, 80, 45, true);
        Fx.explosion(o.x, o.y, hexA(o.c, 0.8), 2.2);
        g.shake = Math.max(g.shake, 8);
        Sound.se('kill');
      }
    }
    if (f > 60 && this.orbs.every(o => !o.alive)) this.done = true;
  }
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const o of this.orbs) {
      if (!o.alive) continue;
      const pulse = 22 + Math.sin(this.frame * 0.4) * 3;
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, pulse);
      g.addColorStop(0, 'rgba(255,255,255,0.95)');
      g.addColorStop(0.35, hexA(o.c, 0.8));
      g.addColorStop(1, hexA(o.c, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(o.x, o.y, pulse, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ------------------------------------------------------------
//  ボム：恋符「マスタースパーク」
// ------------------------------------------------------------
class MasterSpark {
  constructor(p) {
    this.p = p;
    this.frame = 0;
    this.done = false;
    this.slow = true;
    this.duration = 210;
  }
  width() {
    const f = this.frame;
    if (f < 20) return 110 * Ease.outCubic(f / 20);
    if (f > this.duration - 30) return 110 * Math.max(0, (this.duration - f) / 30);
    return 110 + Math.sin(f * 0.8) * 6;
  }
  update(g) {
    this.frame++;
    const w = this.width();
    const x = this.p.x, y = this.p.y - 16;
    if (this.frame === 1) { g.bullets.cancelAll(true); g.clearLasers(); }
    g.bullets.cancelIn(b => Math.abs(b.x - x) < w / 2 + 12 && b.y < y + 20);
    if (this.frame % 2 === 0 && this.frame > 10) {
      for (const e of g.enemies) {
        if (e.alive && Math.abs(e.x - x) < w / 2 + e.r && e.y < y + 10) g.damageEnemy(e, 3.4, true);
      }
      const b = g.boss;
      if (b && b.alive && Math.abs(b.x - x) < w / 2 + b.r && b.y < y + 10) g.damageEnemy(b, 3.4, true);
    }
    g.shake = Math.max(g.shake, 3);
    if (this.frame >= this.duration) this.done = true;
  }
  draw(ctx) {
    const w = this.width();
    if (w <= 0.5) return;
    const x = this.p.x, y = this.p.y - 16;
    ctx.globalCompositeOperation = 'lighter';
    const hue = (this.frame * 6) % 360;
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, `hsla(${hue},100%,60%,0)`);
    g.addColorStop(0.18, `hsla(${hue},100%,65%,0.55)`);
    g.addColorStop(0.35, `hsla(${(hue + 60) % 360},100%,80%,0.8)`);
    g.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.65, `hsla(${(hue + 120) % 360},100%,80%,0.8)`);
    g.addColorStop(0.82, `hsla(${(hue + 180) % 360},100%,65%,0.55)`);
    g.addColorStop(1, `hsla(${(hue + 180) % 360},100%,60%,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - w / 2, -20, w, y + 20);
    const og = ctx.createRadialGradient(x, y, 0, x, y, w * 0.7);
    og.addColorStop(0, 'rgba(255,255,255,0.9)');
    og.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = og;
    ctx.beginPath(); ctx.arc(x, y, w * 0.7, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 12; i++) {
      const sy = (y - ((this.frame * 14 + i * 53) % (y + 40)));
      const sx = x + Math.sin(i * 12.9 + this.frame * 0.2) * w * 0.4;
      ctx.fillRect(sx - 1, sy, 2, 10);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

// ------------------------------------------------------------
//  自機本体
// ------------------------------------------------------------
function drawYinYang(ctx, x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d82030';
  ctx.beginPath();
  ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.arc(0, r / 2, r / 2, Math.PI / 2, -Math.PI / 2, true);
  ctx.arc(0, -r / 2, r / 2, Math.PI / 2, -Math.PI / 2, false);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, r / 2, r / 6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#d82030';
  ctx.beginPath(); ctx.arc(0, -r / 2, r / 6, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

class Player {
  constructor(id) {
    this.id = id;
    this.type = PLAYER_TYPES[id];
    this.hitR = this.type.hitR;
    this.grazeR = 20;
    this.x = FIELD_W / 2;
    this.y = FIELD_H - 48;
    this.state = 'normal';
    this.timer = 0;
    this.invuln = 0;
    this.frame = 0;
    this.tilt = 0;
    this.focused = false;
    this.focusT = 0;
    this.shotFrame = 0;
    this.bomb = null;
    this.opts = [];
    this.lasers = [];
  }

  get visible() { return this.state !== 'dead'; }

  update(g) {
    this.frame++;
    const move = Input.consumeMove();
    if (this.invuln > 0) this.invuln--;
    if (this.bomb) {
      this.bomb.update(g);
      if (this.bomb.done) this.bomb = null;
    }
    this.lasers = [];
    switch (this.state) {
      case 'hit':
        this.timer--;
        if (Input.pressed('bomb') && g.bombs > 0) {
          this.state = 'normal';
          this.useBomb(g);
        } else if (this.timer <= 0) this.die(g);
        return;
      case 'dead':
        this.timer--;
        if (this.timer <= 0) {
          if (g.lives < 0) { g.onOutOfLives(); return; }
          this.state = 'respawn';
          this.timer = 40;
          this.x = FIELD_W / 2;
          this.y = FIELD_H + 30;
          this.invuln = 220;
        }
        return;
      case 'respawn':
        this.timer--;
        this.y = lerp(FIELD_H + 30, FIELD_H - 48, Ease.outCubic(1 - this.timer / 40));
        if (this.timer <= 0) this.state = 'normal';
        this.updateOptions(g);
        return;
    }

    this.focused = Input.down('focus');
    this.focusT += ((this.focused ? 1 : 0) - this.focusT) * 0.3;
    let dx = (Input.down('right') ? 1 : 0) - (Input.down('left') ? 1 : 0);
    let dy = (Input.down('down') ? 1 : 0) - (Input.down('up') ? 1 : 0);
    let sp = this.focused ? this.type.focusSpeed : this.type.speed;
    if (this.bomb && this.bomb.slow) sp *= 0.5;
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
    this.x += dx * sp;
    this.y += dy * sp;
    if (move.x || move.y) {
      const s = this.focused ? 0.75 : 1.25;
      this.x += move.x * s;
      this.y += move.y * s;
      dx = clamp(move.x, -1, 1);
    }
    this.x = clamp(this.x, 8, FIELD_W - 8);
    this.y = clamp(this.y, 16, FIELD_H - 16);
    this.tilt += (dx - this.tilt) * 0.2;

    const shooting = (Input.down('shot') || Input.dragging) && g.canShoot();
    if (shooting) this.shoot(g); else this.shotFrame = 0;
    if (Input.pressed('bomb') && g.canShoot()) this.useBomb(g);
    this.updateOptions(g);
    if (shooting && this.id === 'marisa' && this.focused) this.fireLasers(g);
  }

  updateOptions(g) {
    const n = Math.min(4, Math.floor(g.power / 100));
    while (this.opts.length < n) this.opts.push({ x: this.x, y: this.y });
    this.opts.length = n;
    const un = OPT_LAYOUT.un[n], fo = OPT_LAYOUT.fo[n];
    for (let i = 0; i < n; i++) {
      const tx = this.x + lerp(un[i][0], fo[i][0], this.focusT);
      const ty = this.y + lerp(un[i][1], fo[i][1], this.focusT);
      const o = this.opts[i];
      o.x += (tx - o.x) * 0.4;
      o.y += (ty - o.y) * 0.4;
    }
  }

  shoot(g) {
    const f = this.shotFrame++;
    if (f % 5 === 0) Sound.se('shot');
    const shots = g.shots;
    if (this.id === 'reimu') {
      if (f % 4 === 0) {
        shots.push(new PShot('amulet', this.x - 6, this.y - 10, 0, -16, 1));
        shots.push(new PShot('amulet', this.x + 6, this.y - 10, 0, -16, 1));
      }
      if (this.focused) {
        if (f % 4 === 0) for (const o of this.opts) shots.push(new PShot('needle', o.x, o.y - 8, 0, -20, 1.8));
      } else if (f % 8 === 0) {
        this.opts.forEach((o, i) => {
          const a = -Math.PI / 2 + (i - (this.opts.length - 1) / 2) * 0.35;
          const s = new PShot('homing', o.x, o.y, Math.cos(a) * 11, Math.sin(a) * 11, 2);
          shots.push(s);
        });
      }
    } else {
      if (f % 4 === 0) {
        shots.push(new PShot('star', this.x - 6, this.y - 10, 0, -17, 1.2));
        shots.push(new PShot('star', this.x + 6, this.y - 10, 0, -17, 1.2));
      }
      if (!this.focused && f % 10 === 0) {
        this.opts.forEach((o, i) => {
          const a = -Math.PI / 2 + (i - (this.opts.length - 1) / 2) * 0.14;
          shots.push(new PShot('missile', o.x, o.y - 6, Math.cos(a) * 6, Math.sin(a) * 6, 4.5));
        });
      }
    }
  }

  // 魔理沙の低速レーザー：一番手前の敵で止まる
  fireLasers(g) {
    for (const o of this.opts) {
      let best = null, bestY = -Infinity;
      const consider = e => {
        if (!e || !e.alive || e.untouchable || e.y > o.y || e.y < -20) return;
        if (Math.abs(e.x - o.x) < e.r + 4 && e.y > bestY) { best = e; bestY = e.y; }
      };
      for (const e of g.enemies) consider(e);
      consider(g.boss);
      const endY = best ? best.y + 4 : -20;
      if (best) {
        g.damageEnemy(best, 0.42, false, this.frame % 2 === 0);
        if (this.frame % 3 === 0) Fx.hit(o.x, best.y + 6);
      }
      this.lasers.push({ x: o.x, y0: o.y - 6, y1: endY });
    }
  }

  useBomb(g) {
    if (this.bomb || g.bombs <= 0) return;
    g.bombs--;
    g.bombsUsed++;
    g.spellFailed = true;
    this.invuln = Math.max(this.invuln, this.id === 'reimu' ? 250 : 270);
    this.bomb = this.id === 'reimu' ? new FantasySeal(this) : new MasterSpark(this);
    g.showBombName(this.type.bombName);
    g.flash = { color: '255,255,255', a: 0.5 };
    Sound.se('bomb');
  }

  hit(g) {
    if (this.state !== 'normal' || this.invuln > 0) return;
    this.state = 'hit';
    this.timer = this.type.deathbomb;
    Sound.se('pichuun');
    Fx.flash(this.x, this.y, 'rgba(255,120,200,0.8)', 24, 12);
  }

  die(g) {
    this.state = 'dead';
    this.timer = 60;
    this.bomb = null;
    Fx.playerDeath(this.x, this.y);
    g.onPlayerDeath(this.x, this.y);
  }

  draw(ctx) {
    if (!this.visible) return;
    const blink = this.invuln > 0 && (this.frame % 6 < 3);
    // オプション
    for (let i = 0; i < this.opts.length; i++) {
      const o = this.opts[i];
      if (this.id === 'reimu') drawYinYang(ctx, o.x, o.y, 6, this.frame * 0.12 * (i % 2 ? 1 : -1));
      else {
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, 9);
        g.addColorStop(0, 'rgba(255,255,220,0.95)');
        g.addColorStop(0.4, 'rgba(120,255,140,0.7)');
        g.addColorStop(1, 'rgba(60,200,100,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(o.x, o.y, 9, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#fff8c0';
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(this.frame * 0.08); starPath(ctx, 4, 1.8); ctx.fill(); ctx.restore();
      }
    }
    // 魔理沙のレーザー
    if (this.lasers.length) {
      ctx.globalCompositeOperation = 'lighter';
      for (const l of this.lasers) {
        const w = 5 + Math.sin(this.frame * 0.9) * 1;
        const g = ctx.createLinearGradient(l.x - w, 0, l.x + w, 0);
        g.addColorStop(0, 'rgba(80,255,120,0)');
        g.addColorStop(0.5, 'rgba(230,255,200,0.75)');
        g.addColorStop(1, 'rgba(80,255,120,0)');
        ctx.fillStyle = g;
        ctx.fillRect(l.x - w, l.y1, w * 2, l.y0 - l.y1);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (blink) ctx.globalAlpha = 0.35;
    ctx.save();
    ctx.translate(this.x, this.y + Math.sin(this.frame * 0.1) * 0.6);
    // 画像の自機（高さ30px）。移動方向に少し傾ける
    ctx.transform(1, 0, -this.tilt * 0.12, 1, 0, 0);
    if (!drawImageSprite(ctx, 'player', 30, 0.3, 0.52)) {
      ctx.translate(0, 2);
      drawPlayerBack(ctx, this.id, this.frame, this.tilt);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 当たり判定表示（弾より手前に描く）
  drawHitbox(ctx) {
    if (!this.visible || this.focusT < 0.05) return;
    const a = this.focusT;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.rotate(this.frame * 0.04);
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, TAU); ctx.stroke();
    for (let i = 0; i < 8; i++) {
      ctx.rotate(TAU / 8);
      ctx.fillStyle = i % 2 ? 'rgba(255,160,200,0.9)' : 'rgba(255,255,255,0.9)';
      ctx.fillRect(24, -1.5, 5, 3);
    }
    ctx.rotate(-this.frame * 0.08);
    ctx.strokeStyle = 'rgba(255,190,220,0.6)';
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, TAU); ctx.stroke();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#e03050';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, this.hitR + 1.2, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

<script>
'use strict';
// ============================================================
//  ザコ敵・ボス
// ============================================================

class Enemy {
  constructor(o) {
    this.x = o.x;
    this.y = o.y;
    this.hp = this.maxHp = o.hp ?? 12;
    this.kind = o.kind || 'fairy';
    this.color = o.color || 'blue';
    this.r = o.r ?? (this.kind === 'bigfairy' ? 18 : this.kind === 'kedama' ? 10 : 12);
    this.speed = o.speed || 0;
    this.angle = o.angle ?? Math.PI / 2;
    this.accel = o.accel || 0;
    this.angVel = o.angVel || 0;
    this.drops = o.drops ?? { power: 1 };
    this.score = o.score ?? 1000;
    this.frame = 0;
    this.alive = true;
    this.flash = 0;
    this.entered = false;
    this.untouchable = false;
    this.invincible = 0;
    this.keep = !!o.keep;
    this.noBody = !!o.noBody;
    this.onDeath = o.onDeath || null;
    this.tasks = new TaskRunner();
    if (o.script) this.tasks.add(o.script(this));
  }
  update() {
    this.frame++;
    if (this.flash > 0) this.flash--;
    if (this.invincible > 0) this.invincible--;
    this.tasks.update();
    if (!this.alive) return;
    if (this.accel) this.speed = clamp(this.speed + this.accel, 0, 20);
    if (this.angVel) this.angle += this.angVel;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    const inside = this.x > -8 && this.x < FIELD_W + 8 && this.y > -8 && this.y < FIELD_H + 8;
    if (inside) this.entered = true;
    else if (!this.keep && (this.entered || this.frame > 900)) {
      const m = 48;
      if (this.x < -m || this.x > FIELD_W + m || this.y < -m || this.y > FIELD_H + m) {
        this.alive = false;
        this.tasks.clear();
      }
    }
  }
  setMove(speed, angle, accel = 0, angVel = 0) {
    this.speed = speed;
    this.angle = angle;
    this.accel = accel;
    this.angVel = angVel;
  }
  *moveTo(x, y, frames, ease = Ease.outQuad) {
    const sx = this.x, sy = this.y;
    this.speed = 0;
    this.accel = 0;
    for (let i = 1; i <= frames; i++) {
      const t = ease(i / frames);
      this.x = lerp(sx, x, t);
      this.y = lerp(sy, y, t);
      yield;
    }
  }
  aim() { return aimAt(this.x, this.y); }
  get onScreen() { return this.x > 0 && this.x < FIELD_W && this.y > 0 && this.y < FIELD_H; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    switch (this.kind) {
      case 'bigfairy': drawFairy(ctx, this.color, this.frame, true); break;
      case 'kedama': drawKedama(ctx, this.color, this.frame); break;
      case 'foot':
        ctx.rotate(Math.sin(this.frame * 0.12) * 0.12);
        if (!drawImageSprite(ctx, 'footFairy', 30, 0.35, 0.5)) drawFairy(ctx, this.color, this.frame, false);
        break;
      case 'midboss1':
        ctx.translate(0, Math.sin(this.frame * 0.05) * 2);
        if (!drawImageSprite(ctx, 'midboss1', 76)) drawFairy(ctx, this.color, this.frame, true);
        break;
      default: drawFairy(ctx, this.color, this.frame, false);
    }
    if (this.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(0, 0, this.r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
}

function spawnEnemy(o) {
  const e = new Enemy(o);
  G.enemies.push(e);
  return e;
}

// ------------------------------------------------------------
//  ボス
// ------------------------------------------------------------
class Boss {
  constructor(id, def = {}) {
    this.id = id;
    this.def = def;
    this.name = CHARA_INFO[id].name;
    this.isBoss = true;
    this.x = def.x ?? FIELD_W / 2;
    this.y = def.y ?? -50;
    this.r = 22;
    this.hp = 1;
    this.maxHp = 1;
    this.alive = true;
    this.frame = 0;
    this.flash = 0;
    this.invincible = 0;
    this.untouchable = true;
    this.timer = 0;
    this.phase = null;
    this.tasks = new TaskRunner();
    this.moveTask = null;
    this.prevX = this.x;
    this.tilt = 0;
    this.pose = def.pose || null;
    this.circleColor = def.circleColor || '160,180,255';
    this.alpha = 1;
  }
  update() {
    this.frame++;
    if (this.flash > 0) this.flash--;
    if (this.invincible > 0) this.invincible--;
    this.tasks.update();
    if (this.moveTask) {
      const r = this.moveTask.next();
      if (r.done) this.moveTask = null;
    }
    const vx = this.x - this.prevX;
    this.tilt += (clamp(vx, -3, 3) / 3 - this.tilt) * 0.15;
    this.prevX = this.x;
  }
  *moveTo(x, y, frames, ease = Ease.inOutSine) {
    const sx = this.x, sy = this.y;
    for (let i = 1; i <= frames; i++) {
      const t = ease(i / frames);
      this.x = lerp(sx, x, t);
      this.y = lerp(sy, y, t);
      yield;
    }
  }
  // 移動を別枠で走らせる（攻撃と並行して動く）
  move(x, y, frames, ease) { this.moveTask = this.moveTo(x, y, frames, ease); }
  wander(frames = 50, range = 70) {
    const p = G.player;
    let dir = Math.sign(p.x - this.x) || randSign();
    if (rng.next() < 0.35) dir = -dir;
    const tx = clamp(this.x + dir * rand(range * 0.5, range), 56, FIELD_W - 56);
    const ty = clamp(rand(70, 130), 50, 150);
    this.move(tx, ty, frames);
  }
  get moving() { return !!this.moveTask; }
  aim() { return aimAt(this.x, this.y); }

  draw(ctx) {
    if (!this.alive) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = this.alpha;
    // 魔法陣
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const pr = 44 + Math.sin(this.frame * 0.05) * 4;
    ctx.strokeStyle = `rgba(${this.circleColor},0.45)`;
    ctx.lineWidth = 1.5;
    ctx.rotate(this.frame * 0.03);
    ctx.beginPath(); ctx.arc(0, 0, pr, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, pr - 6, 0, TAU); ctx.stroke();
    for (let k = 0; k < 2; k++) {
      ctx.rotate(Math.PI / 4);
      ctx.strokeRect(-pr * 0.68, -pr * 0.68, pr * 1.36, pr * 1.36);
    }
    ctx.fillStyle = `rgba(${this.circleColor},0.6)`;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      ctx.fillRect(Math.cos(a) * (pr - 3) - 1, Math.sin(a) * (pr - 3) - 1, 2, 2);
    }
    ctx.restore();
    if (this.def.aura) {
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
      g.addColorStop(0, this.def.aura);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, TAU); ctx.fill();
    }
    ctx.rotate(this.tilt * 0.12);
    ctx.scale(1.1, 1.1);
    drawChibi(ctx, this.id, { t: this.frame, pose: this.pose || undefined, face: this.face || 'normal' });
    if (this.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.arc(0, -6, 22, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

<script>
'use strict';
// ============================================================
//  会話
//  行の書式: [話者ID, 表情, 台詞]
//  演出:     { bgm: '曲ID' } / { title: 'キャラID' }
// ============================================================

class Dialogue {
  constructor(lines, g) {
    this.lines = lines;
    this.g = g;
    this.i = -1;
    this.done = false;
    this.frame = 0;
    this.faces = {};
    this.left = g.charId;
    this.right = null;
    this.alphaL = 0;
    this.alphaR = 0;
    this.next();
  }
  next() {
    this.i++;
    while (this.i < this.lines.length && !Array.isArray(this.lines[this.i])) {
      const a = this.lines[this.i];
      if (a.bgm) { Sound.playBgm(a.bgm); this.g.showBgmTitle(a.bgm); }
      if (a.title) this.g.bossTitle = { id: a.title, frame: 0 };
      this.i++;
    }
    if (this.i >= this.lines.length) { this.done = true; return; }
    const [who, face, text] = this.lines[this.i];
    this.who = who;
    this.text = text;
    this.chars = 0;
    this.lineFrame = 0;
    this.faces[who] = face;
    if (who !== this.left) this.right = who;
  }
  update() {
    if (this.done) return;
    this.frame++;
    this.lineFrame++;
    this.chars = Math.min(this.text.length, this.chars + 1.2);
    this.alphaL = Math.min(1, this.alphaL + 0.08);
    if (this.right) this.alphaR = Math.min(1, this.alphaR + 0.08);
    const skip = Input.down('skip');
    const advance = (Input.pressed('shot') || Input.anyTap()) && this.lineFrame > 6;
    if (advance || (skip && this.lineFrame > 3)) {
      if (this.chars < this.text.length && !skip) this.chars = this.text.length;
      else this.next();
    }
  }
  draw(ctx) {
    if (this.done) return;
    const t = this.frame;
    const drawChar = (id, x, alphaIn, flip) => {
      if (!id) return;
      const active = this.who === id;
      ctx.globalAlpha = alphaIn * (active ? 1 : 0.45);
      const slide = (1 - alphaIn) * 30 * (flip ? 1 : -1);
      drawPortrait(ctx, id, x + slide, active ? 318 : 326, 3.2, this.faces[id] || 'normal', t, flip);
      ctx.globalAlpha = 1;
    };
    // 話していない方を奥に
    if (this.who === this.left) { drawChar(this.right, 300, this.alphaR, true); drawChar(this.left, 84, this.alphaL, false); }
    else { drawChar(this.left, 84, this.alphaL, false); drawChar(this.right, 300, this.alphaR, true); }

    const bx = 14, by = 350, bw = FIELD_W - 28, bh = 86;
    ctx.fillStyle = 'rgba(8,6,24,0.8)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = 'rgba(210,190,140,0.7)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 2.5, by + 2.5, bw - 5, bh - 5);
    const info = CHARA_INFO[this.who] || { name: this.who, color: '#fff' };
    ctx.font = `bold 13px ${FONT_JP}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    strokeText(ctx, info.name, bx + 12, by + 8, info.color, 'rgba(0,0,0,0.9)', 3);
    ctx.font = `15px ${FONT_JP}`;
    ctx.fillStyle = '#f4f0ff';
    const shown = this.text.slice(0, Math.floor(this.chars));
    const lines = wrapText(ctx, shown, bw - 30);
    lines.slice(0, 3).forEach((ln, i) => ctx.fillText(ln, bx + 14, by + 28 + i * 20));
    if (this.chars >= this.text.length) {
      ctx.fillStyle = `rgba(255,230,160,${0.5 + 0.5 * Math.sin(t * 0.2)})`;
      ctx.beginPath();
      ctx.moveTo(bx + bw - 18, by + bh - 16); ctx.lineTo(bx + bw - 10, by + bh - 16); ctx.lineTo(bx + bw - 14, by + bh - 10);
      ctx.fill();
    }
  }
}

<script>
'use strict';
// ============================================================
//  HUD（右側パネル・フィールド内表示）
// ============================================================

const TOUCH_BUTTONS = [
  { id: 'bomb', action: 'bomb', x: 432, y: 372, w: 92, h: 84, label: 'ボム' },
  { id: 'focus', action: 'focus', x: 532, y: 372, w: 92, h: 84, label: '低速', toggle: true },
  { id: 'pause', action: 'pause', x: 596, y: 22, w: 34, h: 30, label: 'II' },
];

let frameCanvas = null;
function getFrameCanvas() {
  if (frameCanvas) return frameCanvas;
  const S = 2;
  const c = makeCanvas(SCREEN_W * S, SCREEN_H * S);
  const x = c.getContext('2d');
  x.scale(S, S);
  const g = x.createLinearGradient(0, 0, SCREEN_W, SCREEN_H);
  g.addColorStop(0, '#1a1236');
  g.addColorStop(1, '#0d0a20');
  x.fillStyle = g;
  x.fillRect(0, 0, SCREEN_W, SCREEN_H);
  // 麻の葉文様
  const s = 26, h = s * Math.sqrt(3) / 2;
  x.strokeStyle = 'rgba(190,160,255,0.09)';
  x.lineWidth = 0.8;
  for (let row = -1; row < SCREEN_H / h + 1; row++) {
    for (let col = -1; col < SCREEN_W / s + 2; col++) {
      const ox = col * s + (row % 2 ? s / 2 : 0), oy = row * h;
      const tris = [
        [[ox, oy], [ox + s, oy], [ox + s / 2, oy + h]],
        [[ox + s / 2, oy + h], [ox + s, oy], [ox + s * 1.5, oy + h]],
      ];
      for (const t of tris) {
        const cx = (t[0][0] + t[1][0] + t[2][0]) / 3, cy = (t[0][1] + t[1][1] + t[2][1]) / 3;
        x.beginPath();
        x.moveTo(t[0][0], t[0][1]); x.lineTo(t[1][0], t[1][1]); x.lineTo(t[2][0], t[2][1]); x.closePath();
        for (const v of t) { x.moveTo(cx, cy); x.lineTo(v[0], v[1]); }
        x.stroke();
      }
    }
  }
  x.clearRect(FIELD_X, FIELD_Y, FIELD_W, FIELD_H);
  x.strokeStyle = 'rgba(214,186,120,0.85)';
  x.lineWidth = 1.5;
  x.strokeRect(FIELD_X - 1, FIELD_Y - 1, FIELD_W + 2, FIELD_H + 2);
  x.strokeStyle = 'rgba(214,186,120,0.35)';
  x.lineWidth = 1;
  x.strokeRect(FIELD_X - 4.5, FIELD_Y - 4.5, FIELD_W + 9, FIELD_H + 9);
  frameCanvas = c;
  return c;
}

// 数字を等幅で描く
function drawDigits(ctx, str, x, y, cw, align = 'left') {
  const total = str.length * cw;
  let sx = align === 'right' ? x - total : align === 'center' ? x - total / 2 : x;
  ctx.textAlign = 'center';
  for (const ch of str) {
    ctx.fillText(ch, sx + cw / 2, y);
    sx += cw;
  }
}

function drawStarIcons(ctx, n, x, y, color, max = 8) {
  const shown = Math.min(n, max);
  for (let i = 0; i < max; i++) {
    ctx.fillStyle = i < shown ? color : 'rgba(255,255,255,0.08)';
    ctx.save();
    ctx.translate(x + i * 17, y);
    starPath(ctx, 7, 3);
    ctx.fill();
    if (i < shown) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLogo(ctx, x, y, size = 30) {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 ${size}px ${FONT_JP}`;
  ctx.shadowColor = 'rgba(160,140,255,0.9)';
  ctx.shadowBlur = 12;
  const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#c8b8ff');
  ctx.fillStyle = g;
  ctx.fillText('東方星降夜', x, y);
  ctx.shadowBlur = 0;
  ctx.font = `italic 600 ${Math.round(size * 0.46)}px ${FONT_EN}`;
  ctx.fillStyle = '#e8d8a8';
  ctx.fillText('〜 Night of Falling Stars.', x, y + size * 0.8);
  ctx.restore();
}

function drawSidePanel(ctx, g) {
  ctx.drawImage(getFrameCanvas(), 0, 0, SCREEN_W, SCREEN_H);
  const x0 = 434, vx = 626;
  ctx.textBaseline = 'middle';

  // 難易度
  ctx.font = `italic 700 22px ${FONT_EN}`;
  ctx.textAlign = 'center';
  strokeText(ctx, DIFF_NAMES[DIFF], 522, 38, DIFF_COLORS[DIFF], 'rgba(0,0,0,0.8)', 3);
  if (g.practice) {
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = '#b8a8e0';
    ctx.fillText('― プラクティス ―', 522, 58);
  }

  const label = (t, y) => {
    ctx.font = `600 14px ${FONT_JP}`;
    ctx.textAlign = 'left';
    strokeText(ctx, t, x0, y, '#e8e0ff', 'rgba(0,0,0,0.8)', 3);
  };
  const value = (t, y, color = '#ffffff') => {
    ctx.font = `700 18px ${FONT_EN}`;
    ctx.fillStyle = color;
    drawDigits(ctx, t, vx, y, 10.5, 'right');
  };

  label('ハイスコア', 88); value(padScore(g.hiScore), 88, '#d8d0ff');
  label('スコア', 112); value(padScore(g.score), 112);

  label('残り人数', 150);
  drawStarIcons(ctx, Math.max(0, g.lives), 500, 150, '#ff6fb8');
  label('ボム', 176);
  drawStarIcons(ctx, g.bombs, 500, 176, '#6af09a');

  label('霊力', 214);
  if (g.power >= 400) {
    ctx.font = `italic 700 18px ${FONT_EN}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffe070';
    ctx.fillText('MAX', vx, 214);
  } else value(`${(g.power / 100).toFixed(2)}/4.00`, 214, '#ffb0b0');
  label('グレイズ', 238); value(String(g.graze), 238);
  label('点', 262);
  const next = EXTEND_POINTS[g.extendIdx];
  value(next ? `${g.pointItems}/${next}` : String(g.pointItems), 262, '#b0c8ff');

  if (Input.isTouch) {
    drawLogo(ctx, 528, 318, 22);
    for (const b of TOUCH_BUTTONS) {
      const on = b.toggle ? Input.virtual[b.action] : Input.held[b.action];
      ctx.fillStyle = on ? 'rgba(255,220,150,0.35)' : 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = 'rgba(214,186,120,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(b.x, b.y, b.w, b.h, 8) : ctx.rect(b.x, b.y, b.w, b.h);
      ctx.fill(); ctx.stroke();
      ctx.font = `700 ${b.id === 'pause' ? 14 : 18}px ${FONT_JP}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
    }
  } else {
    drawLogo(ctx, 528, 404, 30);
  }

  ctx.font = `12px ${FONT_EN}`;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(220,210,255,0.6)';
  ctx.fillText(`${Game.fps.toFixed(1)}fps`, 634, 470);
  if (Sound.muted) {
    ctx.textAlign = 'left';
    ctx.fillText('♪ミュート中 (M)', 434, 470);
  }
}

// ------------------------------------------------------------
//  フィールド内
// ------------------------------------------------------------
function drawBossHud(ctx, g) {
  const b = g.boss;
  if (!b || !b.alive || !g.bossPhases) return;
  const ph = b.phase;
  ctx.textBaseline = 'middle';
  ctx.font = `bold 13px ${FONT_JP}`;
  ctx.textAlign = 'left';
  strokeText(ctx, b.name, 6, 10, '#ffffff', 'rgba(0,0,0,0.9)', 3);
  // 残りの攻撃数
  const remain = g.bossPhases.length - g.bossPhaseIdx - 1;
  const nameW = ctx.measureText(b.name).width;
  for (let i = 0; i < remain; i++) {
    ctx.fillStyle = '#ffd070';
    ctx.save(); ctx.translate(14 + nameW + i * 11, 10); starPath(ctx, 4.5, 2); ctx.fill(); ctx.restore();
  }
  // 体力
  if (ph && !ph.survival) {
    const w = FIELD_W - 60;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(6, 20, w, 4);
    const k = clamp(b.hp / b.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(6, 0, 6 + w, 0);
    grad.addColorStop(0, '#ff8a8a');
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.fillRect(6, 20, w * k, 4);
  }
  // 残り時間
  if (ph) {
    const sec = Math.max(0, Math.ceil(b.timer / 60));
    ctx.font = `700 22px ${FONT_EN}`;
    ctx.textAlign = 'right';
    strokeText(ctx, String(sec).padStart(2, '0'), FIELD_W - 6, 18, sec <= 5 ? '#ff7070' : sec <= 10 ? '#ffd0a0' : '#ffffff', 'rgba(0,0,0,0.9)', 3);
  }
  // 敵の位置
  ctx.font = `bold 9px ${FONT_EN}`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,60,90,0.85)';
  ctx.fillRect(b.x - 16, FIELD_H - 10, 32, 10);
  ctx.fillStyle = '#fff';
  ctx.fillText('ENEMY', b.x, FIELD_H - 4.5);
}

function drawSpellName(ctx, g) {
  const sp = g.spell;
  if (!sp) return;
  const f = sp.frame;
  // 中央下から右上へ移動
  const t = clamp((f - 50) / 40, 0, 1);
  const y = lerp(300, 40, Ease.inOutSine(t));
  ctx.font = `bold 14px ${FONT_JP}`;
  const w = ctx.measureText(sp.name).width;
  const x = FIELD_W - 8;
  // ボスや自機が重なっている時は薄くする
  const b = g.boss, p = g.player;
  const covered = t >= 1 && ((b && b.y < 118 && b.x > x - w - 70) || (p.y < 90 && p.x > x - w - 50));
  ctx.globalAlpha = Math.min(1, f / 15) * (covered ? 0.4 : 1);
  const grad = ctx.createLinearGradient(x - w - 40, 0, x, 0);
  grad.addColorStop(0, 'rgba(40,20,80,0)');
  grad.addColorStop(0.3, 'rgba(40,20,80,0.75)');
  grad.addColorStop(1, 'rgba(90,40,140,0.85)');
  ctx.fillStyle = grad;
  ctx.fillRect(x - w - 40, y - 11, w + 46, 22);
  ctx.fillStyle = 'rgba(255,230,160,0.8)';
  ctx.fillRect(x - w - 20, y + 10, w + 26, 1);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  strokeText(ctx, sp.name, x, y, '#ffffff', 'rgba(60,0,60,0.9)', 3);
  if (t >= 1) {
    ctx.font = `600 11px ${FONT_EN}`;
    const bonus = g.spellFailed ? 'Failed' : padScore(g.spellBonus, 8);
    const hist = `History ${sp.history.got}/${sp.history.tried}`;
    strokeText(ctx, `Bonus ${bonus}   ${hist}`, x, y + 20, g.spellFailed ? '#a0a0b8' : '#ffe8b0', 'rgba(0,0,0,0.9)', 2.5);
  }
  ctx.globalAlpha = 1;
}

function drawCutin(ctx, g) {
  const c = g.cutin;
  if (!c) return;
  const f = c.frame;
  const a = f < 15 ? f / 15 : f > 70 ? Math.max(0, (90 - f) / 20) : 1;
  const x = lerp(FIELD_W + 60, 120, Ease.outCubic(Math.min(1, f / 30))) - Math.max(0, f - 30) * 0.6;
  ctx.save();
  ctx.globalAlpha = a * 0.3;
  ctx.fillStyle = `rgba(${CHARA_CUTIN_COLOR[c.id] || '200,200,255'},1)`;
  ctx.beginPath();
  ctx.moveTo(0, 120); ctx.lineTo(FIELD_W, 40); ctx.lineTo(FIELD_W, 300); ctx.lineTo(0, 380); ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = a * 0.85;
  drawPortrait(ctx, c.id, x + 100, 250, 4.2, 'smug', f);
  ctx.restore();
}
const CHARA_CUTIN_COLOR = { rumia: '120,20,60', cirno: '60,140,255', star: '90,90,230', daiyousei: '60,200,110' };

function drawStageTitle(ctx, g) {
  const st = g.stageTitle;
  if (!st || st.frame > 300) return;
  const f = st.frame;
  const a = f < 40 ? f / 40 : f > 240 ? (300 - f) / 60 : 1;
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `italic 700 30px ${FONT_EN}`;
  strokeText(ctx, `Stage ${g.stageIndex + 1}`, FIELD_W / 2, 150, '#ffffff', 'rgba(40,20,90,0.9)', 4);
  ctx.font = `700 22px ${FONT_JP}`;
  strokeText(ctx, g.stage.name, FIELD_W / 2, 188, '#ffe8b0', 'rgba(40,20,90,0.9)', 4);
  ctx.font = `italic 600 15px ${FONT_EN}`;
  strokeText(ctx, g.stage.nameEn, FIELD_W / 2, 214, '#d8d0ff', 'rgba(0,0,0,0.8)', 3);
  ctx.globalAlpha = 1;
}

function drawBossTitle(ctx, g) {
  const bt = g.bossTitle;
  if (!bt || bt.frame > 200) return;
  const f = bt.frame;
  const a = f < 20 ? f / 20 : f > 160 ? (200 - f) / 40 : 1;
  const info = CHARA_INFO[bt.id];
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = `600 13px ${FONT_JP}`;
  strokeText(ctx, info.title, FIELD_W - 18, 232, '#e0d8ff', 'rgba(0,0,0,0.9)', 3);
  ctx.font = `800 26px ${FONT_JP}`;
  strokeText(ctx, info.name, FIELD_W - 18, 260, info.color, 'rgba(0,0,0,0.9)', 4);
  ctx.globalAlpha = 1;
}

function drawMessages(ctx, g) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  g.messages.forEach((m, i) => {
    const a = m.frame < 10 ? m.frame / 10 : m.frame > m.life - 20 ? (m.life - m.frame) / 20 : 1;
    ctx.globalAlpha = Math.max(0, a);
    const y = 120 + i * 44;
    ctx.font = `italic 700 20px ${FONT_EN}`;
    strokeText(ctx, m.text, FIELD_W / 2, y, m.color, 'rgba(0,0,0,0.85)', 4);
    if (m.sub) {
      ctx.font = `700 16px ${FONT_EN}`;
      strokeText(ctx, m.sub, FIELD_W / 2, y + 20, '#ffffff', 'rgba(0,0,0,0.85)', 3);
    }
  });
  ctx.globalAlpha = 1;

  if (g.bgmTitle && g.bgmTitle.frame < 300) {
    const f = g.bgmTitle.frame;
    ctx.globalAlpha = f < 20 ? f / 20 : f > 240 ? (300 - f) / 60 : 1;
    ctx.font = `600 12px ${FONT_JP}`;
    ctx.textAlign = 'right';
    strokeText(ctx, '♪ ' + g.bgmTitle.text, FIELD_W - 8, g.dialogue ? 338 : FIELD_H - 20, '#e8e0ff', 'rgba(0,0,0,0.9)', 3);
    ctx.globalAlpha = 1;
  }
  if (g.bombName && g.bombName.frame < 150) {
    const f = g.bombName.frame;
    ctx.globalAlpha = f > 110 ? (150 - f) / 40 : Math.min(1, f / 10);
    ctx.font = `bold 14px ${FONT_JP}`;
    ctx.textAlign = 'left';
    const y = lerp(FIELD_H - 30, FIELD_H - 60, Ease.outCubic(Math.min(1, f / 20)));
    strokeText(ctx, g.bombName.text, 10, y, '#ffffff', 'rgba(120,20,80,0.9)', 3);
    ctx.globalAlpha = 1;
  }
  if (g.clearInfo) {
    const f = g.clearInfo.frame;
    ctx.globalAlpha = Math.min(1, f / 20);
    ctx.fillStyle = 'rgba(0,0,20,0.55)';
    ctx.fillRect(40, 150, FIELD_W - 80, 110);
    ctx.textAlign = 'center';
    ctx.font = `italic 700 28px ${FONT_EN}`;
    strokeText(ctx, 'Stage Clear!!', FIELD_W / 2, 182, '#ffe080', 'rgba(0,0,0,0.9)', 4);
    ctx.font = `600 14px ${FONT_JP}`;
    strokeText(ctx, 'クリアボーナス', FIELD_W / 2, 214, '#e0d8ff', 'rgba(0,0,0,0.9)', 3);
    ctx.font = `700 20px ${FONT_EN}`;
    ctx.fillStyle = '#fff';
    drawDigits(ctx, padScore(g.clearInfo.bonus), FIELD_W / 2, 238, 12, 'center');
    ctx.globalAlpha = 1;
  }
}

// 簡易メニュー（ポーズ・コンティニュー）
function drawFieldMenu(ctx, title, items, sel, sub) {
  ctx.fillStyle = 'rgba(0,0,10,0.78)';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 24px ${FONT_JP}`;
  strokeText(ctx, title, FIELD_W / 2, 150, '#ffffff', 'rgba(60,20,120,0.9)', 4);
  if (sub) {
    ctx.font = `14px ${FONT_JP}`;
    ctx.fillStyle = '#d0c8f0';
    ctx.fillText(sub, FIELD_W / 2, 180);
  }
  items.forEach((it, i) => {
    const on = i === sel;
    ctx.font = `${on ? 700 : 500} 18px ${FONT_JP}`;
    strokeText(ctx, it, FIELD_W / 2 + (on ? 0 : 0), 226 + i * 36, on ? '#ffe8a0' : '#9890b8', 'rgba(0,0,0,0.9)', 3);
    if (on) {
      ctx.fillStyle = '#ffe8a0';
      const w = ctx.measureText(it).width;
      ctx.save(); ctx.translate(FIELD_W / 2 - w / 2 - 16, 226 + i * 36); starPath(ctx, 5, 2); ctx.fill(); ctx.restore();
    }
  });
}
// メニュー項目のタップ判定（フィールド座標で配置した項目を画面座標で判定）
function fieldMenuTap(count) {
  for (let i = 0; i < count; i++) {
    if (Input.tapIn(FIELD_X + 60, FIELD_Y + 226 + i * 36 - 16, FIELD_W - 120, 32)) return i;
  }
  return -1;
}

</script>
<script>
'use strict';
// ============================================================
//  ゲーム本編シーン
// ============================================================

const STAGES = [];
const EXTEND_POINTS = [50, 125, 250, 400, 600];
const Settings = { lives: Store.get('lives', 2) };

// スペルカード取得履歴
const SpellHistory = {
  data: Store.get('spells', {}),
  key(name) { return `${DIFF}:${G.charId}:${name}`; },
  get(name) { return this.data[this.key(name)] || { got: 0, tried: 0 }; },
  bump(name, field) {
    const k = this.key(name);
    const d = this.data[k] || { got: 0, tried: 0 };
    d[field]++;
    this.data[k] = d;
    Store.set('spells', this.data);
  },
};

let G = null;

class GameScene {
  constructor(opts) {
    G = this;
    DIFF = opts.difficulty;
    rng.seed(opts.seed ?? Date.now());
    this.opts = opts;
    this.charId = opts.character;
    this.practice = !!opts.practice;
    this.score = 0;
    this.hiKey = `hi_${DIFF}_${this.charId}`;
    this.hiScore = Math.max(Store.get(this.hiKey, 0), 1000000);
    this.initialLives = Settings.lives;
    this.lives = this.initialLives;
    this.bombs = 3;
    const startStage = opts.stage || 0;
    this.power = this.practice ? [100, 250, 400][startStage] : 100;
    this.graze = 0;
    this.pointItems = 0;
    this.extendIdx = 0;
    this.continues = 0;
    this.misses = 0;
    this.bombsUsed = 0;
    this.spellsGot = 0;
    this.spellsSeen = 0;
    this.player = new Player(this.charId);
    this.pendingStage = null;
    this.paused = false;
    this.pauseSel = 0;
    this.continueMenu = null;
    this.frame = 0;
    this.messages = [];
    this.cheat = false;
    // 描画が update より先に呼ばれても大丈夫なように、ここでステージを組み立てる
    this.startStage(startStage);
  }

  enter() { Input.setTouchButtons(TOUCH_BUTTONS); }
  exit() { Input.setTouchButtons([]); }

  resetStageState() {
    this.bullets = new BulletManager();
    this.lasers = [];
    this.enemies = [];
    this.shots = [];
    this.items = [];
    Fx.reset();
    this.boss = null;
    this.bossPhases = null;
    this.bossPhaseIdx = 0;
    this.dialogue = null;
    this.cutin = null;
    this.spell = null;
    this.spellFailed = false;
    this.spellBonus = 0;
    this.spellBgKind = null;
    this.spellBgAlpha = 0;
    this.lastSpellBg = null;
    this.stageTitle = null;
    this.bossTitle = null;
    this.bgmTitle = null;
    this.bombName = null;
    this.clearInfo = null;
    this.shake = 0;
    this.flash = null;
    this.tasks = new TaskRunner();
  }

  startStage(i) {
    this.stageIndex = i;
    this.stage = STAGES[i];
    this.resetStageState();
    this.bg = new this.stage.bg();
    this.stageFrame = 0;
    this.player.x = FIELD_W / 2;
    this.player.y = FIELD_H - 48;
    this.player.invuln = Math.max(this.player.invuln, 60);
    this.tasks.add(this.stageFlow());
  }

  *stageFlow() {
    Sound.playBgm(this.stage.bgm);
    this.showBgmTitle(this.stage.bgm);
    this.stageTitle = { frame: 0 };
    yield* this.stage.script(this);
    yield* this.stageClear();
  }

  *stageClear() {
    this.clearLasers();
    this.bullets.cancelAll(true);
    for (const it of this.items) it.auto = true;
    yield 60;
    const bonus = (this.stageIndex + 1) * 1000000 + this.power * 1000 + this.graze * 500;
    this.score += bonus;
    this.clearInfo = { bonus, frame: 0 };
    Sound.se('bonus');
    yield 240;
    this.clearInfo = null;
    if (this.practice) this.finish('practice');
    else if (this.stageIndex >= STAGES.length - 1) this.finish('clear');
    else this.pendingStage = this.stageIndex + 1;
  }

  finish(kind) {
    this.saveHiScore();
    Sound.stopBgm(1.5);
    if (kind === 'clear') Game.setScene(new EndingScene(this));
    else Game.setScene(new ResultScene(this, kind));
  }

  saveHiScore() {
    if (this.practice || this.cheat) return;
    if (this.score > Store.get(this.hiKey, 0)) Store.set(this.hiKey, Math.floor(this.score));
  }

  // ---------------- 更新 ----------------
  update() {
    if (this.pendingStage !== null) {
      const i = this.pendingStage;
      this.pendingStage = null;
      this.startStage(i);
    }
    if (this.continueMenu) { this.updateContinue(); return; }
    if (this.paused) { this.updatePause(); return; }
    if (Input.pressed('pause') || (Input.isTouch && document.hidden)) { this.openPause(); return; }

    this.frame++;
    this.stageFrame++;
    this.tasks.update();
    if (this.dialogue) this.dialogue.update();
    this.player.update(this);
    if (this.continueMenu) return;

    // 自機ショット
    const boss = this.boss;
    for (const s of this.shots) {
      s.update();
      if (!s.alive) continue;
      for (const e of this.enemies) {
        if (!e.alive || e.untouchable || e.y < -6) continue;
        const r = e.r + s.r;
        if (dist2(s.x, s.y, e.x, e.y) < r * r) {
          this.damageEnemy(e, s.dmg);
          s.alive = false;
          if (s.kind === 'missile') Fx.explosion(s.x, s.y, 'rgba(120,255,150,0.6)', 0.6);
          else Fx.hit(s.x, s.y);
          break;
        }
      }
      if (s.alive && boss && boss.alive && !boss.untouchable) {
        const r = boss.r + s.r;
        if (dist2(s.x, s.y, boss.x, boss.y) < r * r) {
          this.damageEnemy(boss, s.dmg);
          s.alive = false;
          if (s.kind === 'missile') Fx.explosion(s.x, s.y, 'rgba(120,255,150,0.6)', 0.6);
          else Fx.hit(s.x, s.y);
        }
      }
    }
    this.shots = this.shots.filter(s => s.alive);

    for (const e of this.enemies) if (e.alive) e.update();
    this.enemies = this.enemies.filter(e => e.alive);
    if (this.boss) this.boss.update();
    this.bullets.update();
    for (const l of this.lasers) l.update();
    this.lasers = this.lasers.filter(l => l.alive);
    this.checkPlayerCollision();
    for (const it of this.items) if (it.alive) it.update(this.player);
    this.items = this.items.filter(it => it.alive);
    Fx.update();
    this.bg.update();

    // 演出タイマー
    const target = this.spellBgKind ? 1 : 0;
    this.spellBgAlpha = clamp(this.spellBgAlpha + (target ? 0.03 : -0.03), 0, 1);
    if (this.spellBgKind) this.lastSpellBg = this.spellBgKind;
    for (const m of this.messages) m.frame++;
    this.messages = this.messages.filter(m => m.frame < m.life);
    if (this.stageTitle) this.stageTitle.frame++;
    if (this.bossTitle) this.bossTitle.frame++;
    if (this.bgmTitle) this.bgmTitle.frame++;
    if (this.bombName) this.bombName.frame++;
    if (this.clearInfo) this.clearInfo.frame++;
    if (this.spell) this.spell.frame++;
    if (this.cutin && ++this.cutin.frame > 90) this.cutin = null;
    if (this.shake > 0) this.shake--;
    if (this.flash && (this.flash.a -= 0.03) <= 0) this.flash = null;
    if (this.score > this.hiScore) this.hiScore = this.score;
  }

  canShoot() { return !this.dialogue; }

  checkPlayerCollision() {
    const p = this.player;
    if (p.state !== 'normal') return;
    const canHit = p.invuln === 0 && !this.cheat;
    const canGraze = p.invuln === 0;
    const hr = p.hitR;
    for (const b of this.bullets.list) {
      if (!b.alive || b.delay > 0) continue;
      const dx = b.x - p.x, dy = b.y - p.y;
      const d2 = dx * dx + dy * dy;
      const gr = p.grazeR + b.hitR;
      if (d2 > gr * gr) continue;
      const r = hr + b.hitR;
      if (d2 < r * r) {
        if (canHit) { p.hit(this); return; }
      } else if (!b.grazed && canGraze) {
        b.grazed = true;
        this.addGraze(b.x, b.y);
      }
    }
    for (const l of this.lasers) {
      if (l.hits(p.x, p.y, hr)) {
        if (canHit) { p.hit(this); return; }
      } else if (canGraze && l.on && l.grazeCd === 0 && l.distTo(p.x, p.y) < l.width * 0.5 + 16) {
        l.grazeCd = 5;
        this.addGraze(p.x, p.y);
      }
    }
    if (!canHit) return;
    for (const e of this.enemies) {
      if (!e.alive || e.noBody) continue;
      const r = e.r * 0.6 + hr;
      if (dist2(e.x, e.y, p.x, p.y) < r * r) { p.hit(this); return; }
    }
    const b = this.boss;
    if (b && b.alive && this.bossPhases && dist2(b.x, b.y, p.x, p.y) < (14 + hr) * (14 + hr)) p.hit(this);
  }

  addGraze(x, y) {
    this.graze++;
    this.score += 500;
    Sound.se('graze');
    Fx.graze(x, y);
  }

  damageEnemy(e, dmg, isBomb = false, sound = true) {
    if (!e.alive || e.untouchable || e.invincible > 0) return;
    if (e.isBoss) {
      if (isBomb && this.spell) dmg *= 0.3;
      e.hp -= dmg;
      e.flash = 2;
      this.score += 10;
      if (sound) Sound.se('hit');
      return;
    }
    e.hp -= dmg;
    e.flash = 2;
    this.score += 10;
    if (sound) Sound.se('hit');
    if (e.hp <= 0) this.killEnemy(e);
  }

  killEnemy(e) {
    e.alive = false;
    e.tasks.clear();
    this.score += e.score;
    dropItems(e.x, e.y, e.drops);
    const col = { blue: 'rgba(120,160,255,0.8)', red: 'rgba(255,120,120,0.8)', green: 'rgba(120,255,150,0.8)', yellow: 'rgba(255,230,120,0.8)', purple: 'rgba(210,140,255,0.8)' }[e.color] || 'rgba(255,255,255,0.8)';
    Fx.explosion(e.x, e.y, col, e.r >= 18 ? 1.8 : 1);
    Sound.se('kill');
    if (e.onDeath) e.onDeath(e);
  }

  areaDamage(x, y, r, dmg, isBomb) {
    for (const e of this.enemies) {
      if (e.alive && dist2(e.x, e.y, x, y) < (r + e.r) * (r + e.r)) this.damageEnemy(e, dmg, isBomb);
    }
    const b = this.boss;
    if (b && b.alive && dist2(b.x, b.y, x, y) < (r + b.r) * (r + b.r)) this.damageEnemy(b, dmg, isBomb);
  }

  nearestTarget(x, y) {
    let best = null, bd = Infinity;
    for (const e of this.enemies) {
      if (!e.alive || e.untouchable || e.y < 0 || e.y > FIELD_H || e.x < 0 || e.x > FIELD_W) continue;
      const d = dist2(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    const b = this.boss;
    if (b && b.alive && !b.untouchable) {
      const d = dist2(x, y, b.x, b.y);
      if (d < bd) best = b;
    }
    return best;
  }

  clearLasers() { this.lasers = []; }

  collectItem(it) {
    switch (it.type) {
      case 'power': this.addPower(5); break;
      case 'bigpower': this.addPower(100); break;
      case 'full': this.addPower(400); break;
      case 'point': {
        const maxV = Math.min(10000 + this.graze * 20, 100000);
        const v = it.auto ? maxV : Math.floor(maxV * clamp(1 - ((it.y - POC_LINE) / (FIELD_H - POC_LINE)) * 0.6, 0.3, 1) / 10) * 10;
        this.score += v;
        this.pointItems++;
        Fx.text(it.x, it.y - 10, String(v), v >= maxV ? '#ffe070' : '#ffffff', 10, 40);
        const need = EXTEND_POINTS[this.extendIdx];
        if (need && this.pointItems >= need) { this.extendIdx++; this.extend(); }
        break;
      }
      case 'bomb':
        this.bombs = Math.min(this.bombs + 1, 8);
        this.msg('Spell Card Get!', '#80ffa0');
        break;
      case 'life': this.extend(); break;
      case 'star': this.score += 1500; break;
    }
    Sound.se('item');
  }

  addPower(n) {
    if (this.power >= 400) { this.score += 5000; return; }
    const before = Math.floor(this.power / 100);
    this.power = Math.min(400, this.power + n);
    if (Math.floor(this.power / 100) > before) {
      Sound.se('powerup');
      if (this.power >= 400) {
        this.msg('Full Power Mode!!', '#ffd060');
        this.bullets.cancelAll(true);
      } else Fx.text(this.player.x, this.player.y - 30, 'Power Up', '#ffb0b0', 12, 50);
    }
  }

  extend() {
    this.lives = Math.min(this.lives + 1, 8);
    this.msg('Extend!!', '#ff9ad8');
    Sound.se('extend');
  }

  msg(text, color = '#ffffff', sub = null, life = 150) {
    this.messages.push({ text, color, sub, frame: 0, life });
    if (this.messages.length > 3) this.messages.shift();
  }
  showBgmTitle(id) { if (SONGS[id]) this.bgmTitle = { text: SONGS[id].title, frame: 0 }; }
  showBombName(text) { this.bombName = { text, frame: 0 }; }

  onPlayerDeath(x, y) {
    this.misses++;
    this.lives--;
    this.spellFailed = true;
    this.bombs = 3;
    const lost = Math.min(this.power, 50);
    this.power -= lost;
    this.bullets.cancelAll(false);
    this.clearLasers();
    this.shake = 16;
    for (let i = 0; i < 7; i++) {
      const it = spawnItem(i === 3 && this.lives < 0 ? 'full' : 'power', x + frand(-16, 16), Math.min(y, FIELD_H - 60));
      it.vy = -frand(4, 6);
      it.vx = frand(-2.2, 2.2);
    }
  }

  onOutOfLives() {
    this.continueMenu = { sel: 0, frame: 0 };
    Sound.se('pause');
  }

  updateContinue() {
    const m = this.continueMenu;
    m.frame++;
    if (Input.repeat('up') || Input.repeat('down')) { m.sel = 1 - m.sel; Sound.se('cursor'); }
    const tap = fieldMenuTap(2);
    if (tap >= 0) m.sel = tap;
    if ((Input.pressed('shot') || tap >= 0) && m.frame > 20) {
      Sound.se('ok');
      if (m.sel === 0) {
        this.continues++;
        this.score = this.continues;
        this.lives = this.initialLives;
        this.bombs = 3;
        this.continueMenu = null;
        const p = this.player;
        p.state = 'respawn';
        p.timer = 40;
        p.x = FIELD_W / 2;
        p.y = FIELD_H + 30;
        p.invuln = 220;
      } else {
        this.finish('gameover');
      }
    }
  }

  openPause() {
    this.paused = true;
    this.pauseSel = 0;
    this.pauseFrame = 0;
    Sound.se('pause');
    if (Sound.ctx && Sound.bgmBus) Sound.bgmBus.gain.value = Sound.muted ? 0 : Sound.bgmVolume * 0.3;
  }
  closePause() {
    this.paused = false;
    Sound.applyVolume();
  }
  updatePause() {
    this.pauseFrame++;
    const n = 3;
    if (Input.repeat('up')) { this.pauseSel = (this.pauseSel + n - 1) % n; Sound.se('cursor'); }
    if (Input.repeat('down')) { this.pauseSel = (this.pauseSel + 1) % n; Sound.se('cursor'); }
    const tap = fieldMenuTap(n);
    if (tap >= 0) this.pauseSel = tap;
    if (Input.pressed('pause') || Input.pressed('bomb')) { this.closePause(); return; }
    if ((Input.pressed('shot') || tap >= 0) && this.pauseFrame > 5) {
      Sound.se('ok');
      if (this.pauseSel === 0) this.closePause();
      else if (this.pauseSel === 1) {
        Sound.applyVolume();
        Game.setScene(new GameScene({ ...this.opts, seed: undefined }));
      } else {
        this.saveHiScore();
        Sound.applyVolume();
        Game.setScene(new TitleScene());
      }
    }
  }

  // ---------------- ボス戦 ----------------
  spawnBoss(id, def) {
    const b = new Boss(id, def);
    this.boss = b;
    return b;
  }

  *talk(lines) {
    this.bullets.cancelAll(true);
    this.dialogue = new Dialogue(lines, this);
    while (!this.dialogue.done) yield;
    this.dialogue = null;
  }

  *fight(boss, phases) {
    this.bossPhases = phases.filter(ph => DIFF >= (ph.minDiff || 0));
    for (let i = 0; i < this.bossPhases.length; i++) {
      this.bossPhaseIdx = i;
      yield* this.runPhase(boss, this.bossPhases[i], i, this.bossPhases.length);
    }
    this.bossPhases = null;
    boss.phase = null;
  }

  *runPhase(boss, ph, index, total) {
    const spell = ph.type === 'spell';
    boss.hp = boss.maxHp = Math.round((ph.hp ?? 1000) * dv(0.8, 1, 1.05, 1.1));
    boss.phase = ph;
    boss.timer = Math.round((ph.time ?? 30) * 60);
    const totalTime = boss.timer;
    boss.untouchable = !!ph.survival;
    boss.invincible = spell ? 60 : 30;
    this.spellFailed = false;
    const base = ph.bonus ?? (this.stageIndex + 1) * 1000000 + index * 200000;
    if (spell) {
      this.spellsSeen++;
      this.spellBonus = base;
      this.spell = { name: ph.name, frame: 0, history: SpellHistory.get(ph.name) };
      SpellHistory.bump(ph.name, 'tried');
      Sound.se('spell');
      this.cutin = { id: boss.id, frame: 0 };
      this.spellBgKind = boss.def.spellBg || null;
    } else {
      this.spell = null;
      this.spellBgKind = null;
    }
    boss.tasks.clear();
    boss.tasks.add(ph.script(boss, this));
    let result = 'timeout';
    for (;;) {
      yield;
      boss.timer--;
      if (spell && !this.spellFailed) {
        this.spellBonus = Math.floor((base * (0.5 + 0.5 * boss.timer / totalTime)) / 10) * 10;
      }
      if (boss.timer > 0 && boss.timer <= 600 && boss.timer % 60 === 0) Sound.se(boss.timer <= 180 ? 'timeoutLow' : 'timeout');
      if (!ph.survival && boss.hp <= 0) { result = 'defeated'; break; }
      if (boss.timer <= 0) break;
    }
    boss.tasks.clear();
    boss.moveTask = null;
    boss.untouchable = true;
    this.clearLasers();
    this.bullets.cancelAll(true);
    const last = index === total - 1;
    if (result === 'defeated') {
      this.score += 100000;
      Sound.se('kill');
      Fx.explosion(boss.x, boss.y, 'rgba(255,220,255,0.8)', 2.5);
      if (!last) dropItems(boss.x, boss.y, spell ? { power: 6, point: 8 } : { power: 4, point: 4 });
    } else {
      Sound.se('clear');
    }
    if (spell) {
      const captured = !this.spellFailed && (result === 'defeated' || ph.survival);
      if (captured) {
        this.score += this.spellBonus;
        this.spellsGot++;
        SpellHistory.bump(ph.name, 'got');
        this.msg('Get Spell Card Bonus!!', '#ffe070', padScore(this.spellBonus, 8));
        Sound.se('bonus');
      } else {
        this.msg('Bonus Failed', '#a0a8c0');
      }
    }
    this.spell = null;
    this.spellBgKind = null;
    if (!last) {
      yield* boss.moveTo(clamp(boss.x, 96, FIELD_W - 96), 100, 40);
      yield 20;
    }
  }

  // ボス撃破（逃げるだけの中ボスは flee=true）
  *bossDown(boss, flee = false) {
    if (flee) {
      yield* boss.moveTo(boss.x + (boss.x < FIELD_W / 2 ? -1 : 1) * 60, -80, 40, Ease.inQuad);
      boss.alive = false;
      this.boss = null;
      return;
    }
    Sound.se('bossdie');
    Fx.bossExplosion(boss.x, boss.y);
    this.shake = 40;
    this.flash = { color: '255,255,255', a: 0.9 };
    dropItems(boss.x, boss.y, boss.def.finalDrops || { power: 10, point: 14, bigpower: 1 });
    this.score += 1000000;
    boss.alive = false;
    this.boss = null;
    yield 80;
    for (const it of this.items) it.auto = true;
    yield 60;
  }

  // ---------------- 描画 ----------------
  draw(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.save();
    ctx.beginPath();
    ctx.rect(FIELD_X, FIELD_Y, FIELD_W, FIELD_H);
    ctx.clip();
    const sh = this.shake > 0 ? Math.min(this.shake, 8) * 0.5 : 0;
    ctx.translate(FIELD_X + (sh ? frand(-sh, sh) : 0), FIELD_Y + (sh ? frand(-sh, sh) : 0));
    this.bg.draw(ctx);
    if (this.spellBgAlpha > 0 && this.lastSpellBg) {
      ctx.globalAlpha = this.spellBgAlpha;
      drawSpellBG(ctx, this.lastSpellBg, this.frame);
      ctx.globalAlpha = 1;
    }
    if (this.boss) this.boss.draw(ctx);
    for (const e of this.enemies) e.draw(ctx);
    for (const it of this.items) it.draw(ctx);
    for (const s of this.shots) s.draw(ctx);
    if (this.player.bomb) this.player.bomb.draw(ctx);
    this.player.draw(ctx);
    for (const l of this.lasers) l.draw(ctx);
    this.bullets.draw(ctx);
    this.player.drawHitbox(ctx);
    Fx.draw(ctx);
    drawCutin(ctx, this);
    drawBossHud(ctx, this);
    drawSpellName(ctx, this);
    if (this.dialogue) this.dialogue.draw(ctx);
    drawStageTitle(ctx, this);
    drawBossTitle(ctx, this);
    drawMessages(ctx, this);
    if (this.flash) {
      ctx.fillStyle = `rgba(${this.flash.color},${Math.max(0, this.flash.a)})`;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    }
    if (this.paused) drawFieldMenu(ctx, '一時停止', ['ゲームを再開', '最初からやり直す', 'タイトルに戻る'], this.pauseSel, 'Esc / X で再開');
    if (this.continueMenu) drawFieldMenu(ctx, '満身創痍', ['コンティニューする', 'あきらめる'], this.continueMenu.sel, `コンティニュー回数 ${this.continues}`);
    ctx.restore();
    drawSidePanel(ctx, this);
  }
}

<script>
'use strict';
// ============================================================
//  共通の道中パターン
// ============================================================

// 空から星が降ってくる（異変そのもの）
function* starShower(frames, count, colors = ['yellow', 'cyan', 'pink', 'white'], big = false) {
  const interval = Math.max(1, Math.floor(frames / count));
  for (let i = 0; i < count; i++) {
    fire({
      x: rand(8, FIELD_W - 8), y: -12, speed: 0, ax: rand(-0.004, 0.004), ay: 0.025,
      evx: rand(-0.4, 0.4), maxFall: rand(1.2, 1.6) + DIFF * 0.35,
      type: big && rng.next() < 0.3 ? 'bigstar' : 'star', color: pick(colors), silent: true, delay: 4,
    });
    yield interval;
  }
}

// 横から弧を描いて横切る妖精の列
function* sideSweep(side, n, o = {}) {
  for (let i = 0; i < n; i++) {
    spawnEnemy({
      x: side < 0 ? -12 : FIELD_W + 12, y: (o.y ?? 40) + i * 5, hp: o.hp ?? 8, kind: 'foot', color: o.color || 'purple',
      drops: i % 2 ? { point: 1 } : { power: 1 },
      score: 800,
      script: function* (e) {
        e.setMove(o.speed ?? 2.6, side < 0 ? (o.angle ?? 22) * DEG : (180 - (o.angle ?? 22)) * DEG, 0, side < 0 ? 0.0045 : -0.0045);
        yield 28 + i * 2;
        if (DIFF > 0 || i % 2 === 0) {
          fireFan({ x: e.x, y: e.y, n: dv(1, 1, 3, 5), spread: 0.32, angle: e.aim(), speed: dv(2.2, 2.8, 3.2, 3.6), type: o.type || 'small', color: o.bcolor || 'blue' });
        }

  }
}

// 上から降りてきて止まり、リング弾を撃って帰る妖精
function ringFairy(x, o = {}) {
  return spawnEnemy({
    x, y: -16, hp: o.hp ?? 30, color: o.color || 'red', drops: o.drops || { power: 2, point: 1 }, score: 2000,

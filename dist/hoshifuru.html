  } else value(`${(g.power / 100).toFixed(2)}/4.00`, 214, '#ffb0b0');
  label('グレイズ', 238); value(String(g.graze), 238);
  label('点', 262);
  const next = EXTEND_POINTS[g.extendIdx];
  value(next ? `${g.pointItems}/${next}` : String(g.pointItems), 262, '#b0c8ff');

  if (Input.isTouch) {
    drawLogo(ctx, 528, 318, 22);
    for (const b of TOUCH_BUTTONS) {
      const on = b.toggle ? Input.virtual[b.action] : Input.held[b.action];
      ctx.fillStyle = on ? 'rgba(255,220,150,0.35)' : 'rgba(255,255,255,0.08)';
      ctx.strokeStyle = 'rgba(214,186,120,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(b.x, b.y, b.w, b.h, 8) : ctx.rect(b.x, b.y, b.w, b.h);
      ctx.fill(); ctx.stroke();
      ctx.font = `700 ${b.id === 'pause' ? 14 : 18}px ${FONT_JP}`;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
    }
  } else {
    drawLogo(ctx, 528, 404, 30);
  }

  ctx.font = `12px ${FONT_EN}`;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(220,210,255,0.6)';
  ctx.fillText(`${Game.fps.toFixed(1)}fps`, 634, 470);
  if (Sound.muted) {
    ctx.textAlign = 'left';
    ctx.fillText('♪ミュート中 (M)', 434, 470);

}

// ------------------------------------------------------------
//  フィールド内
// ------------------------------------------------------------
function drawBossHud(ctx, g) {
  const b = g.boss;
  if (!b || !b.alive || !g.bossPhases) return;
  const ph = b.phase;
  ctx.textBaseline = 'middle';
  ctx.font = `bold 13px ${FONT_JP}`;
  ctx.textAlign = 'left';
  strokeText(ctx, b.name, 6, 10, '#ffffff', 'rgba(0,0,0,0.9)', 3);
  // 残りの攻撃数
  const remain = g.bossPhases.length - g.bossPhaseIdx - 1;
  const nameW = ctx.measureText(b.name).width;
  for (let i = 0; i < remain; i++) {
    ctx.fillStyle = '#ffd070';
    ctx.save(); ctx.translate(14 + nameW + i * 11, 10); starPath(ctx, 4.5, 2); ctx.fill(); ctx.restore();
  }
  // 体力
  if (ph && !ph.survival) {
    const w = FIELD_W - 60;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(6, 20, w, 4);
    const k = clamp(b.hp / b.maxHp, 0, 1);
    const grad = ctx.createLinearGradient(6, 0, 6 + w, 0);
    grad.addColorStop(0, '#ff8a8a');
    grad.addColorStop(1, '#ffffff');
    ctx.fillStyle = grad;
    ctx.fillRect(6, 20, w * k, 4);
  }
  // 残り時間
  if (ph) {
    const sec = Math.max(0, Math.ceil(b.timer / 60));
    ctx.font = `700 22px ${FONT_EN}`;
    ctx.textAlign = 'right';
    strokeText(ctx, String(sec).padStart(2, '0'), FIELD_W - 6, 18, sec <= 5 ? '#ff7070' : sec <= 10 ? '#ffd0a0' : '#ffffff', 'rgba(0,0,0,0.9)', 3);

function drawSpellName(ctx, g) {
  const sp = g.spell;
  if (!sp) return;
  const f = sp.frame;
  // 中央下から右上へ移動
  const t = clamp((f - 50) / 40, 0, 1);
  const y = lerp(300, 40, Ease.inOutSine(t));
  ctx.font = `bold 14px ${FONT_JP}`;
  const w = ctx.measureText(sp.name).width;
  const x = FIELD_W - 8;
  // ボスや自機が重なっている時は薄くする
  const b = g.boss, p = g.player;
  const covered = t >= 1 && ((b && b.y < 118 && b.x > x - w - 70) || (p.y < 90 && p.x > x - w - 50));
  ctx.globalAlpha = Math.min(1, f / 15) * (covered ? 0.4 : 1);
  const grad = ctx.createLinearGradient(x - w - 40, 0, x, 0);
  grad.addColorStop(0, 'rgba(40,20,80,0)');
  grad.addColorStop(0.3, 'rgba(40,20,80,0.75)');
  grad.addColorStop(1, 'rgba(90,40,140,0.85)');
  ctx.fillStyle = grad;
  ctx.fillRect(x - w - 40, y - 11, w + 46, 22);
  ctx.fillStyle = 'rgba(255,230,160,0.8)';
  ctx.fillRect(x - w - 20, y + 10, w + 26, 1);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  strokeText(ctx, sp.name, x, y, '#ffffff', 'rgba(60,0,60,0.9)', 3);
  if (t >= 1) {
    ctx.font = `600 11px ${FONT_EN}`;
    const bonus = g.spellFailed ? 'Failed' : padScore(g.spellBonus, 8);
    const hist = `History ${sp.history.got}/${sp.history.tried}`;

  ctx.globalAlpha = 1;
}

function drawCutin(ctx, g) {
  const c = g.cutin;
  if (!c) return;
  const f = c.frame;
  const a = f < 15 ? f / 15 : f > 70 ? Math.max(0, (90 - f) / 20) : 1;
  const x = lerp(FIELD_W + 60, 120, Ease.outCubic(Math.min(1, f / 30))) - Math.max(0, f - 30) * 0.6;
  ctx.save();
  ctx.globalAlpha = a * 0.3;
  ctx.fillStyle = `rgba(${CHARA_CUTIN_COLOR[c.id] || '200,200,255'},1)`;
  ctx.beginPath();
  ctx.moveTo(0, 120); ctx.lineTo(FIELD_W, 40); ctx.lineTo(FIELD_W, 300); ctx.lineTo(0, 380); ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = a * 0.85;
  drawPortrait(ctx, c.id, x + 100, 250, 4.2, 'smug', f);
  ctx.restore();
}
const CHARA_CUTIN_COLOR = { rumia: '120,20,60', cirno: '60,140,255', star: '90,90,230', daiyousei: '60,200,110' };

function drawStageTitle(ctx, g) {
  const st = g.stageTitle;
  if (!st || st.frame > 300) return;
  const f = st.frame;
  const a = f < 40 ? f / 40 : f > 240 ? (300 - f) / 60 : 1;

  ctx.font = `italic 700 30px ${FONT_EN}`;

function drawBossTitle(ctx, g) {
  const bt = g.bossTitle;
  if (!bt || bt.frame > 200) return;
  const f = bt.frame;
  const a = f < 20 ? f / 20 : f > 160 ? (200 - f) / 40 : 1;
  const info = CHARA_INFO[bt.id];
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = `600 13px ${FONT_JP}`;
  strokeText(ctx, info.title, FIELD_W - 18, 232, '#e0d8ff', 'rgba(0,0,0,0.9)', 3);
  ctx.font = `800 26px ${FONT_JP}`;
  strokeText(ctx, info.name, FIELD_W - 18, 260, info.color, 'rgba(0,0,0,0.9)', 4);
  ctx.globalAlpha = 1;
}

function drawMessages(ctx, g) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  g.messages.forEach((m, i) => {
    const a = m.frame < 10 ? m.frame / 10 : m.frame > m.life - 20 ? (m.life - m.frame) / 20 : 1;
    ctx.globalAlpha = Math.max(0, a);
    const y = 120 + i * 44;
    ctx.font = `italic 700 20px ${FONT_EN}`;
    strokeText(ctx, m.text, FIELD_W / 2, y, m.color, 'rgba(0,0,0,0.85)', 4);
    if (m.sub) {
      ctx.font = `700 16px ${FONT_EN}`;
      strokeText(ctx, m.sub, FIELD_W / 2, y + 20, '#ffffff', 'rgba(0,0,0,0.85)', 3);
    }
  });
  ctx.globalAlpha = 1;

  if (g.bgmTitle && g.bgmTitle.frame < 300) {
    const f = g.bgmTitle.frame;
    ctx.globalAlpha = f < 20 ? f / 20 : f > 240 ? (300 - f) / 60 : 1;
    ctx.font = `600 12px ${FONT_JP}`;
    ctx.textAlign = 'right';
    strokeText(ctx, '♪ ' + g.bgmTitle.text, FIELD_W - 8, g.dialogue ? 338 : FIELD_H - 20, '#e8e0ff', 'rgba(0,0,0,0.9)', 3);
    ctx.globalAlpha = 1;
  }
  if (g.bombName && g.bombName.frame < 150) {
    const f = g.bombName.frame;
    ctx.globalAlpha = f > 110 ? (150 - f) / 40 : Math.min(1, f / 10);
    ctx.font = `bold 14px ${FONT_JP}`;
    ctx.textAlign = 'left';
    const y = lerp(FIELD_H - 30, FIELD_H - 60, Ease.outCubic(Math.min(1, f / 20)));
    strokeText(ctx, g.bombName.text, 10, y, '#ffffff', 'rgba(120,20,80,0.9)', 3);
    ctx.globalAlpha = 1;
  }
  if (g.clearInfo) {
    const f = g.clearInfo.frame;
    ctx.globalAlpha = Math.min(1, f / 20);
    ctx.fillStyle = 'rgba(0,0,20,0.55)';
    ctx.fillRect(40, 150, FIELD_W - 80, 110);
    ctx.textAlign = 'center';
    ctx.font = `italic 700 28px ${FONT_EN}`;
    strokeText(ctx, 'Stage Clear!!', FIELD_W / 2, 182, '#ffe080', 'rgba(0,0,0,0.9)', 4);
    ctx.font = `600 14px ${FONT_JP}`;
    strokeText(ctx, 'クリアボーナス', FIELD_W / 2, 214, '#e0d8ff', 'rgba(0,0,0,0.9)', 3);
    ctx.font = `700 20px ${FONT_EN}`;
    ctx.fillStyle = '#fff';
    drawDigits(ctx, padScore(g.clearInfo.bonus), FIELD_W / 2, 238, 12, 'center');
    ctx.globalAlpha = 1;
  }
}

// 簡易メニュー（ポーズ・コンティニュー）
function drawFieldMenu(ctx, title, items, sel, sub) {
  ctx.fillStyle = 'rgba(0,0,10,0.78)';
  ctx.fillRect(0, 0, FIELD_W, FIELD_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 24px ${FONT_JP}`;
  strokeText(ctx, title, FIELD_W / 2, 150, '#ffffff', 'rgba(60,20,120,0.9)', 4);
  if (sub) {
    ctx.font = `14px ${FONT_JP}`;
    ctx.fillStyle = '#d0c8f0';
    ctx.fillText(sub, FIELD_W / 2, 180);
  }
  items.forEach((it, i) => {
    const on = i === sel;
    ctx.font = `${on ? 700 : 500} 18px ${FONT_JP}`;
    strokeText(ctx, it, FIELD_W / 2 + (on ? 0 : 0), 226 + i * 36, on ? '#ffe8a0' : '#9890b8', 'rgba(0,0,0,0.9)', 3);
    if (on) {
      ctx.fillStyle = '#ffe8a0';
      const w = ctx.measureText(it).width;
      ctx.save(); ctx.translate(FIELD_W / 2 - w / 2 - 16, 226 + i * 36); starPath(ctx, 5, 2); ctx.fill(); ctx.restore();
    }
  });
}
// メニュー項目のタップ判定（フィールド座標で配置した項目を画面座標で判定）
function fieldMenuTap(count) {
  for (let i = 0; i < count; i++) {
    if (Input.tapIn(FIELD_X + 60, FIELD_Y + 226 + i * 36 - 16, FIELD_W - 120, 32)) return i;
  }
  return -1;
}

<script>
'use strict';
// ============================================================
//  ゲーム本編シーン
// ============================================================

const STAGES = [];
const EXTEND_POINTS = [50, 125, 250, 400, 600];
const Settings = { lives: Store.get('lives', 2) };

// スペルカード取得履歴
const SpellHistory = {
  data: Store.get('spells', {}),
  key(name) { return `${DIFF}:${G.charId}:${name}`; },
  get(name) { return this.data[this.key(name)] || { got: 0, tried: 0 }; },
  bump(name, field) {
    const k = this.key(name);
    const d = this.data[k] || { got: 0, tried: 0 };
    d[field]++;
    this.data[k] = d;
    Store.set('spells', this.data);
  },
};

let G = null;

class GameScene {
  constructor(opts) {
    G = this;
    DIFF = opts.difficulty;
    rng.seed(opts.seed ?? Date.now());
    this.opts = opts;
    this.charId = opts.character;
    this.practice = !!opts.practice;
    this.score = 0;
    this.hiKey = `hi_${DIFF}_${this.charId}`;
    this.hiScore = Math.max(Store.get(this.hiKey, 0), 1000000);
    this.initialLives = Settings.lives;
    this.lives = this.initialLives;
    this.bombs = 3;
    const startStage = opts.stage || 0;
    this.power = this.practice ? [100, 250, 400][startStage] : 100;
    this.graze = 0;
    this.pointItems = 0;
    this.extendIdx = 0;
    this.continues = 0;
    this.misses = 0;
    this.bombsUsed = 0;
    this.spellsGot = 0;
    this.spellsSeen = 0;
    this.player = new Player(this.charId);
    this.pendingStage = null;
    this.paused = false;
    this.pauseSel = 0;
    this.continueMenu = null;
    this.frame = 0;
    this.messages = [];
    this.cheat = false;
    // 描画が update より先に呼ばれても大丈夫なように、ここでステージを組み立てる
    this.startStage(startStage);
  }

  enter() { Input.setTouchButtons(TOUCH_BUTTONS); }
  exit() { Input.setTouchButtons([]); }

  resetStageState() {
    this.bullets = new BulletManager();
    this.lasers = [];
    this.enemies = [];
    this.shots = [];
    this.items = [];
    Fx.reset();
    this.boss = null;
    this.bossPhases = null;
    this.bossPhaseIdx = 0;
    this.dialogue = null;
    this.cutin = null;
    this.spell = null;
    this.spellFailed = false;
    this.spellBonus = 0;
    this.spellBgKind = null;
    this.spellBgAlpha = 0;
    this.lastSpellBg = null;
    this.stageTitle = null;
    this.bossTitle = null;
    this.bgmTitle = null;
    this.bombName = null;
    this.clearInfo = null;
    this.shake = 0;
    this.flash = null;
    this.tasks = new TaskRunner();
  }

  startStage(i) {
    this.stageIndex = i;
    this.stage = STAGES[i];
    this.resetStageState();
    this.bg = new this.stage.bg();
    this.stageFrame = 0;
    this.player.x = FIELD_W / 2;
    this.player.y = FIELD_H - 48;
    this.player.invuln = Math.max(this.player.invuln, 60);
    this.tasks.add(this.stageFlow());
  }

  *stageFlow() {
    Sound.playBgm(this.stage.bgm);
    this.showBgmTitle(this.stage.bgm);
    this.stageTitle = { frame: 0 };
    yield* this.stage.script(this);
    yield* this.stageClear();
  }

  *stageClear() {
    this.clearLasers();
    this.bullets.cancelAll(true);
    for (const it of this.items) it.auto = true;
    yield 60;
    const bonus = (this.stageIndex + 1) * 1000000 + this.power * 1000 + this.graze * 500;
    this.score += bonus;
    this.clearInfo = { bonus, frame: 0 };
    Sound.se('bonus');
    yield 240;
    this.clearInfo = null;
    if (this.practice) this.finish('practice');
    else if (this.stageIndex >= STAGES.length - 1) this.finish('clear');
    else this.pendingStage = this.stageIndex + 1;
  }

  finish(kind) {
    this.saveHiScore();
    Sound.stopBgm(1.5);
    if (kind === 'clear') Game.setScene(new EndingScene(this));
    else Game.setScene(new ResultScene(this, kind));
  }

  saveHiScore() {
    if (this.practice || this.cheat) return;
    if (this.score > Store.get(this.hiKey, 0)) Store.set(this.hiKey, Math.floor(this.score));
  }

  // ---------------- 更新 ----------------
  update() {
    if (this.pendingStage !== null) {
      const i = this.pendingStage;
      this.pendingStage = null;
      this.startStage(i);
    }
    if (this.continueMenu) { this.updateContinue(); return; }
    if (this.paused) { this.updatePause(); return; }
    if (Input.pressed('pause') || (Input.isTouch && document.hidden)) { this.openPause(); return; }

    this.frame++;
    this.stageFrame++;
    this.tasks.update();
    if (this.dialogue) this.dialogue.update();
    this.player.update(this);
    if (this.continueMenu) return;

    // 自機ショット
    const boss = this.boss;
    for (const s of this.shots) {
      s.update();
      if (!s.alive) continue;
      for (const e of this.enemies) {
        if (!e.alive || e.untouchable || e.y < -6) continue;
        const r = e.r + s.r;
        if (dist2(s.x, s.y, e.x, e.y) < r * r) {
          this.damageEnemy(e, s.dmg);
          s.alive = false;
          if (s.kind === 'missile') Fx.explosion(s.x, s.y, 'rgba(120,255,150,0.6)', 0.6);
          else Fx.hit(s.x, s.y);
          break;
        }
      }
      if (s.alive && boss && boss.alive && !boss.untouchable) {
        const r = boss.r + s.r;
        if (dist2(s.x, s.y, boss.x, boss.y) < r * r) {
          this.damageEnemy(boss, s.dmg);
          s.alive = false;
          if (s.kind === 'missile') Fx.explosion(s.x, s.y, 'rgba(120,255,150,0.6)', 0.6);
          else Fx.hit(s.x, s.y);
        }
      }
    }
    this.shots = this.shots.filter(s => s.alive);

    for (const e of this.enemies) if (e.alive) e.update();
    this.enemies = this.enemies.filter(e => e.alive);
    if (this.boss) this.boss.update();
    this.bullets.update();
    for (const l of this.lasers) l.update();
    this.lasers = this.lasers.filter(l => l.alive);
    this.checkPlayerCollision();
    for (const it of this.items) if (it.alive) it.update(this.player);
    this.items = this.items.filter(it => it.alive);
    Fx.update();
    this.bg.update();

    // 演出タイマー
    const target = this.spellBgKind ? 1 : 0;
    this.spellBgAlpha = clamp(this.spellBgAlpha + (target ? 0.03 : -0.03), 0, 1);
    if (this.spellBgKind) this.lastSpellBg = this.spellBgKind;
    for (const m of this.messages) m.frame++;
    this.messages = this.messages.filter(m => m.frame < m.life);
    if (this.stageTitle) this.stageTitle.frame++;
    if (this.bossTitle) this.bossTitle.frame++;
    if (this.bgmTitle) this.bgmTitle.frame++;
    if (this.bombName) this.bombName.frame++;
    if (this.clearInfo) this.clearInfo.frame++;
    if (this.spell) this.spell.frame++;
    if (this.cutin && ++this.cutin.frame > 90) this.cutin = null;
    if (this.shake > 0) this.shake--;
    if (this.flash && (this.flash.a -= 0.03) <= 0) this.flash = null;
    if (this.score > this.hiScore) this.hiScore = this.score;
  }

  canShoot() { return !this.dialogue; }

  checkPlayerCollision() {
    const p = this.player;
    if (p.state !== 'normal') return;
    const canHit = p.invuln === 0 && !this.cheat;
    const canGraze = p.invuln === 0;
    const hr = p.hitR;
    for (const b of this.bullets.list) {
      if (!b.alive || b.delay > 0) continue;
      const dx = b.x - p.x, dy = b.y - p.y;
      const d2 = dx * dx + dy * dy;
      const gr = p.grazeR + b.hitR;
      if (d2 > gr * gr) continue;
      const r = hr + b.hitR;
      if (d2 < r * r) {
        if (canHit) { p.hit(this); return; }
      } else if (!b.grazed && canGraze) {
        b.grazed = true;
        this.addGraze(b.x, b.y);
      }
    }
    for (const l of this.lasers) {
      if (l.hits(p.x, p.y, hr)) {
        if (canHit) { p.hit(this); return; }
      } else if (canGraze && l.on && l.grazeCd === 0 && l.distTo(p.x, p.y) < l.width * 0.5 + 16) {
        l.grazeCd = 5;
        this.addGraze(p.x, p.y);
      }
    }
    if (!canHit) return;
    for (const e of this.enemies) {
      if (!e.alive || e.noBody) continue;
      const r = e.r * 0.6 + hr;
      if (dist2(e.x, e.y, p.x, p.y) < r * r) { p.hit(this); return; }
    }
    const b = this.boss;
    if (b && b.alive && this.bossPhases && dist2(b.x, b.y, p.x, p.y) < (14 + hr) * (14 + hr)) p.hit(this);
  }

  addGraze(x, y) {
    this.graze++;
    this.score += 500;
    Sound.se('graze');
    Fx.graze(x, y);
  }

  damageEnemy(e, dmg, isBomb = false, sound = true) {
    if (!e.alive || e.untouchable || e.invincible > 0) return;
    if (e.isBoss) {
      if (isBomb && this.spell) dmg *= 0.3;
      e.hp -= dmg;
      e.flash = 2;
      this.score += 10;
      if (sound) Sound.se('hit');
      return;
    }
    e.hp -= dmg;
    e.flash = 2;
    this.score += 10;
    if (sound) Sound.se('hit');
    if (e.hp <= 0) this.killEnemy(e);
  }

  killEnemy(e) {
    e.alive = false;
    e.tasks.clear();
    this.score += e.score;
    dropItems(e.x, e.y, e.drops);
    const col = { blue: 'rgba(120,160,255,0.8)', red: 'rgba(255,120,120,0.8)', green: 'rgba(120,255,150,0.8)', yellow: 'rgba(255,230,120,0.8)', purple: 'rgba(210,140,255,0.8)' }[e.color] || 'rgba(255,255,255,0.8)';
    Fx.explosion(e.x, e.y, col, e.kind === 'bigfairy' ? 1.8 : 1);
    Sound.se('kill');
    if (e.onDeath) e.onDeath(e);
  }

  areaDamage(x, y, r, dmg, isBomb) {
    for (const e of this.enemies) {
      if (e.alive && dist2(e.x, e.y, x, y) < (r + e.r) * (r + e.r)) this.damageEnemy(e, dmg, isBomb);
    }
    const b = this.boss;
    if (b && b.alive && dist2(b.x, b.y, x, y) < (r + b.r) * (r + b.r)) this.damageEnemy(b, dmg, isBomb);
  }

  nearestTarget(x, y) {
    let best = null, bd = Infinity;
    for (const e of this.enemies) {
      if (!e.alive || e.untouchable || e.y < 0 || e.y > FIELD_H || e.x < 0 || e.x > FIELD_W) continue;
      const d = dist2(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    const b = this.boss;
    if (b && b.alive && !b.untouchable) {
      const d = dist2(x, y, b.x, b.y);
      if (d < bd) best = b;
    }
    return best;
  }

  clearLasers() { this.lasers = []; }

  collectItem(it) {
    switch (it.type) {
      case 'power': this.addPower(5); break;
      case 'bigpower': this.addPower(100); break;
      case 'full': this.addPower(400); break;
      case 'point': {
        const maxV = Math.min(10000 + this.graze * 20, 100000);
        const v = it.auto ? maxV : Math.floor(maxV * clamp(1 - ((it.y - POC_LINE) / (FIELD_H - POC_LINE)) * 0.6, 0.3, 1) / 10) * 10;
        this.score += v;
        this.pointItems++;
        Fx.text(it.x, it.y - 10, String(v), v >= maxV ? '#ffe070' : '#ffffff', 10, 40);
        const need = EXTEND_POINTS[this.extendIdx];
        if (need && this.pointItems >= need) { this.extendIdx++; this.extend(); }
        break;
      }
      case 'bomb':
        this.bombs = Math.min(this.bombs + 1, 8);
        this.msg('Spell Card Get!', '#80ffa0');
        break;
      case 'life': this.extend(); break;
      case 'star': this.score += 1500; break;
    }
    Sound.se('item');
  }

  addPower(n) {
    if (this.power >= 400) { this.score += 5000; return; }
    const before = Math.floor(this.power / 100);
    this.power = Math.min(400, this.power + n);
    if (Math.floor(this.power / 100) > before) {
      Sound.se('powerup');
      if (this.power >= 400) {
        this.msg('Full Power Mode!!', '#ffd060');
        this.bullets.cancelAll(true);
      } else Fx.text(this.player.x, this.player.y - 30, 'Power Up', '#ffb0b0', 12, 50);
    }
  }

  extend() {
    this.lives = Math.min(this.lives + 1, 8);
    this.msg('Extend!!', '#ff9ad8');
    Sound.se('extend');
  }

  msg(text, color = '#ffffff', sub = null, life = 150) {
    this.messages.push({ text, color, sub, frame: 0, life });
    if (this.messages.length > 3) this.messages.shift();
  }
  showBgmTitle(id) { if (SONGS[id]) this.bgmTitle = { text: SONGS[id].title, frame: 0 }; }
  showBombName(text) { this.bombName = { text, frame: 0 }; }

  onPlayerDeath(x, y) {
    this.misses++;
    this.lives--;
    this.spellFailed = true;
    this.bombs = 3;
    const lost = Math.min(this.power, 50);
    this.power -= lost;
    this.bullets.cancelAll(false);
    this.clearLasers();
    this.shake = 16;
    for (let i = 0; i < 7; i++) {
      const it = spawnItem(i === 3 && this.lives < 0 ? 'full' : 'power', x + frand(-16, 16), Math.min(y, FIELD_H - 60));
      it.vy = -frand(4, 6);
      it.vx = frand(-2.2, 2.2);
    }
  }

  onOutOfLives() {
    this.continueMenu = { sel: 0, frame: 0 };
    Sound.se('pause');
  }

  updateContinue() {
    const m = this.continueMenu;
    m.frame++;
    if (Input.repeat('up') || Input.repeat('down')) { m.sel = 1 - m.sel; Sound.se('cursor'); }
    const tap = fieldMenuTap(2);
    if (tap >= 0) m.sel = tap;
    if ((Input.pressed('shot') || tap >= 0) && m.frame > 20) {
      Sound.se('ok');
      if (m.sel === 0) {
        this.continues++;
        this.score = this.continues;
        this.lives = this.initialLives;
        this.bombs = 3;
        this.continueMenu = null;
        const p = this.player;
        p.state = 'respawn';
        p.timer = 40;
        p.x = FIELD_W / 2;
        p.y = FIELD_H + 30;
        p.invuln = 220;
      } else {
        this.finish('gameover');
      }
    }
  }

  openPause() {
    this.paused = true;
    this.pauseSel = 0;
    this.pauseFrame = 0;
    Sound.se('pause');
    if (Sound.ctx && Sound.bgmBus) Sound.bgmBus.gain.value = Sound.muted ? 0 : Sound.bgmVolume * 0.3;
  }
  closePause() {
    this.paused = false;
    Sound.applyVolume();
  }
  updatePause() {
    this.pauseFrame++;
    const n = 3;
    if (Input.repeat('up')) { this.pauseSel = (this.pauseSel + n - 1) % n; Sound.se('cursor'); }
    if (Input.repeat('down')) { this.pauseSel = (this.pauseSel + 1) % n; Sound.se('cursor'); }
    const tap = fieldMenuTap(n);
    if (tap >= 0) this.pauseSel = tap;
    if (Input.pressed('pause') || Input.pressed('bomb')) { this.closePause(); return; }
    if ((Input.pressed('shot') || tap >= 0) && this.pauseFrame > 5) {
      Sound.se('ok');
      if (this.pauseSel === 0) this.closePause();
      else if (this.pauseSel === 1) {
        Sound.applyVolume();
        Game.setScene(new GameScene({ ...this.opts, seed: undefined }));
      } else {
        this.saveHiScore();
        Sound.applyVolume();
        Game.setScene(new TitleScene());
      }
    }
  }

  // ---------------- ボス戦 ----------------
  spawnBoss(id, def) {
    const b = new Boss(id, def);
    this.boss = b;
    return b;
  }

  *talk(lines) {
    this.bullets.cancelAll(true);
    this.dialogue = new Dialogue(lines, this);
    while (!this.dialogue.done) yield;
    this.dialogue = null;
  }

  *fight(boss, phases) {
    this.bossPhases = phases.filter(ph => DIFF >= (ph.minDiff || 0));
    for (let i = 0; i < this.bossPhases.length; i++) {
      this.bossPhaseIdx = i;
      yield* this.runPhase(boss, this.bossPhases[i], i, this.bossPhases.length);
    }
    this.bossPhases = null;
    boss.phase = null;
  }

  *runPhase(boss, ph, index, total) {
    const spell = ph.type === 'spell';
    boss.hp = boss.maxHp = Math.round((ph.hp ?? 1000) * dv(0.8, 1, 1.05, 1.1));
    boss.phase = ph;
    boss.timer = Math.round((ph.time ?? 30) * 60);
    const totalTime = boss.timer;
    boss.untouchable = !!ph.survival;
    boss.invincible = spell ? 60 : 30;
    this.spellFailed = false;
    const base = ph.bonus ?? (this.stageIndex + 1) * 1000000 + index * 200000;
    if (spell) {
      this.spellsSeen++;
      this.spellBonus = base;
      this.spell = { name: ph.name, frame: 0, history: SpellHistory.get(ph.name) };
      SpellHistory.bump(ph.name, 'tried');
      Sound.se('spell');
      this.cutin = { id: boss.id, frame: 0 };
      this.spellBgKind = boss.def.spellBg || null;
    } else {
      this.spell = null;
      this.spellBgKind = null;
    }
    boss.tasks.clear();
    boss.tasks.add(ph.script(boss, this));
    let result = 'timeout';
    for (;;) {
      yield;
      boss.timer--;
      if (spell && !this.spellFailed) {
        this.spellBonus = Math.floor((base * (0.5 + 0.5 * boss.timer / totalTime)) / 10) * 10;
      }
      if (boss.timer > 0 && boss.timer <= 600 && boss.timer % 60 === 0) Sound.se(boss.timer <= 180 ? 'timeoutLow' : 'timeout');
      if (!ph.survival && boss.hp <= 0) { result = 'defeated'; break; }
      if (boss.timer <= 0) break;
    }
    boss.tasks.clear();
    boss.moveTask = null;
    boss.untouchable = true;
    this.clearLasers();
    this.bullets.cancelAll(true);
    const last = index === total - 1;
    if (result === 'defeated') {
      this.score += 100000;
      Sound.se('kill');
      Fx.explosion(boss.x, boss.y, 'rgba(255,220,255,0.8)', 2.5);
      if (!last) dropItems(boss.x, boss.y, spell ? { power: 6, point: 8 } : { power: 4, point: 4 });
    } else {
      Sound.se('clear');
    }
    if (spell) {
      const captured = !this.spellFailed && (result === 'defeated' || ph.survival);
      if (captured) {
        this.score += this.spellBonus;
        this.spellsGot++;
        SpellHistory.bump(ph.name, 'got');
        this.msg('Get Spell Card Bonus!!', '#ffe070', padScore(this.spellBonus, 8));
        Sound.se('bonus');
      } else {
        this.msg('Bonus Failed', '#a0a8c0');
      }
    }
    this.spell = null;
    this.spellBgKind = null;
    if (!last) {
      yield* boss.moveTo(clamp(boss.x, 96, FIELD_W - 96), 100, 40);
      yield 20;
    }
  }

  // ボス撃破（逃げるだけの中ボスは flee=true）
  *bossDown(boss, flee = false) {
    if (flee) {
      yield* boss.moveTo(boss.x + (boss.x < FIELD_W / 2 ? -1 : 1) * 60, -80, 40, Ease.inQuad);
      boss.alive = false;
      this.boss = null;
      return;
    }
    Sound.se('bossdie');
    Fx.bossExplosion(boss.x, boss.y);
    this.shake = 40;
    this.flash = { color: '255,255,255', a: 0.9 };
    dropItems(boss.x, boss.y, boss.def.finalDrops || { power: 10, point: 14, bigpower: 1 });
    this.score += 1000000;
    boss.alive = false;
    this.boss = null;
    yield 80;
    for (const it of this.items) it.auto = true;
    yield 60;
  }

  // ---------------- 描画 ----------------
  draw(ctx) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.save();
    ctx.beginPath();
    ctx.rect(FIELD_X, FIELD_Y, FIELD_W, FIELD_H);
    ctx.clip();
    const sh = this.shake > 0 ? Math.min(this.shake, 8) * 0.5 : 0;
    ctx.translate(FIELD_X + (sh ? frand(-sh, sh) : 0), FIELD_Y + (sh ? frand(-sh, sh) : 0));
    this.bg.draw(ctx);
    if (this.spellBgAlpha > 0 && this.lastSpellBg) {
      ctx.globalAlpha = this.spellBgAlpha;
      drawSpellBG(ctx, this.lastSpellBg, this.frame);
      ctx.globalAlpha = 1;
    }
    if (this.boss) this.boss.draw(ctx);
    for (const e of this.enemies) e.draw(ctx);
    for (const it of this.items) it.draw(ctx);
    for (const s of this.shots) s.draw(ctx);
    if (this.player.bomb) this.player.bomb.draw(ctx);
    this.player.draw(ctx);
    for (const l of this.lasers) l.draw(ctx);
    this.bullets.draw(ctx);
    this.player.drawHitbox(ctx);
    Fx.draw(ctx);
    drawCutin(ctx, this);
    drawBossHud(ctx, this);
    drawSpellName(ctx, this);
    if (this.dialogue) this.dialogue.draw(ctx);
    drawStageTitle(ctx, this);
    drawBossTitle(ctx, this);
    drawMessages(ctx, this);
    if (this.flash) {
      ctx.fillStyle = `rgba(${this.flash.color},${Math.max(0, this.flash.a)})`;
      ctx.fillRect(0, 0, FIELD_W, FIELD_H);
    }
    if (this.paused) drawFieldMenu(ctx, '一時停止', ['ゲームを再開', '最初からやり直す', 'タイトルに戻る'], this.pauseSel, 'Esc / X で再開');
    if (this.continueMenu) drawFieldMenu(ctx, '満身創痍', ['コンティニューする', 'あきらめる'], this.continueMenu.sel, `コンティニュー回数 ${this.continues}`);
    ctx.restore();
    drawSidePanel(ctx, this);
  }
}

</script>
<script>
'use strict';
// ============================================================
//  ストーリー（会話・エンディング）
//  [話者, 表情, 台詞]  表情: normal / happy / angry / surprised / sad / smug
// ============================================================

const INTRO_TEXT = [
  'ある晩、幻想郷の夜空から、雨のように星が降りはじめた。',
  '降ってきた星はきらきらと輝く弾幕となり、妖怪も妖精も大はしゃぎ。',
  '人里では、屋根に穴が空くやら、眩しくて眠れないやらで大騒ぎである。',
  'これはきっと異変に違いない。',
  '博麗霊夢と霧雨魔理沙は、それぞれ星の降る夜空へと飛び出した。',
];

const STORY = {
  stage1: {
    reimu: {
      before: [
        ['reimu', 'normal', 'まったく、夜空から星が降ってくるなんて。\nおかげで眩しくて眠れやしないわ。'],
        ['rumia', 'normal', '眩しいのはキライなのかー？'],
        { title: 'rumia' },
        ['reimu', 'smug', 'あら、宵闇の妖怪じゃない。\nあんたの仕業……ってことはなさそうね。'],
        ['rumia', 'angry', '星のせいで、せっかくの闇が台無しなのだー。\n落ちてくる光をぜんぶ食べちゃえば元通りかな？'],
        { bgm: 'boss1' },

<script>
'use strict';
// ============================================================
//  共通の道中パターン
// ============================================================

// 空から星が降ってくる（異変そのもの）
function* starShower(frames, count, colors = ['yellow', 'cyan', 'pink', 'white'], big = false) {
  const interval = Math.max(1, Math.floor(frames / count));
  for (let i = 0; i < count; i++) {
    fire({
      x: rand(8, FIELD_W - 8), y: -12, speed: 0, ax: rand(-0.004, 0.004), ay: 0.025,
      evx: rand(-0.4, 0.4), maxFall: rand(1.2, 1.6) + DIFF * 0.35,
      type: big && rng.next() < 0.3 ? 'bigstar' : 'star', color: pick(colors), silent: true, delay: 4,
    });
    yield interval;
  }
}

// 横から弧を描いて横切る妖精の列
function* sideSweep(side, n, o = {}) {
  for (let i = 0; i < n; i++) {
    spawnEnemy({
      x: side < 0 ? -12 : FIELD_W + 12, y: (o.y ?? 40) + i * 5, hp: o.hp ?? 8, color: o.color || 'blue',
      drops: i % 2 ? { point: 1 } : { power: 1 },
      score: 800,
      script: function* (e) {
        e.setMove(o.speed ?? 2.6, side < 0 ? (o.angle ?? 22) * DEG : (180 - (o.angle ?? 22)) * DEG, 0, side < 0 ? 0.0045 : -0.0045);
        yield 28 + i * 2;
        if (DIFF > 0 || i % 2 === 0) {
          fireFan({ x: e.x, y: e.y, n: dv(1, 1, 3, 5), spread: 0.32, angle: e.aim(), speed: dv(2.2, 2.8, 3.2, 3.6), type: o.type || 'small', color: o.bcolor || 'blue' });
        }
        if (DIFF >= 2) {
          yield 30;
          fireFan({ x: e.x, y: e.y, n: 3, spread: 0.4, angle: e.aim(), speed: 2.4, type: 'rice', color: o.bcolor || 'blue' });
        }
      },
    });
    yield o.gap ?? 10;
  }
}

// 上から降りてきて止まり、リング弾を撃って帰る妖精
function ringFairy(x, o = {}) {
  return spawnEnemy({
    x, y: -16, hp: o.hp ?? 30, color: o.color || 'red', drops: o.drops || { power: 2, point: 1 }, score: 2000,
    script: function* (e) {
      yield* e.moveTo(x, o.stopY ?? 100, 50);
      for (let k = 0; k < (o.times ?? 3); k++) {
        const n = o.n ?? dv(8, 12, 16, 22);
        fireRing({ x: e.x, y: e.y, n, angle: e.aim() + (k % 2) * (Math.PI / n), speed: (o.speed ?? 1.8) + k * 0.2, type: o.type || 'ball', color: o.bcolor || 'red' });
        yield o.gap ?? 35;
      }
      yield 20;
      e.setMove(0, -Math.PI / 2, 0.06);
    },
  });
}

function* kedamaRain(frames, count, color = 'white') {
  const interval = Math.max(1, Math.floor(frames / count));
  for (let i = 0; i < count; i++) {
    const x = rand(20, FIELD_W - 20);
    spawnEnemy({
      x, y: -12, kind: 'kedama', color, hp: 5, r: 10, score: 500, drops: rng.next() < 0.5 ? { point: 1 } : { power: 1 },
      speed: rand(1.4, 2.4), angle: Math.PI / 2 + rand(-0.15, 0.15),
      script: function* (e) {
        yield randInt(40, 90);
        if (DIFF >= 1 && e.onScreen) fire({ x: e.x, y: e.y, angle: e.aim(), speed: dv(2, 2.4, 2.8, 3.2), type: 'dot', color: 'white' });
        if (DIFF >= 3) fireFan({ x: e.x, y: e.y, n: 3, spread: 0.5, angle: e.aim(), speed: 2, type: 'dot', color: 'purple' });
      },
    });
    yield interval;
  }
}

// 上から斜めに交互に流れてくる妖精
function* zigzag(n, color = 'blue', bcolor = 'cyan', type = 'rice') {
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    spawnEnemy({
      x: FIELD_W / 2 + side * rand(10, 60), y: -12, hp: 10, color, score: 1000, drops: { power: 1 },
      script: function* (e) {
        e.setMove(2.2, Math.PI / 2 - side * 0.5);
        yield 40;
        fireFan({ x: e.x, y: e.y, n: dv(1, 3, 3, 5), spread: 0.35, angle: e.aim(), speed: dv(2.2, 2.6, 3, 3.4), type, color: bcolor });
        yield 30;
        e.angVel = side * 0.01;
      },
    });
    yield 18;
  }
}

function* waitClear(timeout = 1200) {
  yield* waitUntil(() => G.enemies.length === 0, timeout);
}

          b.wander(60, 50);
        }
      }
    },
  },
  {
    type: 'spell', name: '闇符「ムーンレスサークル」', hp: 1300, time: 45,
    *script(b) {
      yield* b.moveTo(FIELD_W / 2, 110, 40);

          fire({

        for (let k = 0; k < dv(1, 2, 3, 4); k++) {
          fireFan({ x: b.x, y: b.y, n: 3, spread: 0.25, angle: b.aim(), speed: 3, type: 'rice', color: 'red' });
          yield 10;
        }
        yield dv(80, 60, 50, 40);
        b.wander(60, 60);
      }

  },
];

STAGES.push({

    g.tasks.add(sideSweep(-1, 8, { color: 'purple', bcolor: 'purple', type: 'star', y: 40 }));
    yield 100;
    g.tasks.add(sideSweep(1, 8, { color: 'purple', bcolor: 'purple', type: 'star', y: 40 }));
    yield 200;
    for (const side of [-1, 1]) {
      spawnEnemy({
        x: FIELD_W / 2 + side * 100, y: -20, kind: 'bigfairy', color: 'yellow', hp: 320, r: 18, score: 20000, drops: { power: 4, point: 5 },
        script: function* (e) {
          yield* e.moveTo(e.x, 100, 50);
          for (let k = 0; k < 6; k++) {
            fireRing({ x: e.x, y: e.y, n: dv(10, 14, 18, 24), angle: rand(TAU), speed: 1.7, angVel: side * 0.006, type: 'star', color: k % 2 ? 'yellow' : 'orange' });
            yield 50;
          }
          e.setMove(0, -Math.PI / 2, 0.05);
        },
      });
    }
    yield* waitClear(700);
    g.tasks.add(starShower(480, dv(40, 60, 84, 110), ['yellow', 'white', 'pink', 'cyan'], true));
    g.tasks.add(swirlWave(-1, 10));
    g.tasks.add(swirlWave(1, 10));
    yield 240;
    [80, 192, 304].forEach(x => laserFairy(x, 80));
    yield 120;
    [120, 264].forEach(x => ringFairy(x, { color: 'blue', bcolor: 'yellow', type: 'star', stopY: 120, times: 4, n: dv(10, 14, 20, 26) }));
    yield* waitClear(900);
    yield 120;

    const boss = g.spawnBoss('star', { spellBg: 'star', circleColor: '140,160,255', x: FIELD_W / 2, y: -50, finalDrops: { power: 10, point: 20, bigpower: 1 } });
    yield* boss.moveTo(FIELD_W / 2, 100, 60);
    yield* g.talk(STORY.stage3[g.charId].before);
    yield* g.fight(boss, STAR_PHASES);
    yield* g.bossDown(boss);
    yield* g.talk(STORY.stage3[g.charId].after);
  },
});

</script>
<script>
'use strict';
// ============================================================
//  タイトル・各種メニュー・エンディング・リザルト
// ============================================================

class MenuBG {
  constructor() {
    this.t = 0;
    this.stars = [];
    for (let i = 0; i < 180; i++) this.stars.push({ x: frand(SCREEN_W), y: frand(SCREEN_H * 0.8), s: frand() < 0.1 ? 2 : 1, p: frand(TAU) });
    this.meteors = [];
    this.land = MenuBG.makeLand();
  }
  static makeLand() {
    const c = makeCanvas(SCREEN_W, 170);
    const x = c.getContext('2d');
    x.fillStyle = '#07051a';
    x.beginPath();
    x.moveTo(0, 170);
    for (let px = 0; px <= SCREEN_W; px += 8) {
      const y = 70 + Math.sin(px * 0.011) * 22 + Math.sin(px * 0.031 + 1) * 8;
      x.lineTo(px, y);
    }
    x.lineTo(SCREEN_W, 170);
    x.closePath();
    x.fill();
    x.fillStyle = '#040310';
    x.beginPath();
    x.moveTo(0, 170);
    for (let px = 0; px <= SCREEN_W; px += 8) x.lineTo(px, 120 + Math.sin(px * 0.017 + 2) * 14);
    x.lineTo(SCREEN_W, 170);
    x.closePath();
    x.fill();
    // 鳥居
    x.fillStyle = '#040310';
    const tx = 520, ty = 72;
    x.fillRect(tx - 34, ty - 6, 68, 6);
    x.fillRect(tx - 28, ty + 4, 56, 4);
    x.fillRect(tx - 24, ty - 2, 5, 50);
    x.fillRect(tx + 19, ty - 2, 5, 50);
    x.beginPath(); x.moveTo(tx - 40, ty - 10); x.quadraticCurveTo(tx, ty - 4, tx + 40, ty - 10); x.lineTo(tx + 38, ty - 5); x.quadraticCurveTo(tx, ty, tx - 38, ty - 5); x.fill();
    // 木々
    for (let i = 0; i < 26; i++) {
      const px = (i * 53) % SCREEN_W, h = 20 + (i * 37) % 30;
      x.beginPath(); x.moveTo(px - 12, 130); x.lineTo(px, 130 - h - 30); x.lineTo(px + 12, 130); x.fill();
    }
    return c;
  }
  update() {
    this.t++;
    for (const s of this.stars) s.p += 0.04;
    if (Math.random() < 1 / 40) {
      const sp = frand(6, 10), a = frand(25, 50) * DEG;
      this.meteors.push({ x: frand(-60, SCREEN_W * 0.7), y: frand(-30, 150), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 50 });
    }
    for (const m of this.meteors) { m.x += m.vx; m.y += m.vy; m.life--; }
    this.meteors = this.meteors.filter(m => m.life > 0);
  }
  draw(ctx) {
    const g = ctx.createLinearGradient(0, 0, 0, SCREEN_H);
    g.addColorStop(0, '#060418');
    g.addColorStop(0.6, '#1a1240');
    g.addColorStop(1, '#2a1a50');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    // 月
    const mg = ctx.createRadialGradient(118, 104, 10, 118, 104, 120);
    mg.addColorStop(0, 'rgba(255,250,220,0.35)');
    mg.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(0, 0, 260, 240);
    ctx.fillStyle = '#fffbe6';
    ctx.beginPath(); ctx.arc(118, 104, 42, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(210,200,170,0.35)';
    ctx.beginPath(); ctx.arc(104, 94, 9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(132, 118, 6, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.stars) {
      ctx.fillStyle = `rgba(230,230,255,${0.3 + 0.35 * Math.sin(s.p)})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.lineCap = 'round';
    for (const m of this.meteors) {
      const a = Math.min(1, m.life / 15);
      const gg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 10, m.y - m.vy * 10);
      gg.addColorStop(0, `rgba(255,250,220,${a})`);
      gg.addColorStop(1, 'rgba(255,250,220,0)');
      ctx.strokeStyle = gg;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 10, m.y - m.vy * 10); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(this.land, 0, SCREEN_H - 170);
  }
}

let sharedMenuBG = null;
function menuBG() { return sharedMenuBG || (sharedMenuBG = new MenuBG()); }

// 縦並びメニュー。rects を返し、タップ判定に使う
function drawMenuList(ctx, items, sel, x, y, gap, o = {}) {
  const rects = [];
  ctx.textBaseline = 'middle';
  items.forEach((it, i) => {
    const on = i === sel;
    const label = typeof it === 'string' ? it : it.label;
    const disabled = typeof it === 'object' && it.disabled;
    ctx.font = `${on ? 700 : 500} ${o.size || 19}px ${FONT_JP}`;
    ctx.textAlign = o.align || 'left';
    const px = x + (on ? (o.shift ?? 10) : 0);
    const col = disabled ? '#5a5478' : on ? '#fff3c8' : '#a8a0cc';
    if (on) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,220,140,0.9)';
      ctx.shadowBlur = 10;
      strokeText(ctx, label, px, y + i * gap, col, 'rgba(20,10,40,0.9)', 3);
      ctx.restore();
      ctx.fillStyle = '#ffe08a';
      ctx.save();
      const w = ctx.measureText(label).width;
      ctx.translate(o.align === 'center' ? px - w / 2 - 16 : px - 16, y + i * gap);
      ctx.rotate(Game.frame * 0.05);
      starPath(ctx, 6, 2.6);
      ctx.fill();
      ctx.restore();
    } else {
      strokeText(ctx, label, px, y + i * gap, col, 'rgba(20,10,40,0.9)', 3);
    }
    const w = o.hitW || 220;
    rects.push({ x: o.align === 'center' ? x - w / 2 : x - 20, y: y + i * gap - gap / 2, w, h: gap });
  });
  return rects;
}
function menuTapIndex(rects) {
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    if (Input.tapIn(r.x, r.y, r.w, r.h)) return i;
  }
  return -1;
}
function menuMove(sel, n, prevKey = 'up', nextKey = 'down') {
  if (Input.repeat(prevKey)) { Sound.se('cursor'); return (sel + n - 1) % n; }
  if (Input.repeat(nextKey)) { Sound.se('cursor'); return (sel + 1) % n; }
  return sel;
}
// 画面左上の「戻る」ボタン（タッチ用）
function drawBackButton(ctx) {
  if (!Input.isTouch) return;
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.strokeStyle = 'rgba(214,186,120,0.8)';
  ctx.lineWidth = 1;
  ctx.fillRect(10, 10, 70, 30);
  ctx.strokeRect(10, 10, 70, 30);
  ctx.font = `600 14px ${FONT_JP}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText('◀ 戻る', 45, 25);
}
function backPressed() { return Input.pressed('bomb') || Input.tapIn(10, 10, 70, 30); }

function drawHeading(ctx, text, en) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `800 26px ${FONT_JP}`;
  strokeText(ctx, text, SCREEN_W / 2, 44, '#ffffff', 'rgba(40,20,90,0.9)', 4);
  if (en) {
    ctx.font = `italic 600 14px ${FONT_EN}`;
    ctx.fillStyle = '#d8c89a';
    ctx.fillText(en, SCREEN_W / 2, 70);
  }
}

// ------------------------------------------------------------
//  タイトル
// ------------------------------------------------------------
class TitleScene {
  constructor(sel = 0) {
    this.sel = sel;
    this.frame = 0;
    this.items = ['ゲームスタート', 'プラクティス', 'ミュージックルーム', '操作説明とお話', 'オプション'];
    this.rects = [];
  }
  enter() { Sound.playBgm('title'); }
  update() {
    this.frame++;
    menuBG().update();
    this.sel = menuMove(this.sel, this.items.length);
    const tap = menuTapIndex(this.rects);
    if (tap >= 0) this.sel = tap;
    if ((Input.pressed('shot') || tap >= 0) && this.frame > 10) {
      Sound.se('ok');
      switch (this.sel) {
        case 0: Game.setScene(new DifficultyScene('game')); break;
        case 1: Game.setScene(new DifficultyScene('practice')); break;
        case 2: Game.setScene(new MusicRoomScene()); break;
        case 3: Game.setScene(new ManualScene()); break;
        case 4: Game.setScene(new OptionScene()); break;
      }
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    const f = this.frame;
    const a = Math.min(1, f / 40);
    ctx.globalAlpha = a;
    // タイトルロゴ
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 18px ${FONT_JP}`;
    ctx.fillStyle = '#d8c8ff';
    ctx.fillText('東方Project 二次創作弾幕シューティング', 400, 74);
    ctx.font = `800 64px ${FONT_JP}`;
    ctx.shadowColor = 'rgba(150,130,255,0.95)';
    ctx.shadowBlur = 24;
    const g = ctx.createLinearGradient(0, 100, 0, 170);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, '#c4b2ff');
    ctx.fillStyle = g;
    ctx.fillText('東方星降夜', 400, 134);
    ctx.shadowBlur = 0;
    ctx.font = `italic 600 24px ${FONT_EN}`;
    ctx.fillStyle = '#ecd9a0';
    ctx.fillText('〜 Night of Falling Stars.', 420, 184);
    ctx.restore();
    this.rects = drawMenuList(ctx, this.items, this.sel, 440, 240, 34);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = 'rgba(220,210,255,0.75)';
    ctx.fillText(Input.isTouch ? 'タップで選択' : '↑↓：選択　Z：決定　X：戻る　M：ミュート', 16, 440);
    ctx.textAlign = 'center';
    ctx.font = `11px ${FONT_JP}`;
    ctx.fillStyle = 'rgba(200,190,240,0.7)';
    ctx.fillText('本作品は上海アリス幻樂団「東方Project」の二次創作です。公式とは関係ありません。', SCREEN_W / 2, 466);
  }
}

// ------------------------------------------------------------
//  難易度選択
// ------------------------------------------------------------
const DIFF_DESC = [
  '弾幕シューティングが初めての方に',
  '普通に遊びたい方に',
  '弾幕に慣れてきた方に',
  '狂気の弾幕に挑みたい方に',
];

class DifficultyScene {
  constructor(mode) {
    this.mode = mode;
    this.sel = Store.get('lastDiff', 1);
    this.frame = 0;
  }
  update() {
    this.frame++;
    menuBG().update();
    this.sel = menuMove(this.sel, 4);
    let tap = -1;
    for (let i = 0; i < 4; i++) if (Input.tapIn(150, 110 + i * 86, 340, 76)) tap = i;
    if (tap >= 0) this.sel = tap;
    if ((Input.pressed('shot') || tap >= 0) && this.frame > 8) {
      Sound.se('ok');
      Store.set('lastDiff', this.sel);
      Game.setScene(new CharacterScene(this.mode, this.sel));
    } else if (backPressed()) {
      Sound.se('cancel');
      Game.setScene(new TitleScene(this.mode === 'game' ? 0 : 1));
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawHeading(ctx, this.mode === 'practice' ? '難易度選択（プラクティス）' : '難易度選択', 'Select Difficulty');
    for (let i = 0; i < 4; i++) {
      const on = i === this.sel;
      const y = 110 + i * 86;
      ctx.fillStyle = on ? 'rgba(60,40,120,0.75)' : 'rgba(20,14,50,0.55)';
      ctx.fillRect(150, y, 340, 76);
      ctx.strokeStyle = on ? DIFF_COLORS[i] : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = on ? 2 : 1;
      ctx.strokeRect(150.5, y + 0.5, 339, 75);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `italic 700 ${on ? 34 : 28}px ${FONT_EN}`;
      strokeText(ctx, DIFF_NAMES[i], SCREEN_W / 2, y + 30, on ? DIFF_COLORS[i] : '#8a84a8', 'rgba(0,0,0,0.8)', 3);
      ctx.font = `13px ${FONT_JP}`;
      ctx.fillStyle = on ? '#f0eaff' : '#8a84a8';
      ctx.fillText(DIFF_DESC[i], SCREEN_W / 2, y + 58);
    }
    drawBackButton(ctx);
  }
}

// ------------------------------------------------------------
//  キャラクター選択
// ------------------------------------------------------------
class CharacterScene {
  constructor(mode, diff) {
    this.mode = mode;
    this.diff = diff;
    this.ids = ['reimu', 'marisa'];
    this.sel = Math.max(0, this.ids.indexOf(Store.get('lastChar', 'reimu')));
    this.frame = 0;
  }
  update() {
    this.frame++;
    menuBG().update();
    this.sel = menuMove(this.sel, 2, 'left', 'right');
    let tap = -1;
    if (Input.tapIn(20, 90, 290, 360)) tap = 0;
    if (Input.tapIn(330, 90, 290, 360)) tap = 1;
    const tapConfirm = tap >= 0 && tap === this.sel;
    if (tap >= 0 && tap !== this.sel) { this.sel = tap; Sound.se('cursor'); }
    if ((Input.pressed('shot') || tapConfirm) && this.frame > 8) {
      Sound.se('ok');
      const id = this.ids[this.sel];
      Store.set('lastChar', id);
      if (this.mode === 'practice') Game.setScene(new StageSelectScene(this.diff, id));
      else Game.setScene(new GameScene({ difficulty: this.diff, character: id, stage: 0 }));
    } else if (backPressed()) {
      Sound.se('cancel');
      Game.setScene(new DifficultyScene(this.mode));
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawHeading(ctx, 'キャラクター選択', 'Select Player');
    this.ids.forEach((id, i) => {
      const on = i === this.sel;
      const x = 20 + i * 310, y = 90, w = 290, h = 360;
      ctx.fillStyle = on ? 'rgba(50,34,110,0.8)' : 'rgba(16,12,40,0.6)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = on ? CHARA_INFO[id].color : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = on ? 2 : 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.globalAlpha = on ? 1 : 0.5;
      drawPortrait(ctx, id, x + 70, y + 150, 3.4, on ? 'happy' : 'normal', this.frame);
      ctx.globalAlpha = 1;
      const tx = x + 132;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = `12px ${FONT_JP}`;
      ctx.fillStyle = '#d0c8f0';
      ctx.fillText(CHARA_INFO[id].title, tx, y + 36);
      ctx.font = `800 22px ${FONT_JP}`;
      strokeText(ctx, CHARA_INFO[id].name, tx, y + 62, on ? CHARA_INFO[id].color : '#b0a8d0', 'rgba(0,0,0,0.8)', 3);
      const pt = PLAYER_TYPES[id];
      ctx.font = `12px ${FONT_JP}`;
      ctx.fillStyle = on ? '#f0eaff' : '#9890b8';
      wrapText(ctx, pt.desc, 140).forEach((ln, k) => ctx.fillText(ln, tx, y + 96 + k * 18));
      ctx.font = `12px ${FONT_JP}`;
      ctx.fillStyle = on ? '#ffe8b0' : '#8a84a8';
      ctx.fillText('ショット', x + 20, y + 262);
      ctx.fillStyle = on ? '#f0eaff' : '#9890b8';
      pt.shotDesc.forEach((s, k) => ctx.fillText(s, x + 30, y + 282 + k * 18));
      ctx.fillStyle = on ? '#ffe8b0' : '#8a84a8';
      ctx.fillText('ボム', x + 20, y + 326);
      ctx.fillStyle = on ? '#f0eaff' : '#9890b8';
      ctx.fillText(pt.bombName, x + 30, y + 344);
    });
    ctx.textAlign = 'center';
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = 'rgba(220,210,255,0.8)';
    ctx.fillText(Input.isTouch ? 'もう一度タップで決定' : '←→：選択　Z：決定　X：戻る', SCREEN_W / 2, 468);
    drawBackButton(ctx);
  }
}

// ------------------------------------------------------------
//  プラクティスのステージ選択
// ------------------------------------------------------------
class StageSelectScene {
  constructor(diff, charId) {
    this.diff = diff;
    this.charId = charId;
    this.sel = 0;

    ctx.fillStyle = '#c8c0e8';

}

// ------------------------------------------------------------
//  ミュージックルーム

class MusicRoomScene {

}

// ------------------------------------------------------------
//  操作説明とお話
// ------------------------------------------------------------
class ManualScene {
  constructor() { this.frame = 0; }
  update() {
    this.frame++;
    menuBG().update();
    if ((Input.pressed('shot') || backPressed() || (Input.anyTap() && !Input.tapIn(10, 10, 70, 30))) && this.frame > 10) {
      Sound.se('cancel');
      Game.setScene(new TitleScene(3));
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(6,4,20,0.72)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawHeading(ctx, '操作説明とお話', 'How to Play');
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = `700 15px ${FONT_JP}`;
    ctx.fillStyle = '#ffe8b0';
    ctx.fillText('― お話 ―', 40, 96);
    ctx.font = `13px ${FONT_JP}`;
    ctx.fillStyle = '#ece6ff';
    let y = 122;
    for (const para of INTRO_TEXT) {
      for (const ln of wrapText(ctx, para, 250)) { ctx.fillText(ln, 40, y); y += 20; }
      y += 6;
    }
    ctx.font = `700 15px ${FONT_JP}`;
    ctx.fillStyle = '#ffe8b0';
    ctx.fillText('― 操作 ―', 330, 96);
    const rows = [
      ['↑↓←→', '移動'],
      ['Z', 'ショット／決定'],
      ['X', 'ボム／戻る'],
      ['Shift', '低速移動（当たり判定を表示）'],
      ['Esc', '一時停止'],
      ['Ctrl', '会話スキップ'],
      ['M', '音のオン／オフ'],
      ['タッチ', 'ドラッグで移動・自動ショット'],
    ];
    ctx.font = `13px ${FONT_JP}`;
    rows.forEach(([k, v], i) => {
      ctx.fillStyle = '#b8e0ff';
      ctx.fillText(k, 330, 122 + i * 21);
      ctx.fillStyle = '#ece6ff';
      ctx.fillText(v, 400, 122 + i * 21);
    });
    ctx.font = `700 15px ${FONT_JP}`;
    ctx.fillStyle = '#ffe8b0';
    ctx.fillText('― システム ―', 330, 300);
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = '#ece6ff';
    const sys = [
      '当たり判定は自機の中心の小さな点だけ。',
      '弾にかすると「グレイズ」で得点が入ります。',
      '被弾直後にボムを押すと、喰らいボムで助かります。',
      '画面上部に行くとアイテムを自動回収。',
      '「点」アイテムを集めると残機が増えます。',
    ];
    sys.forEach((s, i) => ctx.fillText(s, 330, 324 + i * 19));
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(220,210,255,0.8)';
    ctx.fillText(Input.isTouch ? 'タップで戻る' : 'Z / X で戻る', SCREEN_W / 2, 462);
  }
}

// ------------------------------------------------------------
//  オプション
// ------------------------------------------------------------
class OptionScene {
  constructor() {
    this.sel = 0;
    this.frame = 0;
    this.rects = [];
  }
  update() {
    this.frame++;
    menuBG().update();
    this.sel = menuMove(this.sel, 4);
    const tap = menuTapIndex(this.rects);
    let delta = 0;
    if (Input.repeat('left')) delta = -1;
    if (Input.repeat('right')) delta = 1;
    if (tap >= 0) {
      const t = Input.taps[0];
      this.sel = tap;
      if (tap < 3) delta = t.x > 400 ? 1 : -1;
    }
    if (delta && this.sel < 3) {
      Sound.se('cursor');
      if (this.sel === 0) Sound.setVolumes(clamp(Math.round((Sound.bgmVolume + delta * 0.1) * 10) / 10, 0, 1), Sound.seVolume);
      if (this.sel === 1) Sound.setVolumes(Sound.bgmVolume, clamp(Math.round((Sound.seVolume + delta * 0.1) * 10) / 10, 0, 1));
      if (this.sel === 2) { Settings.lives = clamp(Settings.lives + delta, 0, 5); Store.set('lives', Settings.lives); }
    }
    if ((this.sel === 3 && (Input.pressed('shot') || tap === 3)) || backPressed()) {
      Sound.se('cancel');
      Game.setScene(new TitleScene(4));
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    drawHeading(ctx, 'オプション', 'Option');
    const items = ['BGM 音量', '効果音 音量', '初期残機', '戻る'];
    this.rects = drawMenuList(ctx, items, this.sel, 150, 150, 56, { size: 20, hitW: 420 });
    const vals = [`${Math.round(Sound.bgmVolume * 100)}%`, `${Math.round(Sound.seVolume * 100)}%`, `${Settings.lives}`];
    ctx.textAlign = 'center';
    vals.forEach((v, i) => {
      const on = i === this.sel;
      ctx.font = `700 20px ${FONT_EN}`;
      strokeText(ctx, `◀  ${v}  ▶`, 460, 150 + i * 56, on ? '#fff3c8' : '#a8a0cc', 'rgba(0,0,0,0.8)', 3);
    });
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = 'rgba(220,210,255,0.8)';
    ctx.fillText('←→：変更　X：戻る', SCREEN_W / 2, 462);
    drawBackButton(ctx);
  }
}

// ------------------------------------------------------------
//  エンディング
// ------------------------------------------------------------
class EndingScene {
  constructor(g) {
    this.g = g;
    this.data = ENDINGS[g.charId];
    this.page = 0;
    this.frame = 0;
    this.pageFrame = 0;
  }
  enter() { Sound.playBgm('title'); }
  update() {
    this.frame++;
    this.pageFrame++;
    menuBG().update();
    const total = this.data.pages.length + 1;
    if ((Input.pressed('shot') || Input.anyTap()) && this.pageFrame > 30) {
      this.page++;
      this.pageFrame = 0;
      if (this.page >= total) Game.setScene(new ResultScene(this.g, 'clear'));
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(0,0,10,0.45)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    const a = Math.min(1, this.pageFrame / 30);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (this.page < this.data.pages.length) {
      drawPortrait(ctx, this.g.charId, 130, 372, 3, this.page === 2 ? 'smug' : 'normal', this.frame);
      if (this.page >= 1 && this.g.charId === 'marisa') drawPortrait(ctx, 'star', 510, 380, 2.6, this.page >= 3 ? 'happy' : 'normal', this.frame, true);
      ctx.font = `16px ${FONT_JP}`;
      const lines = this.data.pages[this.page].split('\n');
      lines.forEach((ln, i) => strokeText(ctx, ln, SCREEN_W / 2, 150 + (i - (lines.length - 1) / 2) * 32, '#f4f0ff', 'rgba(10,0,30,0.9)', 4));
    } else {
      ctx.font = `italic 700 20px ${FONT_EN}`;
      strokeText(ctx, `Ending No.${this.g.charId === 'reimu' ? 1 : 2}`, SCREEN_W / 2, 150, '#e8d8a8', 'rgba(0,0,0,0.8)', 3);
      ctx.font = `800 30px ${FONT_JP}`;
      strokeText(ctx, `「${this.data.title}」`, SCREEN_W / 2, 196, '#ffffff', 'rgba(60,20,120,0.9)', 4);
      ctx.font = `italic 600 22px ${FONT_EN}`;
      strokeText(ctx, 'Thank you for playing!', SCREEN_W / 2, 262, '#ffe8b0', 'rgba(0,0,0,0.8)', 3);
      ctx.font = `12px ${FONT_JP}`;
      ctx.fillStyle = '#d0c8f0';
      ctx.fillText('原作：東方Project（上海アリス幻樂団）', SCREEN_W / 2, 320);
      ctx.fillText('二次創作：tohounizisousaku', SCREEN_W / 2, 342);
    }
    ctx.globalAlpha = 1;
  }
}

// ------------------------------------------------------------
//  リザルト
// ------------------------------------------------------------
class ResultScene {
  constructor(g, kind) {
    this.g = g;
    this.kind = kind;
    this.frame = 0;
    this.newRecord = !g.practice && !g.cheat && g.score >= Store.get(g.hiKey, 0) && g.score > 0;
  }
  enter() { if (this.kind !== 'clear') Sound.playBgm('title'); }
  update() {
    this.frame++;
    menuBG().update();
    if ((Input.pressed('shot') || Input.anyTap()) && this.frame > 40) {
      Sound.se('ok');
      Game.setScene(new TitleScene());
    }
  }
  draw(ctx) {
    menuBG().draw(ctx);
    ctx.fillStyle = 'rgba(0,0,10,0.6)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    const g = this.g;
    const title = { clear: 'All Clear!', practice: 'Practice Result', gameover: 'Game Over' }[this.kind];
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `italic 700 36px ${FONT_EN}`;
    strokeText(ctx, title, SCREEN_W / 2, 64, this.kind === 'gameover' ? '#ff9aa8' : '#ffe8a0', 'rgba(0,0,0,0.8)', 4);
    const rows = [
      ['キャラクター', CHARA_INFO[g.charId].name],
      ['難易度', DIFF_NAMES[DIFF]],
      ['スコア', padScore(g.score)],
      ['到達ステージ', `Stage ${g.stageIndex + 1}`],
      ['ミス回数', String(g.misses)],
      ['ボム使用', String(g.bombsUsed)],
      ['スペルカード取得', `${g.spellsGot} / ${g.spellsSeen}`],
      ['グレイズ', String(g.graze)],
      ['コンティニュー', String(g.continues)],
    ];
    rows.forEach(([k, v], i) => {
      const y = 120 + i * 30;
      ctx.textAlign = 'left';
      ctx.font = `14px ${FONT_JP}`;
      ctx.fillStyle = '#d8d0ff';
      ctx.fillText(k, 170, y);
      ctx.textAlign = 'right';
      ctx.font = `700 18px ${FONT_JP}`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(v, 470, y);
    });
    if (this.newRecord) {
      ctx.textAlign = 'center';
      ctx.font = `800 18px ${FONT_JP}`;
      strokeText(ctx, '★ ハイスコア更新！ ★', SCREEN_W / 2, 408, '#ffe070', 'rgba(0,0,0,0.8)', 3);
    }
    ctx.textAlign = 'center';
    ctx.font = `12px ${FONT_JP}`;
    ctx.fillStyle = 'rgba(220,210,255,0.8)';
    ctx.fillText(Input.isTouch ? 'タップでタイトルへ' : 'Z でタイトルへ', SCREEN_W / 2, 456);
  }
}

</script>
<script>
'use strict';
// ============================================================
//  起動・メインループ
// ============================================================

const Game = {
  canvas: null,
  ctx: null,
  scene: null,
  frame: 0,
  fps: 60,
  fade: 0,
  scale: 1,

  setScene(s) {
    if (this.scene && this.scene.exit) this.scene.exit();
    this.scene = s;
    this.fade = 1;
    if (s.enter) s.enter();
  },

  update() {
    Input.update();
    this.scene.update();
    Sound.flush();
    this.frame++;
    if (this.fade > 0) this.fade = Math.max(0, this.fade - 0.06);
  },

  draw() {
    const ctx = this.ctx;
    ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    this.scene.draw(ctx);
    if (this.fade > 0) {
      ctx.setTransform(this.scale, 0, 0, this.scale, 0, 0);
      ctx.fillStyle = `rgba(0,0,0,${this.fade})`;
      ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    }
  },

  resize() {
    const wrap = this.canvas.parentElement;
    const availW = wrap.clientWidth, availH = wrap.clientHeight;
    const s = Math.min(availW / SCREEN_W, availH / SCREEN_H);
    const cssW = Math.floor(SCREEN_W * s), cssH = Math.floor(SCREEN_H * s);
    this.canvas.style.width = cssW + 'px';
    this.canvas.style.height = cssH + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const k = Math.min(s * dpr, 2.5);
    this.canvas.width = Math.round(SCREEN_W * k);
    this.canvas.height = Math.round(SCREEN_H * k);
    this.scale = this.canvas.width / SCREEN_W;
  },
};

function bootGame() {
  const canvas = document.getElementById('game');
  Game.canvas = canvas;
  Game.ctx = canvas.getContext('2d');
  Game.resize();
  window.addEventListener('resize', () => Game.resize());
  Input.init(canvas);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && Game.scene instanceof GameScene && !Game.scene.paused && !Game.scene.continueMenu) Game.scene.openPause();
  });

  const start = document.getElementById('start');
  const begin = () => {
    if (start) start.hidden = true;
    Sound.unlock();
    canvas.focus();
  };
  if (start) {
    start.addEventListener('click', begin);
    Input.onFirstInput = begin;
  }

  Game.setScene(new TitleScene());

  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0, fpsT = last, fpsN = 0, errShown = false;
  function loop(now) {
    requestAnimationFrame(loop);
    acc += Math.min(now - last, 100);
    last = now;
    let n = 0;
    try {
      while (acc >= STEP - 0.5 && n < 4) {
        Game.update();
        acc -= STEP;
        n++;
      }
      if (acc < -STEP) acc = 0;
      Game.draw();
      Sound.schedule();
    } catch (e) {
      // 1回の例外でループ全体が止まらないようにする
      if (!errShown) { console.error(e); errShown = true; }
      acc = 0;
    }
    fpsN += n;
    if (now - fpsT >= 1000) {
      Game.fps = (fpsN * 1000) / (now - fpsT);
      fpsN = 0;
      fpsT = now;
    }
  }
  requestAnimationFrame(loop);
}

// 公開ページで再読み込みされた時にも安全に起動する
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(bootGame);
else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bootGame);
else bootGame();

</script>

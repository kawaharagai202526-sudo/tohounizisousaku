<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東方星降夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600;1,700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #07051a;
    --night-2: #1a1240;
    --ink: #ece6ff;
    --ink-dim: #a8a0cc;
    --gold: #d6ba78;
    --panel: #130d2c;
    --error: #ff9aa8;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 30%, var(--night-2), var(--night) 70%);
    color: var(--ink);
    font-family: "Shippori Mincho", "Yu Mincho", "Hiragino Mincho ProN", serif;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-block: 8px;
  }
  #game {
    display: block;
    max-width: 100%;
    background: #000;
    box-shadow: 0 0 0 1px rgba(214, 186, 120, 0.35), 0 12px 40px rgba(0, 0, 0, 0.6);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }
  #game:focus-visible { box-shadow: 0 0 0 2px var(--gold); }
  #start {
    position: absolute;
    inset: 0;
    margin: auto;
    width: fit-content;
    height: fit-content;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 18px 34px;
    background: rgba(10, 6, 30, 0.88);
    border: 1px solid var(--gold);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
  }
  #start .ja { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
  #start .en { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 15px; color: var(--ink-dim); }
  #start:hover, #start:focus-visible { background: rgba(40, 24, 90, 0.92); outline: none; }
  #start[hidden] { display: none; }
  #hint {
    display: none;
    margin: 0;
    padding-block: 6px 10px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-dim);
  }
  @media (orientation: portrait) and (max-width: 720px) {
    #hint { display: block; }
  }

  /* ---------- 管理者ページ ---------- */
  #adminHotspot {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    width: 76px;
    height: 32px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 0 0 8px 0;
    background: transparent;
    cursor: pointer;
    z-index: 30;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  #adminHotspot:focus-visible {
    background: rgba(214, 186, 120, 0.16);
    border-color: rgba(214, 186, 120, 0.75);
    box-shadow: 0 0 14px rgba(214, 186, 120, 0.4);
    outline: none;
  }
  /* カーソルを合わせたときだけ光る（タッチ画面ではタップ後に光ったまま残らないようにする） */
  @media (hover: hover) {
    #adminHotspot:hover {
      background: rgba(214, 186, 120, 0.16);
      border-color: rgba(214, 186, 120, 0.75);
      box-shadow: 0 0 14px rgba(214, 186, 120, 0.4);
    }
  }
  #adminOverlay, #accountOverlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
    background: rgba(4, 2, 16, 0.74);
  }
  #adminOverlay[hidden], #accountOverlay[hidden] { display: none; }
  .admin-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    max-width: 100%;
    max-height: 100%;
    background: var(--panel);
    border: 1px solid var(--gold);
    box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
    color: var(--ink);
  }
  .admin-square {
    width: min(360px, 100%);
    aspect-ratio: 1 / 1;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 24px;
  }
  .admin-wide {
    width: min(940px, 100%);
    height: min(660px, 100%);
    gap: 14px;
    padding: 18px 22px;
  }
  .admin-close {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 36px;
    height: 36px;
    font: inherit;
    font-size: 22px;
    line-height: 1;
    color: var(--ink-dim);
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .admin-close:hover, .admin-close:focus-visible { color: var(--ink); outline: 1px solid var(--gold); }
  .admin-title { margin: 0; font-size: 22px; letter-spacing: 0.12em; }
  .admin-pinbox {
    position: relative;
    display: block;
    width: 100%;
    max-width: 270px;
    padding-block: 14px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--gold);
    text-align: center;
    cursor: text;
  }
  .admin-pinbox:focus-within { box-shadow: 0 0 0 2px rgba(214, 186, 120, 0.6); }
  .admin-slots {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 30px;
    letter-spacing: 0.38em;
    padding-left: 0.38em;
  }
  .admin-pininput {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: 0;
    font-size: 16px;
    cursor: text;
  }
  .admin-msg { min-height: 2.8em; margin: 0; font-size: 13px; line-height: 1.5; text-align: center; color: var(--ink-dim); }
  .admin-msg.is-error { color: var(--error); }
  .shake { animation: adminShake 0.35s; }
  @keyframes adminShake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  .admin-btn {
    display: block;
    width: 100%;
    padding: 14px 18px;
    font: inherit;
    font-size: 17px;
    text-align: left;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(214, 186, 120, 0.55);
    cursor: pointer;
  }
  .admin-btn:hover:not(:disabled), .admin-btn:focus-visible { background: rgba(214, 186, 120, 0.18); outline: none; }
  .admin-btn:disabled { color: var(--ink-dim); opacity: 0.55; cursor: not-allowed; }
  .admin-btn-top { width: auto; padding-inline: 28px; text-align: center; letter-spacing: 0.08em; }
  .admin-keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; width: 100%; margin: 0; padding: 0; list-style: none; font-size: 12px; }
  .admin-keys li { display: flex; align-items: center; gap: 6px; padding: 3px 6px; color: var(--ink-dim); border: 1px solid rgba(255, 255, 255, 0.08); }
  .admin-keys b { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
  .admin-keys .is-on { color: var(--night); background: var(--gold); border-color: var(--gold); }
  .admin-keys .is-on b { color: var(--night); }
  .admin-keymsg { min-height: 1.5em; }
  .admin-mini {
    font: inherit;
    font-size: 12px;
    padding: 4px 9px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(214, 186, 120, 0.5);
    cursor: pointer;
    white-space: nowrap;
  }
  .admin-mini:hover, .admin-mini:focus-visible { background: rgba(214, 186, 120, 0.18); outline: none; }
  .admin-mini.is-danger { border-color: rgba(255, 154, 168, 0.7); color: var(--error); }
  .admin-mini.is-danger:hover, .admin-mini.is-danger:focus-visible { background: rgba(255, 154, 168, 0.16); }
  .admin-ops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .admin-ops input { width: 9em; font: inherit; font-size: 13px; padding: 3px 6px; color: var(--ink); background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(214, 186, 120, 0.55); }
  .admin-ops .admin-optext { font-size: 12px; }
  .admin-status { min-height: 1.4em; margin: 0 0 8px; font-size: 13px; color: #9af0b8; }
  .admin-status.is-error { color: var(--error); }
  .admin-badge { margin-left: 6px; padding: 1px 6px; font-size: 11px; color: var(--night); background: var(--gold); }
  .admin-table td.num, .acct-table td.num { text-align: right; }
  .admin-lines span { display: block; }
  .admin-table td { vertical-align: middle; }
  .admin-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }

  /* ---------- アカウント画面 ---------- */
  .acct-panel { width: min(400px, 100%); gap: 14px; padding: 24px 26px; overflow: auto; }
  .acct-title { margin: 0; font-size: 20px; letter-spacing: 0.1em; }
  .acct-tabs { display: flex; border-bottom: 1px solid rgba(214, 186, 120, 0.35); }
  .acct-tab {
    flex: 1;
    padding: 10px;
    font: inherit;
    font-size: 15px;
    color: var(--ink-dim);
    background: transparent;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .acct-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
  .acct-tab:hover, .acct-tab:focus-visible { color: var(--ink); outline: none; background: rgba(214, 186, 120, 0.08); }
  .acct-form { display: flex; flex-direction: column; gap: 12px; }
  .acct-field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-dim); }
  .acct-input {
    font: inherit;
    font-size: 16px;
    padding: 9px 12px;
    color: var(--ink);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(214, 186, 120, 0.55);
  }
  .acct-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(214, 186, 120, 0.4); }
  .acct-msg { min-height: 1.5em; text-align: left; }
  .acct-submit { text-align: center; letter-spacing: 0.08em; }
  .acct-note { margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink-dim); }
  .acct-welcome { margin: 0; font-size: 14px; color: #9af0b8; }
  .acct-who { display: flex; flex-direction: column; gap: 2px; margin: 0; font-size: 13px; color: var(--ink-dim); }
  .acct-name { font-size: 22px; color: var(--ink); word-break: break-all; }
  .acct-table { width: 100%; }
  .acct-row { display: flex; gap: 10px; }
  .admin-label { margin: 0; font-size: 15px; }
  .admin-keyinput {
    width: 64px;
    height: 64px;
    box-sizing: border-box;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 30px;
    text-align: center;
    color: var(--ink);
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--gold);
  }
  .admin-keyinput:focus { outline: none; box-shadow: 0 0 0 2px rgba(214, 186, 120, 0.6); }
  .admin-heading { margin: 0; font-size: 20px; letter-spacing: 0.08em; }
  .admin-menu { display: flex; flex-direction: column; gap: 12px; width: min(520px, 100%); margin-top: 6px; }
  .admin-subhead { display: flex; align-items: center; gap: 14px; padding-right: 40px; }
  .admin-back {
    font: inherit;
    font-size: 14px;
    padding: 6px 12px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(214, 186, 120, 0.55);
    cursor: pointer;
  }
  .admin-back:hover, .admin-back:focus-visible { background: rgba(214, 186, 120, 0.18); outline: none; }
  .admin-body { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
  .admin-group { margin: 18px 0 8px; font-size: 16px; color: var(--gold); letter-spacing: 0.06em; }
  .admin-group:first-child { margin-top: 4px; }
  .admin-section { margin-bottom: 14px; }
  .admin-caption { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .admin-empty { margin: 0; font-size: 13px; color: var(--ink-dim); }
  .admin-tablewrap { overflow-x: auto; }
  .admin-table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .admin-table th, .admin-table td { padding: 5px 10px; border: 1px solid rgba(214, 186, 120, 0.25); text-align: left; white-space: nowrap; }
  .admin-table th { background: rgba(214, 186, 120, 0.12); font-weight: 600; }
  .admin-chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .admin-card { margin: 0; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(214, 186, 120, 0.25); }
  .admin-card canvas { display: block; width: 100%; max-width: 180px; height: auto; margin-inline: auto; }
  .admin-card figcaption { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px 10px; font-size: 13px; }
  .admin-sub { color: var(--ink-dim); font-size: 12px; }
  .admin-note { color: var(--gold); font-size: 12px; }
  .admin-program { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; overflow: hidden; }
  .admin-files { display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .admin-file {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    text-align: left;
    padding: 6px 10px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .admin-file:hover, .admin-file:focus-visible { border-color: rgba(214, 186, 120, 0.55); outline: none; }
  .admin-file.is-active { background: rgba(214, 186, 120, 0.2); border-color: var(--gold); }
  .admin-codeview { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .admin-codeinfo { margin: 0 0 6px; font-size: 13px; color: var(--ink-dim); }
  .admin-code {
    flex: 1;
    min-height: 0;
    margin: 0;
    padding: 12px;
    overflow: auto;
    font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre;
    tab-size: 2;
    color: #dcd6f4;
    background: rgba(0, 0, 0, 0.42);
  }
  @media (max-width: 640px) {
    .admin-program { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .admin-files { flex-direction: row; overflow-x: auto; }
    .admin-file { white-space: nowrap; }
  }
</style>
</head>
<body>
<main id="wrap">
  <canvas id="game" tabindex="0" aria-label="東方星降夜のゲーム画面"></canvas>
  <button id="start" type="button">
    <span class="ja">クリックしてはじめる</span>
    <span class="en">Click to start (sound on)</span>
  </button>
</main>
<p id="hint">横向きにすると大きな画面で遊べます。ドラッグで移動、右側のボタンでボム・低速。</p>
<script src="js/util.js"></script>
<script src="js/images.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/sprites.js"></script>
<script src="js/characters.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/bullets.js"></script>
<script src="js/effects.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
<script src="js/story.js"></script>
<script src="js/stage1.js"></script>
<script src="js/stage2.js"></script>
<script src="js/stage3.js"></script>
<script src="js/stage4.js"></script>
<script src="js/menus.js"></script>
<script src="js/accounts.js"></script>
<script src="js/cheats.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
